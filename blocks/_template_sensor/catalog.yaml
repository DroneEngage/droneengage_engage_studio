# The block's own catalog fragment (SL-0030): simlib.load_catalog()
# merges blocks/<name>/catalog.yaml, so a new sensor module registers
# here - one folder, no modules/catalog.yaml edit. Bare relative
# bin/template paths resolve inside this directory; `stub: true` gets
# the world `stub:` config injected on world: scenarios.
stub_@NAME@:
  repo: droneengage_simulation_land
  bin: stub_@NAME@.py
  template: stub.json
  start_delay: 3
  # no port field: the module's s2s listening port is a machine-wide
  # allocator lease (unit.<unit>.stub_@NAME@) filled at `sim up`
  stub: true
  # pose: true              # uncomment if this sensor rides an FC unit
  local: {file: stub_@NAME@.local}
