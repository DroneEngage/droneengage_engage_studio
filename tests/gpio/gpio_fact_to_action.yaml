# gpio/gpio_fact_to_action - GF-07: the sanctioned cross-unit path. A
# declared gpio.btn.went_on notification republishes onto the fleet bus
# (1090); node_b's remote_lit mission triggers on it only when the fact
# did not originate locally (event.src != self.party) and performs the
# gpio.led capability action. node_a's own copy of the mission is
# filtered out, so its led stays off - facts travel the bus, actions are
# invoked locally.
version: 1
name: gpio_fact_to_action
transport: fake
operation: ../../packages/gpio_action.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: node_a, cls: static_gpio}
  - {id: node_b, cls: static_gpio}
timeline:
  # normalize the seam file before the restarts so both units boot with
  # released inputs
  - {t: 0, do: write_file, unit: node_a, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 0, do: write_file, unit: node_b, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 2, do: restart, unit: all, proc: de_gpio}
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 17, do: wait_journal, unit: node_b, re: "RUN run .* started",
     timeout: 30}
  - {t: 25, do: write_file, unit: node_a, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 1, "27": 1}}
  - {t: 28, do: wait_journal, unit: node_b,
     re: "S: remote_lit activated", timeout: 30}
  - {t: 30, do: wait_journal, unit: node_b,
     re: "ACTION_RESULT .* ok \\(gpio\\.led\\)", timeout: 15}
  - {t: 34, do: wait, seconds: 4}
  - {t: 38, do: stop}
assert:
  # node_b: the republished fact (src node_a) triggered the action once
  - journal_count: {unit: node_b,
                    re: "EVENT_IN event gpio\\.btn\\.went_on latched \\(from node_a\\)",
                    at_least: 1}
  - journal_count: {unit: node_b, re: "S: remote_lit activated",
                    equals: 1}
  - journal_count: {unit: node_b,
                    re: "ACTION_RESULT .* ok \\(gpio\\.led\\)",
                    equals: 1}
  - journal_count: {unit: node_b,
                    re: "EVENT_IN event gpio\\.led\\.went_on latched",
                    at_least: 1}
  - journal_count: {unit: node_b, re: "state gpio\\.led = 1",
                    at_least: 1}
  # node_a: its own press was filtered out - led untouched
  - journal_count: {unit: node_a, re: "S: remote_lit activated",
                    equals: 0}
  - journal_count: {unit: node_a,
                    re: "ACTION_RESULT .* \\(gpio\\.led\\)",
                    equals: 0}
  - journal_count: {unit: node_a, re: "state gpio\\.led = 1",
                    equals: 0}
teardown: none
