# gpio/gpio_input_baseline - GF-07 / GF-03: an INPUT pin that boots
# high seeds the debounce baseline silently. btn_low (GPIO 27,
# active_low, debounce_ms 50) is written released ({"27":1}) BEFORE
# de_gpio restarts, so its first sample reads high and stores it without
# an edge. The later {"27":0} press must be the first edge: one
# went_on, one mission activation, no went_off.
#
# Pre-GF-03 the baseline never reached the driver: boot-high left the
# pin at 0, the real press found no edge, and the mission never fired.
version: 1
name: gpio_input_baseline
transport: fake
operation: ../../packages/gpio_baseline.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: node, cls: static_gpio}
timeline:
  # normalize the seam file BEFORE the restart: the file persists in the
  # module dir, so the fresh de_gpio's first sample reads the intended
  # baseline (btn released, btn_low released)
  - {t: 0, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 2, do: restart, unit: node, proc: de_gpio}
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  # the real press: raw 0 = logical on for the active-low pin
  - {t: 25, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 0}}
  - {t: 27, do: wait_journal, unit: node,
     re: "S: armed activated", timeout: 30}
  - {t: 30, do: wait, seconds: 3}
  - {t: 35, do: stop}
assert:
  - journal_count: {unit: node, re: "S: armed activated", equals: 1}
  - journal_count: {unit: node, re: "S: armed emit baseline\\.fired",
                    equals: 1}
  - journal_count: {unit: node,
                    re: "EVENT_IN event gpio\\.btn_low\\.went_on latched",
                    equals: 1}
  - journal_count: {unit: node,
                    re: "EVENT_IN event gpio\\.btn_low\\.went_off latched",
                    equals: 0}
  - journal_count: {unit: node,
                    re: "state gpio\\.btn_low = 1",
                    at_least: 1}
teardown: none
