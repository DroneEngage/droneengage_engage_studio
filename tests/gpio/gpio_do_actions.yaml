# gpio/gpio_do_actions - GE-07 acceptance 3: per-pin capability actions
# through the supervisor's `do` step and the namespace-owner invoke
# path. Each do must journal its step result ok:
#
#   led   {on:true}                    digital write
#   flash {on:true, pulse_ms:300}      pulse: assert, wait 300 ms, restore
#   servo {pwm:102}                    PWM width (51 -> 102 = 'changed')
version: 1
audience: extended
requires: []
name: gpio_do_actions
tier: smoke
transport: fake
operation: ops/gpio_actions.deop
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: actor, cls: static_gpio}
timeline:
  # restart de_gpio first: led/servo state lives in the module process -
  # a repeated run needs led off and servo back at width 51 or the
  # on/changed edges the asserts count never happen
  - {t: 0, do: restart, unit: actor, proc: de_gpio}
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 20, do: wait_journal, unit: actor,
     re: "S: pins led ok", timeout: 30}
  - {t: 25, do: wait_journal, unit: actor,
     re: "S: pins flash ok", timeout: 30}
  - {t: 30, do: wait_journal, unit: actor,
     re: "S: pins servo ok", timeout: 30}
  - {t: 35, do: stop}
assert:
  - journal_count: {unit: actor, re: "S: pins activated", equals: 1}
  - journal_count: {unit: actor, re: "S: pins led ok", equals: 1}
  - journal_count: {unit: actor, re: "S: pins flash ok", equals: 1}
  - journal_count: {unit: actor, re: "S: pins servo ok", equals: 1}
  - journal_count: {unit: actor,
                    re: "ACTION_RESULT .* ok \\(gpio\\.led\\)",
                    equals: 1}
  - journal_count: {unit: actor,
                    re: "ACTION_RESULT .* ok \\(gpio\\.flash\\)",
                    equals: 1}
  - journal_count: {unit: actor,
                    re: "ACTION_RESULT .* ok \\(gpio\\.servo\\)",
                    equals: 1}
  - journal_count: {unit: actor, re: "failed:", equals: 0}
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.led\\.went_on latched",
                    at_least: 1}
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.flash\\.went_on latched",
                    at_least: 1}
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.flash\\.went_off latched",
                    at_least: 1}
  # servo was already on (width 51): 102 is a width change, not an edge
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.servo\\.changed latched",
                    at_least: 1}
teardown: none
