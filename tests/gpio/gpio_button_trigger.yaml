# gpio/gpio_button_trigger - GE-07 acceptance 4 + GF-07: a debounced
# INPUT pin (btn, GPIO 17, debounce_ms 300) drives gpio.btn.went_on;
# the lamp mission activates on it and switches led on.
#
#   t=20  write {"17":1}                    -> went_on -> lamp activates
#   t=30  write {"17":0} + 150 ms {"17":1}  -> a real bounce: the dip
#          holds 150 ms plus up to one 100 ms read-window lag, always
#          under the 300 ms debounce - no went_off, no second went_on
#   t=40  write {"17":0}, held 2 s          -> a genuine release:
#          exactly one went_off
version: 1
audience: extended
requires: []
name: gpio_button_trigger
transport: fake
operation: ops/gpio_button.deop
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: node, cls: static_gpio}
timeline:
  # restart de_gpio first (the lamp's led stays on across repeated runs)
  # and normalize gpio_inputs.json to 0 before the package loads: the
  # file persists between runs, so a second run would find the button
  # already pressed and produce no went_on edge
  - {t: 0, do: restart, unit: node, proc: de_gpio}
  - {t: 2, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 20, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 1, "27": 1}}
  - {t: 22, do: wait_journal, unit: node,
     re: "S: lamp activated", timeout: 30}
  - {t: 23, do: wait_journal, unit: node,
     re: "S: lamp lit ok", timeout: 30}
  # the bounce: 150 ms low inside ONE write_file call - under the 300 ms
  # debounce even after the <=100 ms seam latency
  - {t: 30, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1},
     also: [{path: gpio_inputs.json, json: {"17": 1, "27": 1},
             delay_ms: 150}]}
  - {t: 35, do: wait, seconds: 5}
  # the genuine release: low held well past the debounce
  - {t: 40, do: write_file, unit: node, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 41, do: wait_journal, unit: node,
     re: "EVENT_IN event gpio\\.btn\\.went_off latched", timeout: 15}
  - {t: 42, do: wait, seconds: 2}
  - {t: 45, do: stop}
assert:
  - journal_count: {unit: node, re: "S: lamp activated", equals: 1}
  - journal_count: {unit: node, re: "S: lamp lit ok", equals: 1}
  - journal_count: {unit: node,
                    re: "EVENT_IN event gpio\\.led\\.went_on latched",
                    at_least: 1}
  - journal_count: {unit: node,
                    re: "EVENT_IN event gpio\\.btn\\.went_on latched",
                    equals: 1}
  - journal_count: {unit: node,
                    re: "EVENT_IN event gpio\\.btn\\.went_off latched",
                    equals: 1}
  - journal_count: {unit: node,
                    re: "already active - gpio\\.btn\\.went_on",
                    equals: 0}
teardown: none
