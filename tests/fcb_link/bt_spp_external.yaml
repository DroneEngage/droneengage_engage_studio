# bt_spp_external: the SL-0105 `fcb_link: {kind: bt_spp}` path - SITL's
# serial1 fronts the fcb proxy, the proxy fronts a host Bluetooth
# RFCOMM SPP server (engine/bt_spp_bridge.py, proc `bt_spp`), and the
# FC client is `fc_client: external`: no local de_comm/de_mavlink -
# the client is a device off-host (an Android phone running Andruav,
# or a Pi) paired with the host, dialing the SPP channel like a drone
# FC port (docs/HIL.md).
#
# HARDWARE-GATED: the run SKIPs cleanly (exit 0) when no UP Bluetooth
# controller is on this host - scenario_runner checks before bring-up.
# With a powered controller but no client dialing in, fcb_stats fails
# for real (a listening channel nobody called carries nothing).
version: 1
name: f_bt_spp_ext
tasks: [SL-0105]
transport: real
realtime: true
settle_s: 15
fleet:
  - {id: c1, cls: copter, fc_client: external,
     fcb_link: {kind: bt_spp, channel: 1}}
timeline:
  # give the external client a real window to pair/dial, pull params
  # and stream - SITL emits s2c the whole time, the client's
  # heartbeats/requests are the c2s half
  - {t: 0, do: wait, seconds: 30}
  # the SL-0103 fault applies to the serial bridge on this kind too:
  # stopping it closes the RFCOMM channel - the client sees the link
  # drop, then a redial lands once replug brings the listener back
  - {t: 0, fault: fcb_unplug, unit: c1, dur_s: 5}
  - {t: 0, do: wait, seconds: 25}
assert:
  # the bridge counted real bytes each way (counters are cumulative,
  # so the unplug window cannot erase pre-fault evidence)
  - fcb_stats: {unit: c1, direction: c2s, min_bytes: 1}
  - fcb_stats: {unit: c1, direction: s2c, min_bytes: 1}
  - proc_alive: {unit: c1, proc: bt_spp}
  - proc_alive: {unit: c1, proc: fcb_proxy}
  - proc_alive: {unit: c1, proc: sitl}
  - no_unexpected_restart: {}
teardown: none
