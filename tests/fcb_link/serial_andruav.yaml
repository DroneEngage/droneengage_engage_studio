# serial_andruav: the SL-0104 `fcb_link: {kind: host_serial}` path
# proven against the client it exists for - an Android phone running
# Andruav's USB-serial (OTG) FC connection. SITL's serial1 fronts the
# fcb proxy, the proxy fronts a socat bridge bound to a REAL host
# USB-serial adapter (raw, echo=0, 57600 baud), and the FC client is
# `fc_client: external`: no local de_comm/de_mavlink - the phone's own
# USB-serial adapter is wired TX->RX / RX->TX / GND to the host one
# (wiring in docs/HIL.md).
#
# Manual part: wire the adapters crossed, attach the phone's OTG
# adapter, pick the USB device in the app's FC connection and connect
# inside the first wait window - the timeline then pulls the bridge
# for 5s (fcb_unplug - the wire goes silent like a cable pull) and the
# app's redial on replug is part of the proof.
#
# What it proves: MAVLink moves BOTH ways over the real serial wire
# (s2c telemetry, c2s heartbeats/param requests) through the bridged
# host adapter - the same counters a wired drone FC port would show.
#
# HARDWARE-GATED: the run SKIPs cleanly (exit 0) when the adapter is
# not attached - scenario_runner checks the device before bring-up.
# `device:` is bench-specific - a /dev/serial/by-id path is preferred
# over ttyUSBn on benches where adapters move around.
version: 1
name: serial_andruav
transport: real
realtime: true
settle_s: 15
fleet:
  - {id: c1, cls: copter, fc_client: external,
     fcb_link: {kind: host_serial, device: /dev/ttyUSB0, baud: 57600}}
timeline:
  # give the human time to wire + pick the USB device and connect in
  # the app - SITL emits s2c the whole time, the client's
  # heartbeats/requests are the c2s half
  - {t: 0, do: wait, seconds: 45}
  # SL-0103's fault is a cable pull on the wire's far end: the phone's
  # adapter goes silent, traffic resumes on replug
  - {t: 0, fault: fcb_unplug, unit: c1, dur_s: 5}
  - {t: 0, do: wait, seconds: 25}
assert:
  # the proxy counted real bytes each way (bytes are cumulative, so
  # the unplug window cannot erase pre-fault evidence)
  - fcb_stats: {unit: c1, direction: c2s, min_bytes: 1}
  - fcb_stats: {unit: c1, direction: s2c, min_bytes: 1}
  - proc_alive: {unit: c1, proc: fcb_tty}
  - proc_alive: {unit: c1, proc: fcb_proxy}
  - proc_alive: {unit: c1, proc: sitl}
  - no_unexpected_restart: {}
teardown: none
