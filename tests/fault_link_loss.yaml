# Link faults (fake server): copter2's link gets 40% seeded loss, copter3's
# is cut for 45 s while all three fly. copter3 must notice the silent cut
# via its ping watchdog, fire comm_lost once, keep flying and come back
# only after the cut. (Port of Phase-4A fault_link_loss.yaml.)
version: 1
name: fault_link_loss
transport: {type: fake, seed: 1337}
operation: ../packages/copter_square.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: start}
  - {t: 0, fault: loss, unit: copter2, percent: 40}
  - {t: 0, fault: link_cut, unit: copter3, dur_s: 45}
  - {t: 0, do: wait_journal, unit: copter3, re: "comm line offline", timeout: 30}
  - {t: 0, do: wait_journal, unit: copter3, re: "comm line online", timeout: 90}
  - {t: 0, do: link_clear, unit: all}
  - {t: 0, do: wait_journal, unit: all, re: "mission main completed", timeout: 300}
settle_s: 0
assert:
  - journal_count: {unit: all, re: "mission main completed", at_least: 1}
  - journal_order: {unit: copter3, first: "comm line offline", then: "comm line online"}
  - journal_time_delta: {u1: copter3, re1: "comm line offline", u2: copter3, re2: "comm line online", min_s: 25, max_s: 70}
  - journal_count: {unit: copter3, re: "handler comm_lost fired", equals: 1}
  - journal_count: {unit: copter1, re: "comm line offline", equals: 0}
