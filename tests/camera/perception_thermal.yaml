# camera/perception_thermal - SL-0035 (b) acceptance: the real
# perception chain on a THERMAL stub - stub_ai_box camera_kind:thermal
# emits the de_ir_camera vocabulary (hotspot/coldspot + attrs.temp_c),
# de_comm projects it, and detect.detected declared a 'hotspot' target
# event fuses hotspot detections into world-model targets while the
# coldspot latches but never books one.
#
# Op:    tests/camera/ops/perception_thermal.deop - one static watcher,
#        detect.detected -> target 'hotspot'. The op never ends; the
#        scenario stops the run.
# World: worlds/perception_thermal.yaml - person_1 (temp_c 37) and
#        car_1 (temp_c 40) read hotspot against the ~11 C dusk ambient;
#        person_2 (temp_c -10) reads coldspot. All three sit ~1.5-3 m
#        apart under the 8 m nadir mast - inside the 25 m merge reach,
#        so the two hotspot targets stay apart only because their
#        (src, trk) keys differ. (obs_thermal's 4 m mast lets the car
#        box overflow the frame edge; de_comm's strict obs parser drops
#        the whole frame, so this world flies the camera higher.)
#
# Proves per spec:
#   - every frame's wire classes are the thermal vocabulary: the exact
#     {coldspot, hotspot, hotspot} multiset with attrs.temp_c in range
#   - hotspot detect.detected events project onto the real entities
#     (distance_to the operator-seen hotspot vs truth)
#   - the world model creates exactly the two hotspot targets - no
#     person/car/coldspot target exists, and the two hotspots do not
#     merge despite being metres apart
version: 1
audience: extended
requires: [camera, v4l2loopback]
name: perception_thermal
tasks: [SL-0035]
seed: 12
transport: fake
world: ../../worlds/perception_thermal.yaml
operation: ops/perception_thermal.deop
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
fleet:
  - {id: pcam1, cls: static, role: watcher, modules: [stub_ai_box],
     base: [-35.363262, 149.165237, 584, 0],
     config: {stub_ai_box: {camera_kind: thermal}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 33, do: wait_journal, unit: "pcam1", re: "S: .* activated",
     timeout: 120}
  - {t: 40, do: wait_journal, unit: "pcam1", re: "WM_NEW .* cls=hotspot",
     timeout: 240}
  # the steady resend keeps landing both hotspot tracks
  - {t: 45, do: wait, seconds: 25}
  - {t: 72, do: stop}
assert:
  # --- the thermal wire contract on every obs frame ------------------
  - obs_frames: {unit: pcam1, min_frames: 40,
                 cls: [coldspot, hotspot, hotspot], trk_stable: true,
                 attrs: {temp_c: {min: -11, max: 41}}}
  # --- both vocabularies really latch as events ----------------------
  - journal_count: {unit: pcam1,
                    re: 'event detect\.detected latched .* cls=hotspot',
                    at_least: 2}
  - journal_count: {unit: pcam1,
                    re: 'event detect\.detected latched .* cls=coldspot',
                    at_least: 1}
  # --- exactly the two hotspot targets form; nothing else does -------
  - journal_count: {unit: pcam1, re: 'WM_NEW \S+ cls=hotspot', equals: 2}
  - no_journal: {unit: pcam1,
                 re: 'WM_NEW \S+ cls=(person|car|coldspot)'}
  # --- the hotspot lands on a real entity, not a phantom -------------
  - distance_to: {unit: pcam1, re: "WM_NEW .* cls=hotspot",
                  truth: [person_1, car_1], detected_cls: hotspot,
                  max_m: 8}
  - stub_deterministic: {module: stub_ai_box, unit: pcam1,
                         poses: ../../worlds/pose_obs_mast.jsonl,
                         dur_s: 20}
  - no_fc_command_to_static: {unit: pcam1}
teardown: none
