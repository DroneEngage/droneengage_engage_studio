# camera/camera_capture_event - TASK-EV-CAM acceptance: the per-channel
# capture command event runs a burst and the photos come back on the
# shared (frozen) camera.captured event - consumers filter on ch
# (D-CAM-1: no per-channel captured facts).
#
#   e1 emit camera.cam_0.capture {count:2} -> two photos -> two
#        camera.captured events, both ch:"cam_0"
#   g1 releases on the first; the journal must hold exactly two latches
#
# The journal latch line does not carry the payload, so `ch` is not
# asserted here - the count of two IS the surface check (interval_ms 0
# bursts fire back-to-back). Same render-farm/de_camera requirements as
# camera_emit_and_notify.
version: 1
name: camera_capture_event
transport: fake
world: ../../worlds/forest_canopy.yaml
operation: ../../packages/camera_capture.deploy.json
render: {mode: cameras, headless: false}
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: shooter, cls: copter_camera}
timeline:
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 20, do: wait_journal, unit: shooter,
     re: "S: snap emit camera\\.probe_done", timeout: 60}
  # let the second captured event land before the journal is judged
  - {t: 25, do: wait, seconds: 10}
  - {t: 40, do: stop}
assert:
  - journal_count: {unit: shooter, re: "S: snap activated", equals: 1}
  - journal_count: {unit: shooter,
                    re: "S: snap emit camera\\.cam_0\\.capture",
                    equals: 1}
  - journal_count: {unit: shooter,
                    re: "S: snap gate g1 released by camera\\.captured",
                    equals: 1}
  - journal_count: {unit: shooter,
                    re: "EVENT_IN event camera\\.captured latched",
                    equals: 2}
teardown: none
