# payload/payload_emit_ignored - TASK-EV-PAY: the payload namespace has
# NO command events. A sensor mission on a static unit emits
# payload.left.release; the same event is also fired raw at the module
# (the GE-06 forward leg delivers command events to the namespace owner).
# stub_payload must ignore every payload.<bay>.<verb> command event: the
# gate on payload.left.released times out on continue and the walk proves
# it moved on with probe.emit_done.
#
#   e1 emit payload.left.release   -> declared: latches, reaches the
#                                     owner, releases NOTHING
#   g1 gate payload.left.released  -> MUST time out on continue
#   e2 emit probe.emit_done      -> proves the mission walked past g1
version: 1
audience: extended
requires: []
name: payload_emit_ignored
transport: fake
operation: ops/payload_emit_ignored.deop
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 25
fleet:
  - {id: prob, cls: static, role: prob, modules: [stub_payload],
     config: {stub_payload: {payload: {bays: [{key: left},
                                            {key: right}]}}}}
timeline:
  - {t: 5, do: deploy}
  - {t: 12, do: start}
  - {t: 16, do: fire, event: payload.left.release, unit: prob}
  - {t: 20, do: wait_journal, unit: prob,
     re: "S: walk emit payload\\.left\\.release", timeout: 30}
  - {t: 25, do: wait_journal, unit: prob,
     re: "S: walk gate g1 timed out -> continue", timeout: 60}
  - {t: 30, do: wait_journal, unit: prob,
     re: "S: walk emit probe\\.emit_done", timeout: 30}
  - {t: 35, do: stop}
assert:
  - journal_count: {unit: prob, re: "S: walk activated", equals: 1}
  - journal_count: {unit: prob,
                    re: "S: walk emit payload\\.left\\.release",
                    equals: 1}
  - journal_count: {unit: prob,
                    re: "S: walk gate g1 timed out -> continue",
                    equals: 1}
  - journal_count: {unit: prob,
                    re: "S: walk emit probe\\.emit_done", equals: 1}
  # the emitted + fired command events were delivered (declared -> latched)
  - journal_count: {unit: prob,
                    re: "EVENT_IN event payload\\.left\\.release latched",
                    at_least: 1}
  # ...and released nothing: no release fact, no action dispatch anywhere
  - journal_count: {unit: prob,
                    re: "EVENT_IN event payload\\.left\\.released",
                    equals: 0}
  - journal_count: {unit: prob,
                    re: "EVENT_IN event payload\\.released",
                    equals: 0}
  - journal_count: {unit: prob, re: "action payload", equals: 0}
  - journal_count: {unit: prob, re: "ACTION_RESULT .* payload", equals: 0}
teardown: none
