# payload/payload_two_bays_approval - TASK-EV-PAY Part B: a two-bay
# stub_payload unit (payload.bays left|right) runs a manual 'deliver'
# template whose two gated actions anchor on the same drop_hold.
#
#   op.start -> 'up' takeoff + unlim hold (auto)
#   operator act:activate mission drop -> APPROVAL_REQ activate -> approve
#   -> transit -> drop -> drop_hold: APPROVAL_REQ action x2 (raise order:
#      payload.release{bay:left} then {bay:right})
#   approve first  -> dispatch -> stub pulses 'drop_left' -> facts
#      payload.released {bay:left} + payload.left.released latch
#   deny second    -> 'approval denied - not dispatched', no right fact
#
# The gated rows use payload.release with the optional 'bay' param: the
# op verifier's template sampling compiles each_point against the Phase-1
# stub, which cannot name unit-advertised 'payload.<bay>' actions (DYN-002)
# - the aggregate+bay form is also the frozen single-bay-compatible path.
version: 1
name: payload_two_bays_approval
seed: 7
transport: fake
operation: ../../packages/payload_two_bays.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
fleet:
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: amb,
     modules: [stub_payload],
     at: {north_m: 0, east_m: 0},
     config: {stub_payload: {payload: {bays: [{key: left, pin: drop_left},
                                            {key: right, pin: drop_right}]}}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "amb1"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "amb1", re: "RUN run .* started",
     timeout: 120}
  # 'up' takeoff then the unlim hold becomes the FC's current item
  - {t: 40, do: wait_journal, unit: "amb1", re: "fc current seq 2",
     timeout: 240}
  # manual activation of the deliver template - activation approval first
  - {t: 50, do: operator, act: activate, unit: amb1, mission: drop}
  - {t: 55, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ activate",
     timeout: 60}
  - {t: 58, do: operator, act: approve, unit: amb1, kind: activate,
     wait_s: 30}
  # transit + drop wp, then the drop_hold arms both action requests
  - {t: 65, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ action",
     timeout: 480}
  # approve the first pending action (raise order: the left row)
  - {t: 70, do: operator, act: approve, unit: amb1, kind: action,
     wait_s: 60}
  - {t: 75, do: wait_journal, unit: "amb1",
     re: "action payload\\.release approved id=", timeout: 120}
  - {t: 80, do: wait_journal, unit: "amb1",
     re: "EVENT_IN event payload\\.left\\.released latched", timeout: 120}
  # deny the still-pending second action (the right row)
  - {t: 85, do: operator, act: deny, unit: amb1, kind: action, wait_s: 60}
  - {t: 90, do: wait_journal, unit: "amb1",
     re: "action payload\\.release \\(row .* approval denied - not dispatched",
     timeout: 120}
  - {t: 95, do: stop}
assert:
  # one activation approval, two action approvals (one per gated row)
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ activate", equals: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ action", equals: 2}
  # the left release was approved and dispatched; the right was denied
  - journal_count: {unit: "amb1",
                    re: "action payload\\.release approved id=", equals: 1}
  - journal_count: {unit: "amb1",
                    re: "action payload\\.release \\(row [0-9]+\\) approval denied - not dispatched",
                    equals: 1}
  - journal_count: {unit: "amb1", re: "ACTION_RESULT .* ok", at_least: 1}
  - operator_log_count: {re: "APPROVAL approve", equals: 2}
  - operator_log_count: {re: "APPROVAL deny", equals: 1}
  # the facts: aggregate + per-bay for left, nothing for right
  - journal_count: {unit: "amb1",
                    re: "EVENT_IN event payload\\.released latched",
                    equals: 1}
  - journal_count: {unit: "amb1",
                    re: "EVENT_IN event payload\\.left\\.released latched",
                    equals: 1}
  - journal_count: {unit: "amb1",
                    re: "EVENT_IN event payload\\.right\\.released",
                    equals: 0}
  # no payload command event was ever consumed: the only payload journal
  # lines are the facts above and the approval bookkeeping
  - journal_count: {unit: "amb1",
                    re: "emit payload\\.",
                    equals: 0}
teardown: land
