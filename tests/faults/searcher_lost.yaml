# faults/searcher_lost - a searcher drops off the fleet mid-op: two
# copters run the p4a11 pair deploy (role "pair", handlers.peer_lost:
# rtl, shared staging). Cutting copter2's server link makes copter1
# declare it LOST once ("ROSTER copter2 lost"), fire the peer_lost
# handler ("-> rtl" + "paused (handler:peer_lost)") and ride the
# contingency - a lost searcher parks the rest of the search rather
# than pretending the coverage still holds. When the link comes back
# ("ROSTER ... back") the handler must NOT fire a second time: the
# latch is once per run. Library slice of
# tests/fleet_bus/p4a11_peer_lost.yaml in de.scenario/1 form.
version: 1
name: f_searcher_lost
transport: fake
operation: ../packages/p4a11_pair.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: copter1, cls: copter,
     config: {de_comm: {sv_peer_lost_s: 8, sv_roster_ttl_s: 8}}}
  - {id: copter2, cls: copter,
     config: {de_comm: {sv_peer_lost_s: 8, sv_roster_ttl_s: 8}}}
timeline:
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: all, re: "RUN run .* started",
     timeout: 90}
  - {t: 20, fault: link_cut, unit: copter2, dur_s: 25}
  - {t: 30, do: wait_journal, unit: copter1, re: "ROSTER copter2 lost",
     timeout: 60}
  - {t: 35, do: wait_journal, unit: copter1,
     re: "handler peer_lost fired", timeout: 60}
  - {t: 40, do: wait_journal, unit: copter1, re: "ROSTER copter2 back",
     timeout: 90}
assert:
  - journal_count: {unit: copter1, re: "ROSTER copter2 lost", equals: 1}
  - journal_count: {unit: all, re: "event sys\\.peer_lost", equals: 1}
  - journal_count: {unit: all, re: "paused \\(handler:peer_lost\\)",
                    equals: 1}
  - journal_count: {unit: copter1, re: "handler peer_lost fired.*-> rtl",
                    equals: 1}
  - journal_count: {unit: copter1, re: "ROSTER copter2 back", at_least: 1}
  - journal_order: {unit: copter1, first: "ROSTER copter2 lost",
                    then: "handler peer_lost fired"}
teardown: reset
