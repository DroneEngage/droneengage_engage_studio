# faults/udp_chunks_dup - the module<->de_comm UDP chunk proxy (SL-0010)
# seeded at 10% duplicate + a 3-message reorder window on p1's
# de_mavlink<->de_comm s2s link, then a 20 KB package is pushed as one
# 1085 frame (tests/packages/plan_survey_100.json, generated by
# tools/gen_bigplan.py): the de_comm -> de_mavlink nav-load leg is
# genuinely multi-chunk (the databus splits at 8 KB) and must pass the
# proxy intact - dup/reorder act on whole single-datagram messages
# only, so a chunk train is never corrupted by reordering. The deploy
# is "complete" when the FC read-back counts every item (mission_items);
# de_comm's "package READY" journal is only its bookkeeping - the fixed
# 30 s supervisor bound (SV_LOAD_TIMEOUT_MS) can legitimately trip while
# a big FC write is still in flight on a loaded host, and that is not a
# fault of the s2s link. Assertions: exactly one "package upload
# accepted" - no event delivered twice - all 100 items on the FC, and
# the proxy's own log proves dups and reorders really fired.
version: 1
name: f_udp_chunks_dup
tasks: [SL-0010]
transport: real
settle_s: 10
teardown: land
fleet:
  - {id: p1, cls: plane, params: {BRD_SD_MISSION: 32}}
timeline:
  - {t: 0, do: wait_online, unit: p1, timeout: 240}
  - {t: 1, fault: udp_chunks, unit: p1, module: de_mavlink,
     drop_pct: 0, reorder: 3, dup_pct: 10}
  # the package goes out as one raw 1085 frame instead of `do: deploy`,
  # exactly like tests/capacity/plan_1kwp.yaml
  - {t: 2, do: send, ty: i, mt: 1085, tg: p1,
     ms: {pkg: "{PKG:tests/packages/plan_survey_100.json}",
          hash: "{HASH:tests/packages/plan_survey_100.json}"}}
  # "package READY - engine v2" is the deploy's real finish line; the
  # bare word "nav load" would false-match the upload-accepted line
  - {t: 3, do: wait_journal, unit: p1,
     re: "package READY|nav load (failed|timed out)", timeout: 480}
  - {t: 4, fault: udp_chunks, unit: p1, module: de_mavlink,
     drop_pct: 0, reorder: 0, dup_pct: 0}
assert:
  # no duplicate event delivered: the seeded dupes on the link were
  # absorbed (de_comm dedupes ACTION_RESULT) - the upload journaled once
  - journal_count: {unit: p1, re: "package upload accepted", equals: 1}
  - no_journal: {unit: p1, re: "nav load failed"}
  # the multi-chunk write landed every item on the FC (at_least: a
  # previous run's aborted write can leave a stale item in SITL's SD
  # mission storage)
  - mission_items: {unit: p1, at_least: 100}
  # the proxy is a tracked sim proc and its log shows the fault fired
  - proc_alive: {unit: p1, proc: de_comm}
  - proc_alive: {unit: p1, proc: de_mavlink}
  - proc_alive: {unit: p1, proc: udp_proxy_de_mavlink}
  - module_log_count: {unit: p1, module: udp_proxy_de_mavlink,
                       re: " dup$", at_least: 1}
  - module_log_count: {unit: p1, module: udp_proxy_de_mavlink,
                       re: " emitr$", at_least: 1}
