# battery: SIM_BATT_VOLTAGE drops to 10.5 V; the next SYS_STATUS shows
# it in the telemetry log.
version: 1
name: f_battery
transport: fake
settle_s: 5
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 3, fault: battery, unit: c1, volts: 10.5, dur_s: 25}
assert:
  - telemetry_value: {unit: c1, field: bat_v, lt: 11.0}
