# faults/decomm_restart_midop - de_comm restarts while its mission is
# flying: the new process restores the v2 package from the saved run
# file ("package restored"), re-joins the SAME run id and tracks the
# segment to completion - exactly one "RUN started" and one
# "mission main completed" in the journal, no re-deploy, no duplicate
# run. This is the mid-flight version of the bring-up restart case
# (tests/fleet_bus/p4a05_restart.yaml).
version: 1
audience: core
name: f_decomm_restart_midop
transport: fake
operation: ../../packages/copter_square.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  - {t: 30, fault: restart, unit: c1, proc: de_comm}
  - {t: 45, do: wait_journal, unit: c1, re: "package restored",
     timeout: 60}
  - {t: 50, do: wait_journal, unit: c1, re: "mission main completed",
     timeout: 240}
assert:
  - journal_count: {unit: c1, re: "package restored", at_least: 1}
  - journal_count: {unit: c1, re: "RUN run .* started", equals: 1}
  - journal_count: {unit: c1, re: "mission main completed", equals: 1}
teardown: land
