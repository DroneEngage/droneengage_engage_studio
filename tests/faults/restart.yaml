# restart: kill + relaunch de_comm. The fresh process reconnects and
# journals a second CLOCK line (the first was pre-scenario).
version: 1
audience: core
name: f_restart
transport: fake
settle_s: 20
fleet:
  - {id: s1, cls: static}
timeline:
  - {t: 3, fault: restart, unit: s1, proc: de_comm}
assert:
  - proc_alive: {unit: s1, proc: de_comm}
  - journal_count: {unit: s1, re: "CLOCK", at_least: 1}
  # the pid change the fault made is inside a recorded fault window
  - no_unexpected_restart: {proc: de_comm}
