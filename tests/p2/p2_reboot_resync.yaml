# p2/p2_reboot_resync - P4A-05 reboot-resync on one unit: de_comm is
# restarted mid-run. The new process restores the v2 package from its
# saved run file ("package restored"), re-joins the same run and the
# mission still completes exactly once - the run id never changes and no
# second "RUN started" line appears. This is the unit-level version of
# the fleet resync scenario (tests/p4a/p4a05_restart.yaml, which
# also covers the roster restart).
version: 1
name: p2_reboot_resync
transport: fake
operation: ../../packages/copter_square.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  - {t: 30, fault: restart, unit: c1, proc: de_comm}
  - {t: 45, do: wait_journal, unit: c1, re: "package restored",
     timeout: 60}
  - {t: 50, do: wait_journal, unit: c1, re: "mission main completed",
     timeout: 240}
assert:
  - journal_count: {unit: c1, re: "package restored", at_least: 1}
  - journal_count: {unit: c1, re: "RUN run .* started", equals: 1}
  - journal_count: {unit: c1, re: "mission main completed", equals: 1}
teardown: land
