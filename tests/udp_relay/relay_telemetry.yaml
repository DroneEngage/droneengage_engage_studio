# UDP relay telemetry: one copter's MAVLink reaches the GCS through the
# spawned droneengage_udp_proxy relay. Proves the GL-0063 relay path end to end: the unit's 1071
# UDPProxy_Info advertises a port inside the relay's udp_port_range
# (recorded in the run manifest), and FC HEARTBEATs flow back to the
# GCS datagram that opened the peer. auth: true is
# required - in local_server mode de_comm reports its never-started
# remote link status to modules, so de_mavlink never learns REGISTERED
# and never sends its 9008 pair-open request.
version: 1
name: relay_telemetry
tasks: [GL-0063]
transport: {type: real, auth: true, udp_relay: true,
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline: []
assert:
  - udp_proxy_mavlink: {unit: all, secs: 25, at_least: 10}
