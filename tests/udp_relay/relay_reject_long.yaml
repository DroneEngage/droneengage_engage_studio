# SL-0180 case 6: 'reject longer' - the block suppresses attempts for
# the configured duration, including from a new source port on the
# same IP.
version: 1
name: relay_reject_long
tasks: [GL-0107, SL-0180]
transport: {type: real, auth: true, udp_relay: {gcs_peer_policy: tofu},
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline:
  - {t: 0, do: wait, seconds: 45}
  - {t: 44, do: relay, cmd: "resume copter1"}
  - {t: 45, do: relay, cmd: "gcs start qgc1 --ip 127.0.0.1"}
  - {t: 47, do: relay, cmd: "gcs cmd qgc1 stream"}
  - {t: 49, do: wait, seconds: 4}
  - {t: 53, do: relay, cmd: "gcs start qgc2 --ip 127.0.0.2"}
  - {t: 55, do: relay, cmd: "gcs stop qgc2"}
  - {t: 55, do: relay, cmd: "gcs start qgc2b --ip 127.0.0.2"}
assert:
  - relay_no_gcs_attempt: {unit: copter1, secs: 8,
      # DE-0077: the trigger takes ~12s to land before the 8s window
      # starts - 20s could expire inside it; 30s covers both with slack
      trigger: "reject copter1 --gcs qgc2 --secs 30"}
  - relay_gcs_no_telemetry: {gcs: qgc2b, secs: 5}
  - relay_gcs_telemetry: {gcs: qgc1, secs: 6, at_least: 3}
  - relay_gcs_locked: {unit: copter1, gcs: qgc1}
