# SL-0181 case 6: the relay restarts with the GCS gone - the restored
# pin counts as just-heard, so the lock frees the idle window after
# the restart (not sooner) and the waiting stranger then takes it.
version: 1
audience: core
name: relay_restart_free
tasks: [GL-0105, GL-0107, SL-0181]
transport: {type: real, auth: true, udp_relay: {gcs_peer_policy: tofu},
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline:
  - {t: 0, do: wait, seconds: 45}
  - {t: 44, do: relay, cmd: "resume copter1"}
  - {t: 45, do: relay, cmd: "gcs start qgc1 --ip 127.0.0.1"}
  - {t: 47, do: relay, cmd: "gcs cmd qgc1 stream"}
  - {t: 49, do: wait, seconds: 4}
  - {t: 53, do: relay, cmd: "gcs start qgc2 --ip 127.0.0.2"}
  - {t: 55, do: relay, cmd: "gcs cmd qgc2 stream"}
assert:
  # the check stops the locked GCS and restarts the relay in one go -
  # the restored pin frees only after the restart-side idle window,
  # inside the check's own window either way
  - relay_gcs_switched: {unit: copter1, secs: 60, reason: idle,
      trigger: ["gcs stop qgc1", "ctl restart server udp_relay"]}
  - relay_gcs_telemetry: {gcs: qgc2, secs: 8, at_least: 3}
  - relay_gcs_locked: {unit: copter1, gcs: qgc2}
