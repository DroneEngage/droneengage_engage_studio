# SL-0180 case 5: the operator rejects a knocking GCS - while the
# block holds no new attempt is raised (not even from a new port on
# the same IP), and once it lapses a fresh attempt appears.
version: 1
name: relay_reject_10s
tasks: [GL-0107, SL-0180]
transport: {type: real, auth: true, udp_relay: {gcs_peer_policy: tofu},
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline:
  - {t: 0, do: wait, seconds: 45}
  - {t: 44, do: relay, cmd: "resume copter1"}
  - {t: 45, do: relay, cmd: "gcs start qgc1 --ip 127.0.0.1"}
  - {t: 47, do: relay, cmd: "gcs cmd qgc1 stream"}
  - {t: 49, do: wait, seconds: 4}
  - {t: 53, do: relay, cmd: "gcs start qgc2 --ip 127.0.0.2"}
assert:
  # the check itself rejects 127.0.0.2, so the block always covers its
  # window no matter when the assert phase begins. The trigger needs
  # ~12s (6s req collect + tail + setup) before the 6s window starts,
  # so the reject must outlast ~18s - 25 keeps real margin.
  - relay_no_gcs_attempt: {unit: copter1, secs: 6,
      trigger: "reject copter1 --gcs qgc2 --secs 25"}
  - relay_gcs_attempt: {unit: copter1, secs: 25, ip: "127.0.0.2"}
  - relay_gcs_telemetry: {gcs: qgc1, secs: 6, at_least: 3}
  - relay_gcs_locked: {unit: copter1, gcs: qgc1}
