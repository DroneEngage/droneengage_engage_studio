# The SAME stranger-injection check against the comm server's built-in
# UDP proxy - which has no peer pinning today (last-sender wins), so the
# injection from 127.0.0.2 goes straight through to the FC. This test is
# expected to "fail" the udp_proxy_rejects check: it asserts the hole
# exists (expect: fail flips the verdict so a documented-vulnerable run
# reports PASS). When the built-in proxy gains pinning this test will
# start failing - that is the signal the hole is closed.
version: 1
name: builtin_injection_expect_fail
transport: {type: real, auth: true,
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline: []
assert:
  - udp_proxy_mavlink: {unit: all, secs: 15, at_least: 5}
  - udp_proxy_rejects: {unit: all, from_ip: '127.0.0.2', secs: 10,
                        expect: fail}
