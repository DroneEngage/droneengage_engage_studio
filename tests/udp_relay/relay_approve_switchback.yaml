# SL-0180 case 3: a stranger knocks, the operator approves it - telemetry
# moves and the old GCS is cut; the old GCS asks again and is approved
# back.
version: 1
name: relay_approve_switchback
tasks: [GL-0109, GL-0110, SL-0180]
transport: {type: real, auth: true, udp_relay: {gcs_peer_policy: tofu},
            account: {user: sim@sim.droneengage.com, code: sim1234}}
fleet:
  - {id: copter1, cls: copter}
timeline:
  - {t: 0, do: wait, seconds: 15}
  - {t: 15, do: relay, cmd: "gcs start qgc1 --ip 127.0.0.1"}
  - {t: 17, do: relay, cmd: "gcs cmd qgc1 stream"}
  - {t: 15, do: wait, seconds: 4}
  - {t: 19, do: relay, cmd: "gcs start qgc2 --ip 127.0.0.2"}
  - {t: 21, do: relay, cmd: "gcs cmd qgc2 stream"}
  - {t: 19, do: wait, seconds: 3}
  - {t: 22, do: relay, act: approve, unit: copter1, gcs: qgc2}
  - {t: 22, do: wait, seconds: 3}
  - {t: 25, do: relay, cmd: "gcs silence qgc1"}
  - {t: 25, do: relay, cmd: "gcs resume qgc1"}
  - {t: 25, do: wait, seconds: 3}
  - {t: 28, do: relay, act: approve, unit: copter1, gcs: qgc1}
  - {t: 28, do: wait, seconds: 3}
assert:
  - relay_gcs_attempt: {secs: 6, ip: "127.0.0.2"}
  - relay_gcs_switched: {secs: 8, reason: approved}
  - relay_gcs_telemetry: {gcs: qgc1, secs: 6, at_least: 2}
  - relay_gcs_no_telemetry: {gcs: qgc2, secs: 5}
  - relay_gcs_locked: {unit: copter1, gcs: qgc1}
