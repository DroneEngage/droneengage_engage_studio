# soak_copters3 - a 30-minute seeded chaos soak over three copters on the
# fake transport: loss / module_kill(de_mavlink) / gps_off / freeze(de_comm)
# windows drawn by the scenario seed (`./sim expand` prints the schedule).
# PASS = the SL-0011 run-wide invariants held for the whole soak - no
# process restarted outside a fault window, RSS and open-fd counts stayed
# flat, journals stayed bounded, and every timed fault's unit came back
# online with fresh telemetry. Opt-in: the suite skips tests/soak unless
# --roots tests/soak is given (DE timers are wall-clock, soaks run at 1x).
# loss draws percent: 30, not the 50% default: a 50% window can starve
# de_comm's watchdog long enough to sever the ws, and its re-dial inside
# the still-degraded window then gets the de_auth frame silently dropped
# - the unit stays connected-but-unauthenticated until a restart (a real
# chaos finding on de_comm's auth-retry, not a soak assertion).
version: 1
audience: lab
name: soak_copters3
tasks: [SL-0011]
seed: 1
realtime: true            # pins SITL speedup 1 - a soak is wall-clock evidence
transport: fake
settle_s: 60
fleet:
  - {id: c1, cls: copter}
  - {id: c2, cls: copter}
  - {id: c3, cls: copter}
chaos:
  faults:
    - {kind: loss, percent: 30}           # 30%: degrades, session survives (see header)
    - {kind: module_kill, module: de_mavlink}
    - {kind: module_kill, module: de_mavlink}
    - gps_off
    - {kind: freeze, proc: de_comm}
  units: [c1, c2, c3]
  every_s: [120, 300]
  dur_s: [20, 60]
  from_t: 120            # fleet bring-up + EKF warm-up stays fault-free
  until_t: 1700
timeline:
  - {t: 0,    do: mode, unit: all, mode: GUIDED}
  - {t: 5,    do: arm, unit: all}
  - {t: 1800, do: wait, seconds: 1}        # pins the 30-minute run length
assert:
  - no_unexpected_restart: {}
  - rss_growth: {max_mb_per_h: 64, warmup_s: 120}
  - fd_growth: {max: 32}
  - journal_size: {unit: all, max_mb: 64}
  - recovers_after_fault: {within_s: 120}
teardown: reset
