# TASK-P4A-07 acceptance (spec scenarios 1-3 in one run):
#   Timings are for the sv_roster_hz default 0.2 (one roster per 5 s):
#   stale = 3/hz = 15 s, lost = max(15 s, 2 x stale) = 30 s.
#   1. all 3 copters' 1092 rosters reach a GCS listener within one roster
#      period (+ slack) and every unit journals CLOCK tq=2.
#   2. link_cut copter3 for 70 s -> the others journal ROSTER stale (~15 s
#      of silence) then lost + "event sys.peer_lost latched" (~30 s);
#      the scout emits `area.clear` while copter3 is STALE so the reliable
#      copy stays pending for it (a lost peer is no longer expected);
#      when the cut ends copter3 reconnects -> ROSTER back +
#      sys.peer_back + P4A-05 catch-up -> copter3 activates "work".
#   3. clock_spread <= 100 ms across the units' latest CLOCK lines.
# `links` prints the fake server's per-link roster byte counters
# (the 4-vehicle bandwidth record of the spec).
#
# p4a07_scout differs from p4a04_scout only in HOW the emit is fired:
# "area.clear" rides a `go.now`-triggered "signal" mission (emit
# anchored on seq 5 start) so the scenario decides WHEN the emit lands -
# it must fall inside copter3's stale window, not after lost.
version: 1
sim: ../sims/copters3_faults.yaml
operation: ../packages/fleet_scout.json
steps:
  - stop
  - clear
  - mode: {unit: all, mode: GUIDED}
  - deploy: {package: "../packages/fleet_scout.json", unit: 1}
  - deploy: {package: "../packages/fleet_worker.json", unit: 2}
  - deploy: {package: "../packages/fleet_worker.json", unit: 3}
  - arm: all
  - start
  # 1: every unit's roster reaches a GCS listener inside one period
  - roster_peers: {seconds: 12, count: 3}
  - wait: 5
  # 2: cut copter3; wait for stale on copter1, then emit while stale
  - link_cut: {unit: 3, seconds: 70}
  - wait_journal: {unit: 1, re: "ROSTER copter3 stale", timeout: 30}
  - fire: {event: go.now, unit: 1}
  # copter2 (still linked) gets the emit live and activates "work"
  - wait_journal: {unit: 2, re: "activating mission work", timeout: 60}
  # copter3's silence ages out: lost ~30 s after the last roster
  - wait_journal: {unit: 1, re: "ROSTER copter3 lost", timeout: 40}
  - wait_journal: {unit: 1, re: "ROSTER copter3 back", timeout: 70}
  # catch-up delivers the pending copy; copter3 activates "work"
  - wait_journal: {unit: 3, re: "activating mission work", timeout: 90}
  - wait: 5
  - links

assert:
  # 1: tq=2 on every unit
  - journal_count: {unit: all, re: "CLOCK.*tq=2", at_least: 1}
  # 2: copter3's stale/lost/back on BOTH other units
  - journal_count: {unit: 1, re: "ROSTER copter3 stale", at_least: 1}
  - journal_count: {unit: 2, re: "ROSTER copter3 stale", at_least: 1}
  - journal_count: {unit: 1, re: "ROSTER copter3 lost", at_least: 1}
  - journal_count: {unit: 2, re: "ROSTER copter3 lost", at_least: 1}
  - journal_count: {unit: 1, re: "ROSTER copter3 back", at_least: 1}
  - journal_count: {unit: 2, re: "ROSTER copter3 back", at_least: 1}
  # the local sys.peer_* events latched on the lost/back edges
  - journal_count: {unit: 1, re: "event sys\\.peer_lost latched", at_least: 1}
  - journal_count: {unit: 1, re: "event sys\\.peer_back latched", at_least: 1}
  # stale -> lost: 30 s lost minus 15 s stale = ~15 s at 0.2 Hz
  - journal_time_delta: {u1: 1, re1: "ROSTER copter3 stale", u2: 1,
                         re2: "ROSTER copter3 lost", min_s: 10, max_s: 20}
  # the emit happened exactly once; copter2 live, copter3 via catch-up
  - journal_count: {unit: 1, re: "BUS_OUT.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 2, re: "BUS_IN.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 3, re: "BUS_IN.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 2, re: "activating mission work", equals: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  # 3: fleet-clock agreement across units
  - clock_spread: {unit: all, max_ms: 100}
