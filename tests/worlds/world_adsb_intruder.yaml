# worlds/world_adsb_intruder - SL-0016: a world-scripted ADS-B intruder
# appears on the GCS ADS-B path. One copter runs the SL-0008 fcb proxy;
# the runner's AdsbFeeder encodes the world aircraft's truth into
# ADSB_VEHICLE frames and injects them through the proxy's `inject`
# control at 1 Hz, where they read to de_mavlink exactly like the frames
# SITL's SIM_ADSB_* traffic produces. de_mavlink parses each frame
# (mavlink_sdk vehicle.cpp, no sysid filter) and re-forwards it to every
# GCS as raw MAVLink (fcb_facade sendADSBVehicleInfo, mt 6502). The GCS
# bridge decodes and logs the frames; the assertion demands the ICAO and
# a position within 50 m of the world truth. Nothing beyond the GCS
# display path consumes ADS-B, so bridging the frame is the whole proof.
version: 1
name: world_adsb_intruder
speedup: 1                   # the world truth tick is wall-clock
transport: real          # the proxy + bridge path needs no fake server
world: ../../worlds/airspace_intruder.yaml
settle_s: 15
fleet:
  - {id: c1, cls: copter, fcb_proxy: true}
timeline:
  - {t: 0, do: wait, seconds: 20}
assert:
  # >= 5 forwarded frames at the GCS, all within 50 m of the world truth
  - adsb_vehicle: {icao: "0xAC0DE1", tid: intruder_1, at_least: 5,
                   max_m: 50}
  - proc_alive: {unit: c1, proc: fcb_proxy}
  - proc_alive: {unit: c1, proc: de_mavlink}
teardown: none
