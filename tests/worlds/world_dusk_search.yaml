# worlds/world_dusk_search - P5-11 acceptance: the same dusk sweep
# (tests/packages/p5_dusk_sweep.json, 40 m legs over person_wander's anchor,
# person_rest's walk line and the hiker's trail) flown by two copters
# through the forest_dusk environment: sun_elev ~ -10 deg, so the rgb
# unit's p_detect is 0 - it must find NOBODY (detection_recall max 0
# over every person, the negative control) - while the thermal unit
# (config.stub_ai_box.camera_kind: thermal -> flat p_detect_thermal,
# light-insensitive) must find the resting person. The world wind
# (6 m/s FROM 270, turb 0.2) reaches both SITLs as
# SIM_WIND_SPD/DIR/TURB in sim.parm at bring-up (D6; the tlog check -
# non-zero roll/pitch into the wind - is a live-run observation, not a
# pure assertion). Run seeds 1-3 (./sim world_dusk_search --seeds 1-3).
version: 1
audience: extended
name: world_dusk_search
realtime: true
seed: 1
transport: fake
world: ../../worlds/forest_dusk.yaml
operation: ../packages/p5_dusk.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: cam_rgb, cls: copter, modules: [stub_ai_box]}
  - {id: cam_th, cls: copter, modules: [stub_ai_box],
     config: {stub_ai_box: {camera_kind: thermal}}}
timeline:
  - {t: 0, do: deploy}
  - {t: 5, do: start}
  - {t: 10, do: wait_journal, unit: all,
     re: "mission main completed", timeout: 400}
assert:
  - detection_recall: {truth: person, src: ai, unit: cam_rgb, max: 0}
  - detection_recall: {truth: person_rest, src: ai, unit: cam_th,
                       min: 1}
  - time_to_detect: {truth: person_rest, src: ai, unit: cam_th,
                     max_s: 300}
teardown: land
