# p4f/p4f05_forged_relay - TASK-P4F-07 acceptance "forged relay": a
# bound unit whose role is NOT in the envelope's sources replays a
# searcher-authored fact - the relay rule refuses the grant path even
# though the original source is allow-listed.
#
# Op:      packages/p4f05_relay.deploy.json - ambulance package whose
#          deliver triggers on the sticky fact `sar.person` and whose
#          sources drop cam_scout (["gcs","searcher","sdr_scout"]);
#          searcher package gains relay_person (a sensor mission that
#          emits sar.person when the person confirms); cam_scout gains
#          sar.person in event_sticky so it holds and can serve it.
# Sequence: amb1's link is cut before the confirm, so it misses the
#          original BUS broadcast; each searcher emits its own sar.person
#          on the confirm; then de_comm is KILLED on s1/s2/s3/sdr1 - a
#          kill (not a timed link_cut) keeps every other holder off the
#          bus until the refusal window is over, so scout1 is the only
#          live unit that can serve amb1 the facts. amb1 returns, its
#          fact digest diverges, scout1 replays (rl=scout1 -> role
#          cam_scout not in sources) -> LAUNCH_REFUSED deliver trigger
#          relay role cam_scout -> live request nobody answers.
#          (2026-10-08 fix: the timed s2/s3 cut left sdr1 connected -
#          it served the fact as an ALLOWED relay and amb1 launched.)
version: 1
name: p4f05_forged_relay
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/p4f05_relay.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: none, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300, authorize: {amb1: {}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 32, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
  # amb1 goes dark before the person confirms - it misses the sar.person
  # broadcast and must be served the fact by a relay
  - {t: 35, fault: link_cut, unit: "amb1", dur_s: 560}
  - {t: 40, do: wait_journal, unit: "scout1",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  # the searcher's relay_person lane emits the sticky fact while amb1
  # is still off the bus
  - {t: 45, do: wait_journal, unit: "s1", re: "BUS_OUT .* n=sar\\.person",
     timeout: 480}
  - {t: 50, do: wait, seconds: 5}
  # kill the author AND every other live holder for the whole window -
  # scout1 is the only unit that can serve amb1 the fact. A kill has no
  # expiry, so no holder can return early and beat the refusal.
  - {t: 55, do: kill, unit: "s1,s2,s3,sdr1", proc: de_comm}
  # amb1's cut expires ~t595; its digest diverges from scout1's and the
  # replay lands with rl=scout1
  - {t: 620, do: wait_journal, unit: "amb1", re: "comm line online",
     timeout: 180}
  - {t: 625, do: wait_journal, unit: "amb1",
     re: "BUS_RELAY.*n=sar\\.person.*rl=scout1|BUS_RELAY.*rl=scout1.*n=sar\\.person",
     timeout: 300}
  - {t: 630, do: wait_journal, unit: "amb1", re: "LAUNCH_REFUSED",
     timeout: 300}
  - {t: 635, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 180}
  - {t: 640, do: wait_journal, unit: "amb1", re: "APPROVAL_TIMEOUT",
     timeout: 300}
  # bring the fleet back so teardown can land it cleanly; the copies
  # they serve are already latched on amb1, so nothing re-triggers
  - {t: 700, do: restart, unit: "s1,s2,s3,sdr1", proc: de_comm}
  - {t: 705, do: wait, seconds: 60}
assert:
  # the relayed copy arrived stamped with the cam_scout relayer
  - journal_count: {unit: "amb1",
                    re: "BUS_RELAY.*rl=scout1", at_least: 1}
  # provenance: src searcher is allowed, rl cam_scout is not. Each
  # searcher authors its own sar.person (s1/s2/s3 copies), so the
  # refusal can journal once per copy - at_least, not equals
  - journal_count: {unit: "amb1",
                    re: "LAUNCH_REFUSED deliver trigger relay role cam_scout",
                    at_least: 1}
  - journal_order: {unit: "amb1", first: "LAUNCH_REFUSED",
                    then: "APPROVAL_REQ launch"}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", at_least: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_TIMEOUT", at_least: 1}
  - no_journal: {unit: "amb1", re: "launch: uploading|LAUNCH_GO|takeoff"}
  - status_field: {unit: "amb1", path: "launch.grant", equals: valid}
  - status_field: {unit: "amb1", path: "launch.last_refusal",
                   re: "trigger relay role cam_scout"}
  - final_state: {unit: "amb1", fc_mode: [STABILIZE, GUIDED, LAND]}
teardown: land
