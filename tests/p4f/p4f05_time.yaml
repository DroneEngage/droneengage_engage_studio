# p4f/p4f05_time - TASK-P4F-07 acceptance "time": the envelope's
# max_flight_s sits below the route estimate, so the grant route check
# refuses `time <est>s` before any upload.
#
# Op:      packages/p4f05_time.deploy.json - ambulance package with
#          launch.envelope.max_flight_s = 120 (the generated deliver
#          route to person_1 estimates a few hundred seconds at the
#          envelope's 5 m/s plus the 1.2 margin).
# Evidence: LAUNCH_REFUSED deliver time <est>s -> live APPROVAL_REQ ->
#           APPROVAL_TIMEOUT -> stays on the ground; never uploaded.
version: 1
name: p4f05_time
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/p4f05_time.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
operator:
  approve: {launch: none, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300, authorize: {amb1: {}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
  - {t: 40, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 45, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  - {t: 50, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 55, do: wait_journal, unit: "amb1", re: "LAUNCH_REFUSED",
     timeout: 180}
  - {t: 60, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 120}
  - {t: 65, do: wait_journal, unit: "amb1", re: "APPROVAL_TIMEOUT",
     timeout: 300}
assert:
  # the route check's estimate exceeded max_flight_s
  - journal_count: {unit: "amb1",
                    re: "LAUNCH_REFUSED deliver time [0-9]+s", equals: 1}
  - journal_order: {unit: "amb1", first: "LAUNCH_REFUSED",
                    then: "APPROVAL_REQ launch"}
  - no_journal: {unit: "amb1", re: "LAUNCH_ROUTE_OK|launch: uploading"}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_TIMEOUT", equals: 1}
  - no_journal: {unit: "amb1", re: "LAUNCH_GO|takeoff"}
  - status_field: {unit: "amb1", path: "launch.grant", equals: valid}
  - status_field: {unit: "amb1", path: "launch.last_refusal",
                   re: "time [0-9]+s"}
  - final_state: {unit: "amb1", fc_mode: [STABILIZE, GUIDED, LAND]}
teardown: land
