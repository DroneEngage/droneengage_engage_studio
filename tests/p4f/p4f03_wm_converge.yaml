# TASK-P4F-03 scenario 5 "wm converge": detections are facts. copter3 is
# cut while copter1 reports two targets, then the author is killed - plain
# retries can never reach copter3. Back online, copter3's world-model
# digest AND fact coverage diverge (WM_DIVERGE/FACT_DIVERGE on copter2),
# it syncs from copter2's replay copies, and both digests match again.
version: 1
name: p4f03_wm_converge
transport: {type: fake, seed: 1337}
operation: ../../packages/p4f03.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: link_cut, unit: 3, dur_s: 75}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: mk.det, unit: 1, until: {re: "BUS_OUT.*n=target\\.fire", count: 1}, payload: {pos: [-35.3600, 149.16500], unc_m: 
        20, conf: 0.7}}
  - {t: 0, do: fire, event: mk.det, unit: 1, until: {re: "BUS_OUT.*n=target\\.fire", count: 2}, payload: {pos: [-35.3650, 149.17000], unc_m: 
        20, conf: 0.6}}
  - {t: 0, do: wait_journal, unit: 2, re: "WM_DIVERGE copter3$", timeout: 45}
  - {t: 0, fault: kill, unit: 1, proc: de_comm} # the author is gone
  - {t: 0, do: wait_journal, unit: 3, re: "comm line online", timeout: 120}
  # the missed detections arrive as copter2's relays
  - {t: 0, do: wait_journal, unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1", timeout: 120}
  - {t: 0, do: wait_journal, unit: 2, re: "WM_DIVERGE copter3 cleared", timeout: 120}
  - {t: 0, do: wait, seconds: 5}
  # bring the author back so teardown can land it cleanly
  - {t: 0, fault: restart, unit: 1, proc: de_comm}
  - {t: 0, do: wait, seconds: 10}
  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 2, re: "WM_DIVERGE copter3$", at_least: 1}
  - journal_count: {unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1", at_least: 2}
  - journal_count: {unit: 3, re: "WM_NEW", equals: 2}
  - journal_count: {unit: 2, re: "WM_DIVERGE copter3 cleared", at_least: 1}
