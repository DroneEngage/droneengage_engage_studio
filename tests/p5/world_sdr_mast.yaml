# p5/world_sdr_mast - P5-08 acceptance 2: a comm-only mast runs
# stub_sdr. The watch_rf mission invokes the real sdr.scan capability;
# the stub synthesizes sweeps from the world (phone_1, -10 dBm tx on
# person_1's back) and runs the de_sdr debounce+throttle detector, so
# sdr.signal fires only while the phone is inside the modelled ~13 m
# gate. signals_in_range proves every emitted signal was stamped while
# the truth put phone_1 within range of the mast.
version: 1
name: world_sdr_mast
seed: 7
transport: fake
world: ../../worlds/forest_a.yaml
operation: ../../packages/p5_sdr.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 25
fleet:
  - {id: mast, cls: static, modules: [stub_sdr],
     base: [-35.362850, 149.166050, 584, 0]}
timeline:
  - {t: 0, do: deploy}
  - {t: 5, do: start}
  - {t: 10, do: wait_journal, unit: mast,
     re: "EVENT_IN.*sdr\\.signal", timeout: 240}
  - {t: 200, do: stop}
assert:
  - signals_in_range: {unit: mast, re: "EVENT_IN.*sdr\\.signal",
                       truth: phone_1, max_m: 30, min_count: 1}
  - journal_count: {unit: mast, re: "emit phone\\.signal", at_least: 1}
  - no_fc_command_to_static: {unit: mast}
teardown: none
