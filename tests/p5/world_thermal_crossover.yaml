# p5/world_thermal_crossover - TASK-13 acceptance: a copter with
# stub_ai_box (camera_kind: thermal) flies the 3-leg lawnmower of
# packages/p5_canopy_sweep.json at 40 m over the thermal_crossover
# world's two people, one under each of two legs. person_night is a
# 34 C body against the ~11 C derived ambient - full thermal
# contrast, it must be found (detection_recall min 1, the "night
# leg"). person_xo carries temp_c 11 - the ambient itself - so the
# TASK-13 contrast ESTIMATE zeroes its p_detect and it must stay
# hidden (detection_recall max 0, the "crossover leg", the negative
# control). Recall lower in the crossover leg than in the night leg
# is the property under test.
version: 1
name: world_thermal_crossover
realtime: true
seed: 7
transport: fake
world: ../../worlds/thermal_crossover.yaml
operation: ../../packages/p5_canopy_sweep.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: cam1, cls: copter, modules: [stub_ai_box],
     config: {stub_ai_box: {camera_kind: thermal}}}
timeline:
  - {t: 0, do: mode, unit: cam1, mode: GUIDED}
  - {t: 2, do: deploy, timeout: 120}
  - {t: 4, do: wait_ready, unit: cam1, timeout: 120}
  - {t: 6, do: arm, unit: cam1}
  - {t: 9, do: start}
  - {t: 10, do: wait_journal, unit: cam1,
     re: "mission main completed", timeout: 300}
assert:
  - detection_recall: {truth: person_night, min: 1}
  - detection_recall: {truth: person_xo, max: 0}
  - time_to_detect: {truth: person_night, max_s: 120}
teardown: land
