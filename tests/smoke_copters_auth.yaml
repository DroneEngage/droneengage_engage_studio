# Same as smoke_copters, through the authenticator login path.
version: 1
name: smoke_copters_auth
tier: smoke
realtime: true
transport: {type: real, auth: true, account: {user: sim@sim.droneengage.com, code: sim1234}}
operation: ../packages/copter_square.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}    # reset leftover runs when the sim is reused (the
  - {t: 0, do: clear}   # engine stays RUNNING after "mission ... completed")
  - {t: 0, do: mode, unit: all, mode: GUIDED} # de_mavlink refuses nav loads in AUTO
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: start}
  - {t: 0, do: wait_journal, unit: 1, re: "mission main completed", timeout: 300}
  - {t: 0, do: wait_journal, unit: 2, re: "mission main completed", timeout: 300}
  - {t: 0, do: wait_journal, unit: 3, re: "mission main completed", timeout: 300}
settle_s: 0
assert:
  - journal_count: {unit: all, re: "RUN run .* started", equals: 1}
  - journal_count: {unit: all, re: "mission main completed", equals: 1}
  - journal_count: {unit: all, re: "handler .* fired", equals: 0}
  - journal_count: {unit: all, re: "comm line offline", equals: 0}
  - journal_time_delta: {u1: 1, re1: "RUN run .* started", u2: 3, re2: "RUN run .* started", max_s: 15}
