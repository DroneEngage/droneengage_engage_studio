# launch/p4f05_time_limit - TASK-P4F-07 acceptance "time limit": the grant
# launches fine, but the unattended backstop (envelope max_flight_s,
# counted from arm) fires mid-flight and returns the vehicle home.
#
# Op:      packages/p4f05_time_limit.deploy.json - ambulance package
#          with launch.envelope.max_flight_s = 860 (above the route
#          estimate at the 5 m/s envelope speed) and deliver gen
#          hover_s = 400 (the drop approval is never answered, so the
#          mission runs its denied tail out of the hover).
# Speed:   amb1 carries WP_SPD: 0.8 (m/s) - the envelope's
#          estimate still passes at speed_mps 5, while the actual legs
#          are ~6x slower so the arm-time deadline lands mid-flight.
#          (WP_SPD is the current name; WPNAV_SPEED is legacy and a
#          sim.parm line for it is ignored.) RTL_SPEED_MS: 10 keeps the
#          post-limit return fast.
# Evidence: LAUNCH_GO use=1/1 -> LAUNCH_TIME_LIMIT -> RTL -> LAUNCH_DONE.
version: 1
name: p4f05_time_limit
seed: 7
realtime: true
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/p4f05_time_limit.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: none, action: none}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000, WP_SPD: 0.8, RTL_SPEED_MS: 10},
     role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300, authorize: {amb1: {}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
  - {t: 40, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 45, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  - {t: 50, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 55, do: wait_journal, unit: "amb1", re: "LAUNCH_GO",
     timeout: 300}
  # the arm-time deadline is 860 s: it fires during the flight's
  # return leg at 0.8 m/s
  - {t: 60, do: wait_journal, unit: "amb1", re: "LAUNCH_TIME_LIMIT",
     timeout: 1100}
  - {t: 65, do: wait_journal, unit: "amb1", re: "LAUNCH_DONE",
     timeout: 600}
assert:
  - journal_count: {unit: "amb1", re: "LAUNCH_GO grant=.* use=1/1",
                    equals: 1}
  - journal_order: {unit: "amb1", first: "LAUNCH_GO",
                    then: "LAUNCH_TIME_LIMIT"}
  - journal_count: {unit: "amb1", re: "LAUNCH_TIME_LIMIT", equals: 1}
  - journal_order: {unit: "amb1", first: "LAUNCH_TIME_LIMIT",
                    then: "LAUNCH_DONE"}
  - journal_count: {unit: "amb1", re: "LAUNCH_DONE", equals: 1}
  # the grant covered the launch - no live request anywhere
  - no_journal: {unit: "amb1", re: "APPROVAL_REQ launch"}
  - journal_count: {unit: "amb1", re: "vehicle disarmed - nav lane idle",
                    at_least: 1}
  - final_state: {unit: "amb1", fc_mode: [RTL, LAND]}
teardown: land
