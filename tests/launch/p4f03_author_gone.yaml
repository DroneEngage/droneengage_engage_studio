# TASK-P4F-03 scenario 3 "author gone": copter3 is cut while copter1
# emits the fact, then copter1's de_comm is killed for good. Back online,
# copter3's coverage diverges from copter2's (the only live holder left),
# it asks copter2, and copter2 replays copter1's fact with rl=copter2 ->
# "BUS_RELAY src=copter1 rl=copter2" and the gate releases.
version: 1
name: p4f03_author_gone
transport: {type: fake, seed: 1337}
operation: ../packages/p4f03.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, do: fire, event: mk.scan, unit: 1, until: "BUS_OUT.*n=scan\\.begin"}
  - {t: 0, do: wait_journal, unit: 3, re: "gate seen waits found\\.it", timeout: 30}
  - {t: 0, fault: link_cut, unit: 3, dur_s: 75}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: mk.fact, unit: 1, payload: {pos: [-35.363, 149.166, 0], conf: 0.9}, until: "BUS_OUT.*n=found\\.it"}
  - {t: 0, do: wait_journal, unit: 2, re: "BUS_IN.*n=found\\.it", timeout: 30}
  - {t: 0, fault: kill, unit: 1, proc: de_comm} # the author is gone
  # copter3's cut expires; its digest differs from copter2's -> req -> relay
  - {t: 0, do: wait_journal, unit: 3, re: "comm line online", timeout: 120}
  - {t: 0, do: wait_journal, unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1", timeout: 120}
  - {t: 0, do: wait_journal, unit: 3, re: "gate seen released", timeout: 60}
  - {t: 0, do: wait, seconds: 5}
  # bring the author back so teardown can land it cleanly
  - {t: 0, fault: restart, unit: 1, proc: de_comm}
  - {t: 0, do: wait, seconds: 10}
  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1", at_least: 1}
  - journal_count: {unit: 2, re: "FACT_SERVE copter3 sent=1", at_least: 1}
  - journal_count: {unit: 3, re: "gate seen released", at_least: 1}
