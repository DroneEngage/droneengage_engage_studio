# launch/p4f05_site_off - TASK-P4F-07 acceptance "site off": the site
# switch de_comm.sv_allow_auto_launch is OFF on amb1. The deploy still
# sends authorize - the unit rejects the grant (site_config) and START
# is refused for amb1 like p4b10_g. The grant surface proves the
# site-config gate wins over a wire-valid grant.
#
# Op:      tests/packages/p4f05.deploy.json.
# Evidence: LAUNCH_GRANT_REJECT site_config, START refused - auto-launch
#           disabled by site config, amb1 never arms, launch.grant
#           stays none.
version: 1
audience: core
name: p4f05_site_off
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../packages/p4f05.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
operator:
  approve: {launch: none, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     # the site switch under test: the grant must be rejected and the
     # auto_launch start refused (default de_comm policy)
     config: {de_comm: {sv_allow_auto_launch: false}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300, authorize: {amb1: {}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  # the authorize landed and was rejected while the units were READY
  - {t: 20, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT_REJECT",
     timeout: 60}
  - {t: 22, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  # amb1 answers START with a refusal - the ground-start role is only
  # exempt from the armed gate when the site switch is on
  - {t: 25, do: start, timeout: 300, expect_fail: [amb1]}
  - {t: 30, do: wait_journal, unit: "scout1,sdr1,s1,s2,s3",
     re: "RUN run .* started", timeout: 120}
  - {t: 35, do: wait_journal, unit: "amb1",
     re: "auto-launch disabled by site config", timeout: 120}
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "BUS_OUT .* n=sys\\.alloc\\.progress", timeout: 480}
assert:
  - journal_count: {unit: "amb1", re: "LAUNCH_GRANT_REJECT site_config",
                    equals: 1}
  - journal_count: {unit: "amb1",
                    re: "START .* refused - auto-launch disabled by site config",
                    at_least: 1}
  # amb1 never launched - no deliver activation, no launch stepper, no
  # nav command; its FC stays in a ground mode
  - journal_count: {unit: "amb1",
                    re: "activating mission deliver|launch: |NavMode|takeoff",
                    equals: 0}
  - no_journal: {unit: "amb1", re: "APPROVAL_REQ launch"}
  - status_field: {unit: "amb1", path: "launch.grant", equals: none}
  - final_state: {unit: "amb1", fc_mode: [STABILIZE, GUIDED, LAND]}
  # the rest of the fleet still completed the SAR chain up to the point
  # that needs the drop (OP_END stays 0 with amb1 parked)
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  - journal_count: {unit: "all", re: "OP_END", equals: 0}
  - final_state: {unit: "s1,s2,s3,sdr1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
teardown: land
