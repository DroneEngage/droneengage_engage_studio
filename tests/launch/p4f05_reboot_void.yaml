# launch/p4f05_reboot_void - TASK-P4F-07 acceptance "reboot void": a
# simulated new boot between authorize and confirm voids the persisted
# grant (new_boot), so the confirm falls back to a live approval; a
# fresh authorize then takes the grant valid again.
#
# Op:      tests/packages/p4f05.deploy.json.
# Reboot:  `do: reboot` rewrites DE_BOOT_ID_FILE (the p4f03 hook) and
#          restarts de_comm - the restored grant sees a different boot
#          and voids instead of resuming.
# Evidence: LAUNCH_GRANT -> LAUNCH_GRANT_VOID new_boot -> APPROVAL_REQ
#           launch -> a fresh `do: authorize` -> LAUNCH_GRANT ... valid
#           again (status launch.grant back to valid).
version: 1
audience: core
name: p4f05_reboot_void
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../packages/p4f05.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
operator:
  approve: {launch: none, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300, authorize: {amb1: {}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 32, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
  # new boot id + de_comm restart: the persisted grant voids on restore
  - {t: 35, do: reboot, unit: "amb1"}
  - {t: 40, do: wait_journal, unit: "amb1", re: "package restored",
     timeout: 180}
  - {t: 42, do: wait_journal, unit: "amb1",
     re: "LAUNCH_GRANT_VOID new_boot", timeout: 120}
  # the person confirm now raises a plain live request (NO_GRANT)
  - {t: 50, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 600}
  - {t: 55, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 180}
  # a fresh authorize after the void restores the grant to valid
  - {t: 60, do: authorize, unit: "amb1"}
  - {t: 62, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
assert:
  - journal_order: {unit: "amb1", first: "LAUNCH_GRANT .* valid=",
                    then: "LAUNCH_GRANT_VOID new_boot"}
  - journal_count: {unit: "amb1", re: "LAUNCH_GRANT_VOID new_boot",
                    equals: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  # the fresh grant accepted: two LAUNCH_GRANT accept lines total
  - journal_count: {unit: "amb1", re: "LAUNCH_GRANT .* valid=",
                    equals: 2}
  - status_field: {unit: "amb1", path: "launch.grant", equals: valid}
  - no_journal: {unit: "amb1", re: "LAUNCH_GO|takeoff"}
  - final_state: {unit: "amb1", fc_mode: [STABILIZE, GUIDED, LAND]}
teardown: land
