# TASK-P4F-03 scenario 1 "fact before the gate": found.it is published and
# lands in every unit's fact store BEFORE the watch mission exists - when
# scan.begin starts it later, the gate releases at once on the stored fact
# ("released by fact"), and the emit echoes the fact's payload back
# (payload_from the gate = the payload is read).
version: 1
name: p4f03_before_gate
transport: {type: fake, seed: 1337}
operation: ../packages/p4f03.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach senders their
  # recipients before the emit
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, do: fire, event: mk.fact, unit: 1, payload: {pos: [-35.363, 149.166, 0], conf: 0.9}, until: "BUS_OUT.*n=found\\.it"}
  - {t: 0, do: wait, seconds: 3}
  # only now do the watch missions start - the fact is already held
  - {t: 0, do: fire, event: mk.scan, unit: 1, until: "BUS_OUT.*n=scan\\.begin"}
  - {t: 0, do: wait_journal, unit: 2, re: "gate seen released by fact", timeout: 60}
  - {t: 0, do: wait_journal, unit: 3, re: "gate seen released by fact", timeout: 60}
  - {t: 0, do: wait_journal, unit: 2, re: "BUS_OUT.*n=ack\\.found", timeout: 30}
  - {t: 0, do: opabort}

settle_s: 0
assert:
  # the sticky emit went out with a fact sequence
  - journal_count: {unit: 1, re: "FACT_OUT.*n=found\\.it", at_least: 1}
  # the waiting steps released on the stored fact, not a live event
  - journal_count: {unit: 2, re: "gate seen released by fact", equals: 1}
  - journal_count: {unit: 3, re: "gate seen released by fact", equals: 1}
  # payload read: the emit echoed the fact payload it got from the gate
  - journal_count: {unit: 2, re: "BUS_OUT.*n=ack\\.found", at_least: 1}
  - journal_count: {unit: 3, re: "BUS_OUT.*n=ack\\.found", at_least: 1}
