# launch/p4f05_used - TASK-P4F-07 acceptance "used": two confirmed persons
# against a max_launches: 1 grant - the first delivery consumes the one
# use under the grant, the second person's trigger hits the USED grant
# and falls back to a live approval (NO_GRANT used).
#
# Op:      tests/packages/p4f05.deploy.json.
# World:   worlds/sar_forest_two_person.yaml - person_2 added at the NE
#          corner of the op area.
# Evidence: one LAUNCH_GO use=1/1 for the first delivery; the second
#           person's confirm raises a plain APPROVAL_REQ launch (the
#           grant is used - the fallback rides the live path).
#
# The proof needs person_2's confirm to land AFTER the first delivery
#          has ended - a deliver trigger evaluated while the mission is
#          ACTIVE is suppressed on priority and its once_per key is
#          spent. The three sector claims complete ~3 min into the run
#          while the delivery lands ~10+ min in, and person_2's NE-corner
#          spot sits outside every covered swath, so no organic detection
#          can trail the first delivery. The scenario therefore injects
#          person_2's detection as an s1-authored detect.detected fact
#          right after LAUNCH_DONE - it still runs the real fact ->
#          WM_NEW -> operator confirm -> sys.target_state -> trigger path,
#          and the trigger meets a USED grant (max_launches 1 spent).
version: 1
name: p4f05_used
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest_two_person.yaml
operation: ../packages/p4f05.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: none, action: none}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300,
     authorize: {amb1: {max_launches: 1}}}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "amb1", re: "LAUNCH_GRANT .* valid=",
     timeout: 60}
  - {t: 40, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 45, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  - {t: 50, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 55, do: wait_journal, unit: "amb1", re: "LAUNCH_GO",
     timeout: 300}
  # the first delivery runs its denied tail (drop approval unanswered)
  # home; person_2's confirm then hits the used grant
  - {t: 60, do: wait_journal, unit: "amb1", re: "LAUNCH_DONE",
     timeout: 600}
  # inject person_2's detection once the first delivery is done: the
  # step's own keys become the 1090 envelope (sd preserved => it looks
  # like an s1 broadcast); the bot books a second person target and the
  # operator confirm then drives the real WM/trigger path on amb1.
  # _GD_, not _AGN_: organic detections ride _GD_ so the GCS (and the
  # operator bot) sees them - _AGN_ reaches units only and the bot
  # would never book the tid to confirm.
  - {t: 65, do: send, ty: i, mt: 1090, tg: _GD_, sd: s1,
     ms: {v: 1, op: sar_forest,
          oh: "sha256:208817374f72c2b546b5108e1c615798b1d2160b15891a7d4e642646c91de75b",
          run: "{OP_RUN}", id: "p4f05-used-det-p2-0001",
          tgt: "p4f05-used-det-p2-0001", src: s1, role: searcher,
          seq: 900, t: 0, age: 0, ttl: 86400, st: 1, fq: 1,
          n: detect.detected,
          p: {pos: [-35.3586, 149.1700, 0], conf: 0.9, unc_m: 3,
              range_m: 80, src: ai, class: person}}}
  - {t: 70, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 600}
assert:
  - journal_count: {unit: "amb1", re: "LAUNCH_GO grant=.* use=1/1",
                    equals: 1}
  - journal_count: {unit: "amb1", re: "LAUNCH_DONE", equals: 1}
  # the second confirmed person raised a live launch request - the
  # grant could not cover it (used)
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  - no_journal: {unit: "amb1", re: "LAUNCH_GO.*use=2"}
  # both persons really appeared in the world model
  - journal_count: {unit: "amb1", re: "WM_NEW .* cls=person",
                    at_least: 2}
  - status_field: {unit: "amb1", path: "launch.grant", equals: used}
  - final_state: {unit: "amb1", fc_mode: [RTL, LAND]}
teardown: land
