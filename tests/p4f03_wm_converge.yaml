# TASK-P4F-03 scenario 5 "wm converge": detections are facts. copter3 is
# cut while copter1 reports two targets, then the author is killed - plain
# retries can never reach copter3. Back online, copter3's world-model
# digest AND fact coverage diverge (WM_DIVERGE/FACT_DIVERGE on copter2),
# it syncs from copter2's replay copies, and both digests match again.
version: 1
sim: ../sims/copters3_faults.yaml
operation: ../packages/p4f03.deploy.json
steps:
  - stop
  - clear
  - mode: {unit: all, mode: GUIDED}
  - deploy
  - arm: all
  - opstart
  - wait: 15
  - link_cut: {unit: 3, seconds: 75}
  - wait: 2
  - fire: {event: mk.det, unit: 1,
           until: {re: "BUS_OUT.*n=target\\.fire", count: 1},
           payload: {pos: [-35.3600, 149.16500], unc_m: 20, conf: 0.7}}
  - fire: {event: mk.det, unit: 1,
           until: {re: "BUS_OUT.*n=target\\.fire", count: 2},
           payload: {pos: [-35.3650, 149.17000], unc_m: 20, conf: 0.6}}
  - wait_journal: {unit: 2, re: "WM_DIVERGE copter3$", timeout: 45}
  - kill: {unit: 1, proc: de_comm}        # the author is gone
  - wait_journal: {unit: 3, re: "comm line online", timeout: 120}
  # the missed detections arrive as copter2's relays
  - wait_journal: {unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1",
                   timeout: 120}
  - wait_journal: {unit: 2, re: "WM_DIVERGE copter3 cleared", timeout: 120}
  - wait: 5
  # bring the author back so teardown can land it cleanly
  - restart: {unit: 1, proc: de_comm}
  - wait: 10
  - opabort

assert:
  - journal_count: {unit: 2, re: "WM_DIVERGE copter3$", at_least: 1}
  - journal_count: {unit: 3, re: "BUS_RELAY.*rl=copter2.*src=copter1",
                   at_least: 2}
  - journal_count: {unit: 3, re: "WM_NEW", equals: 2}
  - journal_count: {unit: 2, re: "WM_DIVERGE copter3 cleared", at_least: 1}
