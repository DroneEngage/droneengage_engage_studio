# TASK-P4A-05 scenario 2b: same cut, but area.clear has ttl 30 s
# (p4a05_scout_ttl30). The scout must report UNDELIVERED ... copter2 at the
# TTL, and copter2 must NOT activate late when its link returns.
version: 1
name: p4a05_ttl
transport: {type: fake, seed: 1337}
operation: ../../packages/p4a05_ttl.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the emit
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: link_cut, unit: 2, dur_s: 60}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  - {t: 0, do: wait_journal, unit: 3, re: "activating mission work", timeout: 60}
  - {t: 0, do: wait_journal, unit: 1, re: "UNDELIVERED.*copter2", timeout: 60}
  - {t: 0, do: wait_journal, unit: 2, re: "comm line online", timeout: 120}
  # give a (wrong) late delivery every chance to happen
  - {t: 0, do: wait, seconds: 30}

  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 1, re: "UNDELIVERED.*copter2.*why=ttl", at_least: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  - journal_count: {unit: 2, re: "activating mission work", equals: 0}
