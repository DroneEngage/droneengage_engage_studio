# TASK-P4A-05 scenario 2b: same cut, but area.clear has ttl 30 s
# (p4a05_scout_ttl30). The scout must report UNDELIVERED ... copter2 at the
# TTL, and copter2 must NOT activate late when its link returns.
version: 1
sim: ../../sims/copters3_faults.yaml
operation: ../../packages/p4a05_ttl.deploy.json
steps:
  - stop
  - clear
  - mode: {unit: all, mode: GUIDED}
  - deploy
  - arm: all
  - opstart
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the emit
  - wait: 15
  - link_cut: {unit: 2, seconds: 60}
  - wait: 2
  - fire: {event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  - wait_journal: {unit: 3, re: "activating mission work", timeout: 60}
  - wait_journal: {unit: 1, re: "UNDELIVERED.*copter2", timeout: 60}
  - wait_journal: {unit: 2, re: "comm line online", timeout: 120}
  # give a (wrong) late delivery every chance to happen
  - wait: 30

  - opabort

assert:
  - journal_count: {unit: 1, re: "UNDELIVERED.*copter2.*why=ttl", at_least: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  - journal_count: {unit: 2, re: "activating mission work", equals: 0}