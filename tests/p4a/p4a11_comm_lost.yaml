# TASK-P4A-11 acceptance 6 "server down 60 s mid-chain": the whole fleet
# loses the comm server (kill fake_server) while the run is active. With
# a fleet package comm_lost means ISOLATED: the server link down AND no
# roster frame from any bound peer for sv_comm_lost_s (10 s in the sim
# template). Every unit fires the handler exactly once (default policy
# "continue" - journal only), nobody hangs waiting on the bus, and after
# the server is back a TTL-valid event still delivers exactly once and a
# peer that finished stays finished.
version: 1
sim: ../../sims/copters3_faults.yaml
operation: ../../packages/p4a05.deploy.json
steps:
  - stop
  - clear
  - mode: {unit: all, mode: GUIDED}
  - deploy
  - arm: all
  - opstart
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the outage
  - wait: 15
  # the server dies mid-run: no roster, no events, no op control for 60 s
  - kill: {unit: server, proc: fake_server}
  - wait_journal: {unit: all, re: "comm line offline", timeout: 40}
  - wait_journal: {unit: all, re: "handler comm_lost fired", timeout: 60}
  - wait: 50                      # ~65 s total outage
  - server_up
  - wait_journal: {unit: all, re: "comm line online", timeout: 120}
  - wait: 15                      # rosters + the bus settle again
  # recovery: a fresh emit must still arrive once per worker
  - fire: {event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  - wait_journal: {unit: 2, re: "activating mission work", timeout: 90}
  - wait_journal: {unit: 3, re: "activating mission work", timeout: 60}
  - wait: 5
  - opabort
assert:
  # comm line fell and came back on every unit
  - journal_order: {unit: all, first: "comm line offline", then: "comm line online"}
  # fleet comm_lost fired exactly once per unit, journal-only (continue)
  - journal_count: {unit: all, re: "handler comm_lost fired", equals: 1}
  - journal_count: {unit: all, re: "handler comm_lost fired.*-> continue", equals: 1}
  # nobody waited forever or fired a second time; the run kept its state
  - journal_count: {unit: all, re: "timed out", equals: 0}
  # recovery delivered the post-outage emit to both workers exactly once
  - journal_count: {unit: 2, re: "activating mission work", equals: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  - journal_count: {unit: all, re: "UNDELIVERED", equals: 0}
  - journal_count: {unit: 1, re: "^DELIVERED.*n=area\\.clear", at_least: 1}
teardown: land
