# precland/standalone/pl_flap_hysteresis - PL-07: hysteresis and rate
# limits under a flapping scene.
#
# The "flap" scene alternates target/blank frames at 10 fps (~0.4 s on,
# ~0.4 s off): the lock flickers LOCKED <-> SEARCHING but the frozen
# 2 s lock-pair hysteresis suppresses a locked that lands <2 s after
# the last emitted one - and a lost can only follow an emitted locked,
# so lost never outnumbers locked. Over 20 s of flap that means at most
# ~8 emitted pairs, far under the 25+ un-gated transitions would give.
#
# "one_tag" feeds exactly one AprilTag while detection.min_tags is 2
# (per-unit config): the gate demotes to DEGRADED and the fact carries
# reason "min_tags", rate limited to one per events.min_interval_ms.
#
# The final steady target_near produces the run's single stabilized.
version: 1
name: pl_flap_hysteresis
transport: fake
settle_s: 5
teardown: none
fleet:
  - id: node
    cls: static_precland
    config: {de_precland: {detection: {min_tags: 2}}}
timeline:
  - {t: 0, do: restart, unit: node, proc: de_precland}
  - {t: 0, do: write_file, unit: node, module: de_precland,
     path: precland_scene.json, json: {scene: "empty"}}
  - {t: 1, do: wait_log, unit: node, module: de_precland,
     re: "TEST SOURCE: scenes from", timeout: 60}
  - {t: 15, do: fire, event: precision_landing.enable, unit: node}
  - {t: 15, do: wait_log, unit: node, module: de_precland,
     re: 'EVENT_OUT precision_landing\.enabled .*"src":"event"',
     timeout: 30}
  # 20 s of target/blank flicker
  - {t: 20, do: write_file, unit: node, module: de_precland,
     path: precland_scene.json, json: {scene: "flap"}}
  # a 1-tag feed under min_tags 2: DEGRADED, reason min_tags
  - {t: 40, do: write_file, unit: node, module: de_precland,
     path: precland_scene.json, json: {scene: "one_tag"}}
  # back to a steady target: one lock, held past stabilized_s once
  - {t: 50, do: write_file, unit: node, module: de_precland,
     path: precland_scene.json, json: {scene: "target_near"}}
  - {t: 50, do: wait_log, unit: node, module: de_precland,
     re: 'EVENT_OUT precision_landing\.stabilized .*"held_s":2\.',
     timeout: 30}
assert:
  # 2 s pair hysteresis: <= ~1 emitted lock pair per 2.4 s of flap
  - module_log_count: {unit: node, module: de_precland,
      re: "EVENT_OUT precision_landing\\.locked ",
      at_least: 4, at_most: 11}
  # every lost follows an emitted locked - the hysteresis suppresses
  # the lost of a suppressed lock, so lost can never outnumber locked
  - module_log_count: {unit: node, module: de_precland,
      re: "EVENT_OUT precision_landing\\.lost ",
      at_least: 3, at_most: 11}
  # DEGRADED under one_tag + min_tags 2, rate limited to ~1 per 2 s
  - module_log_count: {unit: node, module: de_precland,
      re: 'EVENT_OUT precision_landing\.degraded .*"reason":"min_tags"',
      at_least: 1, at_most: 5}
  # one steady lock after the flap: exactly one stabilized
  - module_log_count: {unit: node, module: de_precland,
      re: "EVENT_OUT precision_landing\\.stabilized ", equals: 1}
  - module_log_count: {unit: node, module: de_precland,
      re: "EVENT_OUT precision_landing\\.faulted ", equals: 0}
