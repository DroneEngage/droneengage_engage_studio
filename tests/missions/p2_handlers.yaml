# missions/p2_handlers - P2-10 handler ladder on a single unit: the
# p2_10_handlers package declares comm_lost: rtl and battery_low: rtl.
# A 25 s link cut (sv_comm_lost_s 3) makes de_comm journal the offline
# line, fire "handler comm_lost fired ... -> rtl" and pause the run
# ("paused (handler:comm_lost)") while the FC flies the rtl backstop.
# A pilot GUIDED override then catches the descent before touchdown -
# a landing would disarm and COMPLETE the run - and once the link is
# back `resume` lifts the pause (armed + flying + out of failsafe
# mode), because handlers only latch while the engine is RUNNING.
# The battery fault then sets BATT_CAPACITY=50 mAh so remaining
# percent collapses (battery_low keys on PERCENT, which the FC derives
# from consumed mAh - a bare voltage sag never moves it) plus a 10.5 V
# sag for the telemetry side; five seconds under the threshold fires
# "handler battery_low fired ... -> rtl" on the same run. Each handler
# latches once per run, so both appear exactly once.
# Proves declared policies actually drive FC behaviour, not just
# journals.
version: 1
audience: core
name: p2_handlers
transport: fake
operation: ../../packages/p2_10_handlers.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter, config: {de_comm: {sv_comm_lost_s: 3}}}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  # comms loss while airborne -> comm_lost handler -> rtl + pause
  - {t: 20, fault: link_cut, unit: c1, dur_s: 25}
  - {t: 30, do: wait_journal, unit: c1, re: "handler comm_lost fired",
     timeout: 60}
  # catch the rtl descent before touchdown - landing disarms and
  # COMPLETES the run, after which no handler can latch
  - {t: 31, do: mode, unit: c1, mode: GUIDED}
  - {t: 55, do: wait_journal, unit: c1, re: "comm line online",
     timeout: 60}
  # link back - resume lifts the comm_lost pause so the run is RUNNING
  # again; a refusal would surface here, not at the battery wait
  - {t: 57, do: resume}
  - {t: 58, do: wait_journal, unit: c1,
     re: "resumed \\(was handler:comm_lost\\)", timeout: 30}
  # then a low battery - the second handler fires on the same run
  - {t: 62, fault: battery, unit: c1, volts: 10.5, cap_mah: 50,
     dur_s: 200}
  - {t: 72, do: wait_journal, unit: c1, re: "handler battery_low fired",
     timeout: 90}
assert:
  - journal_count: {unit: c1, re: "comm line offline", equals: 1}
  - journal_count: {unit: c1, re: "comm line online", equals: 1}
  - journal_count: {unit: c1, re: "handler comm_lost fired.*-> rtl",
                    equals: 1}
  - journal_count: {unit: c1, re: "handler battery_low fired.*-> rtl",
                    equals: 1}
  - journal_count: {unit: c1, re: "paused \\(handler:", equals: 2}
  - telemetry_value: {unit: c1, field: bat_v, lt: 11.0, pick: min}
teardown: reset
