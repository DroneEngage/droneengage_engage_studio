# missions/p2_paged - P2-08 upload-on-activate (paged segments): the unit runs
# with sv_force_paged, so the deploy loads only the start mission's
# segment ("paged load of mission wide_search") instead of the whole
# fc_items layout. When "person.candidate" preempts into orbit_here,
# THAT mission's segment is paged onto the FC at activation time
# ("segment orbit_here uploaded") - the FC never carries missions that
# are not active. This is the paged counterpart of p2_preempt_resume,
# which loads the full layout up front.
version: 1
audience: core
name: p2_paged
transport: real
operation: ../packages/p2_07_preempt.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 45
fleet:
  - {id: c1, cls: copter, config: {de_comm: {sv_force_paged: true}}}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 35, do: fire, event: person.candidate, unit: c1,
     until: {re: "segment orbit_here uploaded|activating mission orbit_here",
             tries: 6, every_s: 8}}
  - {t: 45, do: wait_journal, unit: c1, re: "activating mission orbit_here",
     timeout: 120}
assert:
  - journal_count: {unit: c1,
                    re: "paged load of mission wide_search", equals: 1}
  - journal_count: {unit: c1, re: "segment orbit_here uploaded",
                    at_least: 1}
  - journal_count: {unit: c1, re: "activating mission orbit_here",
                    equals: 1}
teardown: land
