# copter_rtcm_bus (SL-0233): stub_gnss gives the fix, stub_rtcm sends the
# fixture RTCM3 stream on the bus (6548, once, 360-byte messages, delayed
# to start_s 40 so the capture is armed first). de_mavlink must send it
# to the FC as GPS_RTCM_DATA. The unit's de_mavlink log shows the
# injection; the fcb proxy captures the 233 frames on the FC link and
# fcb_frames reassembles them - 2280 bytes = the whole fixture stream.
# FAILS until de_mavlink injects RTCM.
version: 1
audience: extended
name: copter_rtcm_bus
tasks: [SL-0233, DE-0135]
realtime: true
speedup: 1                   # the stubs and the world run on wall clock
transport: fake
world: ../../worlds/forest_a.yaml
settle_s: 10
fleet:
  - {id: copter1, cls: copter_mav_gps, modules: [stub_gnss, stub_rtcm],
     fcb_proxy: true,
     config: {stub_rtcm: {rtcm: {start_s: 40}}}}
timeline:
  - {t: 0, do: fcb_capture, unit: copter1, msgid: 233}
  - {t: 0, do: wait, seconds: 30}   # SITL boot, no GPS yet
  - {t: 40, do: wait, seconds: 40}
assert:
  - telemetry_value: {unit: copter1, field: fix_type, at_least: 3}
  - module_log_count: {unit: copter1, module: de_mavlink, re: "(?i)rtcm", at_least: 1}
  - fcb_frames: {unit: copter1, msgid: 233, reassemble: gps_rtcm_data,
                 payload_bytes: 2280}
teardown: reset
