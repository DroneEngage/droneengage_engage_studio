# p4b/p4b10_e_loss30 - TASK-P4B-10 acceptance E: the whole SAR op under
# 30 % packet loss on every unit's server link.
#
# The loss is switched on at t=30, right after "RUN run ... started" -
# after the deploy/start 1094 handshakes so the run itself is not
# racing the fault - and stays on until the scenario's automatic
# link_clear "all" at the end (the runner clears all links when the
# scenario finishes, same as gcs_disconnect).
#
# Timing relaxations vs the nominal scenario, per spec
# ("record relaxed timing bounds in the report"):
#   - alloc bound   10 s -> 110 s (bid window + coordinator publish have
#                                  to survive retries over lossy links)
#   - launch->air   20 s -> 45 s  (segment upload + preflight under loss)
#   - signal->drop  -> 900 s record bound (informational; the flight is
#                    ~2x slower in the worst case)
# Outcome assertions are the same as p4b10_a_nominal - 30 % loss changes
# when things land, not whether they land.
#
# Op: packages/sar_forest_loss30.deploy.json - the same op with a
#     loss-tolerant searcher package carrying two changes:
#       - expect_bidders 3 + bid_cap_s 90 (GL-0029): the coordinator
#         defers its assign publish past bid_window_s until all three
#         searcher bids are in, bounded by the cap. The fault drops
#         ~half of every bus copy (30 % on each link leg) and ~3/4 of
#         each copy+ack round; bus resends land at ages ~1,3,7,15 s
#         then every ~10 s, so bid convergence takes ~5-75 s - a fixed
#         window is always either too short (5 s assigned over a bid
#         set of 1, seen live) or a probabilistic bet (55 s still lost
#         a bid that landed +76 s). Waiting for the expected count is
#         deterministic; the 90 s cap is the bound on a bidder that
#         never arrives.
#       - search-region floor 300 -> 800 m in square_around(target.pos,
#         max(800, 3*unc)). While bids converge under loss the phone
#         estimate can collapse unc_m while pos is still the coarse
#         first-fix (observed unc ~150 m at gen -> side 444 m, N edge
#         -35.3613); the person sits ~390 m off-centre at -35.3606 and
#         fell outside the square - all searchers swept and landed,
#         s3's closest leg 83 m short. The 800 m floor reproduces the
#         nominal coverage (nominal unc ~265 -> side ~800 m) whenever
#         unc collapses early under loss.
version: 1
name: p4b10_e_loss30
realtime: true
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest_loss30.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 300
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  # switch the 30 % loss on for the whole op, fleet-wide
  - {t: 30, fault: loss, unit: "all", percent: 30}
  - {t: 35, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 40, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 300}
  - {t: 45, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 240}
  # the operator's confirm is a one-shot 1086; under loss a unit may miss
  # it and converge later through the WM digest repair (straight to the
  # final state) - the ambulance is the unit that must have it
  - {t: 50, do: wait_journal, unit: "amb1",
     re: "WM_STATE .* confirmed by operator", timeout: 600}
  - {t: 55, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 240}
  - {t: 60, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 900}
  - {t: 65, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 300}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  # same outcome as A - relaxed deltas only
  - journal_count: {unit: "all", re: "WM_NEW .* cls=phone", at_least: 1}
  - journal_count: {unit: "all",
                    re: "WM_STATE .* confirmed by k_sources_within",
                    at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "ALLOC_BID", at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  # relaxed: 10 -> 110 s (the loss30 package's 85 s bid window plus an
  # assign retry round must fit)
  - journal_time_delta: {u1: s1, re1: "WM_NEW .* cls=phone",
                         u2: s1, re2: "CLAIM .* index",
                         max_s: 110, ordered: true}
  - journal_count: {unit: "all", re: "WM_NEW .* cls=person", at_least: 1}
  # every unit's world model reached confirmed-or-later for the person
  # (missed one-shot decisions are repaired by the digest sync)
  - journal_count: {unit: "amb1", re: "WM_STATE .* confirmed by operator",
                    at_least: 1}
  - journal_count: {unit: "all",
                    re: "WM_STATE .* (confirmed by operator|served by serves)",
                    at_least: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  # relaxed: 20 -> 45 s
  - journal_time_delta: {u1: amb1, re1: "APPROVAL_OK .* by",
                         u2: amb1, re2: "launch: goto fc seq .* in AUTO",
                         max_s: 45, ordered: true}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - distance_to: {unit: "amb1", re: "emit payload\\.dropped",
                  truth: [person_1], max_m: 15}
  # recorded end-to-end bound under loss (spec: "record the relaxed
  # timing bounds in the report") - the assert records, the report cites
  - journal_time_delta: {u1: s1, re1: "WM_NEW .* cls=phone",
                         u2: amb1, re2: "emit payload\\.dropped",
                         max_s: 900, ordered: true}
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind
teardown: land
