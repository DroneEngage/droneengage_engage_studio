# p4b/p4b10_n_track_step - MP-0217 / TASK-27 acceptance: a mission
# 'track' step locks de_tracker on a confirmed world-model target - the
# supervisor resolves the confirming detection's trk + cam_id and sends
# visual_tracker.lock to the observing unit's cam-matched tracker; the
# lane drain sends visual_tracker.unlock once.
#
# Op:      Tasks/mission_planner/ops/track_step.deop (compiled on
#          demand by opbuild; track_step.ctx.json feeds --caps so the
#          CAP rules run against the cam-scoped visual_tracker_camm1
#          advert). One static watcher: gate 'seen' on detect.detected,
#          track step 'lockon' ({target: person}), a time gate 'dwell'
#          (run+55 s) that keeps the lock observable, then emit
#          watch.done -> op end -> the watcher lane drains and unlocks.
# World:   worlds/track_step.yaml - person_1 and car_1 under the
#          mast's nadir camera, BOTH in-frame (car parked 2 m east -
#          perceive_gate's 2 m south overflows the obs box and the
#          strict parser would drop the whole frame); p_detect 1.0,
#          no pixel noise - deterministic. person_1 is the first
#          detection -> trk 1, car_1 -> trk 2.
# Fleet:   camm1 alone, a static mast on person_1; stub_ai_box reports
#          from the start (unit default enabled) so the world model
#          sees person_1 immediately.
#
# Proves per spec:
#   - the step waits for a CONFIRMED target: journal_order puts
#     "WM_STATE .* confirmed" before the lock row
#   - the lock resolves the confirming observation: journal
#     "S: watch track lockon lock trk=1 unit=camm1 cam=camm1" (person_1
#     is detection #1 on cam 'camm1')
#   - it lands as a cam-pinned invoke: stub stdout
#     "visual_tracker lock (invoke): lock=trk:1 cam=camm1" and the live
#     state publish carries lock:"trk:1"
#   - the lane drain releases it once: one "track unlock (scope lockon"
#     journal row and one stub "unlock (invoke): lock=none"
#   - no flight is commanded: zero NavMode rows / FC commands to the
#     static
#
# Negative control is built in: drop the operator confirm (or the
# tracker's cam_id) and the lockon step waits its timeout to "end" -
# no lock, no watch.done, no OP_END.
version: 1
name: p4b10_n_track_step
seed: 7
transport: fake
world: ../../worlds/track_step.yaml
operation: ../../../Tasks/mission_planner/ops/track_step.deop
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 120
operator:
  confirm: {person: {after_s: 3}}
fleet:
  - {id: camm1, cls: static, role: watcher, modules: [stub_ai_box],
     base: [-35.3605671, 149.1679909, 584, 0]}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 33, do: wait_journal, unit: "camm1", re: "S: .* activated",
     timeout: 120}
  # person_1 is on the wire immediately; the operator confirms ~3 s in
  - {t: 40, do: wait_journal, unit: "all", re: "WM_NEW .* cls=person",
     timeout: 240}
  - {t: 45, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 240}
  # the track step resolves the confirmed target and locks trk 1 on
  # the observing unit's cam-matched tracker
  - {t: 50, do: wait_journal, unit: "camm1",
     re: "S: watch track lockon lock trk=1 unit=camm1 cam=camm1",
     timeout: 120}
  # watch.done -> op end -> the lane drains and the unlock fires once
  - {t: 60, do: wait_journal, unit: "all", re: "OP_END watch\\.done",
     timeout: 300}
  - {t: 65, do: wait_journal, unit: "camm1",
     re: "S: watch track unlock \\(scope lockon", timeout: 240}
  - {t: 99, do: wait, seconds: 15}
assert:
  # --- the lock resolves the CONFIRMED target, in order --------------
  - journal_order: {unit: "all",
                    first: "WM_STATE .* confirmed by operator",
                    then: "S: watch track lockon lock trk=1"}
  - journal_count: {unit: "camm1",
                    re: "S: watch track lockon lock trk=1 unit=camm1 cam=camm1",
                    equals: 1}
  # --- the invoke lands on the cam-matched tracker: it holds trk 1 ---
  - module_log_count: {unit: "camm1", module: stub_ai_box,
                       re: "visual_tracker lock \\(invoke\\): lock=trk:1 cam=camm1",
                       at_least: 1}
  # --- the unlock rides the lane drain, exactly once ------------------
  - journal_count: {unit: "all", re: "OP_END watch\\.done", equals: 1}
  - journal_count: {unit: "camm1", re: "OP_END watch\\.done -> hold",
                    equals: 1}
  - journal_count: {unit: "camm1",
                    re: "S: watch track unlock \\(scope lockon trk=1 unit=camm1\\)",
                    equals: 1}
  - module_log_count: {unit: "camm1", module: stub_ai_box,
                       re: "visual_tracker unlock \\(invoke\\): lock=none",
                       at_least: 1}
  # --- lock-on only: nothing commands flight ---------------------------
  - journal_count: {unit: "camm1", re: "ALLOC|CLAIM|TAKEOVER", equals: 0}
  - journal_count: {unit: "camm1", re: "NavMode", equals: 0}
  - no_fc_command_to_static: {unit: camm1}
teardown: land
