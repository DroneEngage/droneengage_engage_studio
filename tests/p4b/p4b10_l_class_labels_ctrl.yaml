# p4b/p4b10_l_class_labels_ctrl - TASK-B4-02 control for L: same decoy
# world, same stub remap (persons reported as 'human'), but the op is
# the ORIGINAL sar_forest - detect.detected has no classes, so W5 falls
# back to equality ('human' != 'person') and drops every aliased box.
#
# Op:      ops/sar_forest_labels_ctrl.op.json verified at the gate - the
#          ctx binds cam_scout to a stub_ai_box advert whose class enum
#          lacks 'person', so CAP-008 fires (error severity per MP-0214)
#          and verify.proceed_rules lets the run deploy anyway with the
#          finding recorded in verify.json; then the plain
#          packages/sar_forest.deploy.json (de.package/2.2) deploys.
#
# Proves per spec:
#   - 'human' boxes are really emitted (journal "event detect.detected
#     latched ... cls=human") yet WM_NEW cls=person is ZERO over the
#     whole run
#   - the classless sdr.signal path is unaffected: the phone target is
#     found, confirmed and claimed as usual
#   - CAP-008 was recorded at verify time (verify.json in the run dir
#     carries the finding)
version: 1
name: p4b10_l_class_labels_ctrl
seed: 7
transport: fake
world: ../../worlds/sar_forest_decoy.yaml
operation: ops/sar_forest_labels_ctrl.op.json
verify: {cli: ../../tools/verify_wrap.js, proceed_rules: [CAP-008]}
settle_s: 180
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0},
     config: {stub_ai_box: {class_labels: {person: human}}}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60},
     config: {stub_ai_box: {class_labels: {person: human}}}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0},
     config: {stub_ai_box: {class_labels: {person: human}}}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60},
     config: {stub_ai_box: {class_labels: {person: human}}}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, operation: ../../packages/sar_forest.deploy.json,
     timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  # the classless sdr path still finds the phone -> sector_scan claims
  - {t: 35, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  # let the searchers sweep long enough that person_1 would certainly
  # have been seen - with equality W5 every 'human' box drops instead
  - {t: 99, do: wait, seconds: 90}
assert:
  # --- the person entity really was seen, labelled 'human' ------------
  - journal_count: {unit: "all", re: "event detect\\.detected latched .* cls=human",
                    total: true, at_least: 1}
  # --- yet W5 dropped every one of them -------------------------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=person", equals: 0}
  - journal_count: {unit: "all", re: "WM_NEW .* cls=car", equals: 0}
  # --- the classless path is unaffected --------------------------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=phone", at_least: 1}
  - journal_count: {unit: "all",
                    re: "WM_STATE .* confirmed by k_sources_within",
                    at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
teardown: land
