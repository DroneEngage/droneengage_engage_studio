# sound/sound_loop_stop - TASK-EV-SND / D-SND-3: a {loop:true} command
# repeats the clip until something ends it. Two phases in one run:
#
#   e_loop  emit sound.siren.play {loop:true}  -> started, looping
#   e_stop  emit sound.siren.stop              -> finished reason "stopped"
#   e_loop2 emit sound.siren.play {loop:true}  -> starts again, no stop
#   (loop_max_s = 5 in the sim catalog)         -> finished reason "limit"
#
# g_stop uses the simple {event} gate (the latch is still empty when it
# is entered); g_limit needs the all_of cond form so it counts only
# evidence received AFTER its entry - the run-long latch already holds
# the first finished.
version: 1
name: sound_loop_stop
transport: fake
operation: ../../packages/snd_loop.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: rig, cls: static, modules: [de_sound]}
timeline:
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 20, do: wait_journal, unit: rig,
     re: "S: walk gate g_start released by sound\\.siren\\.started",
     timeout: 30}
  - {t: 25, do: wait_journal, unit: rig,
     re: "S: walk gate g_stop released", timeout: 30}
  - {t: 30, do: wait_journal, unit: rig,
     re: "S: walk gate g_limit released", timeout: 45}
  - {t: 32, do: wait_journal, unit: rig,
     re: "S: walk emit sound\\.probe_done", timeout: 30}
  - {t: 40, do: stop}
assert:
  - journal_count: {unit: rig, re: "S: walk activated", equals: 1}
  - journal_count: {unit: rig,
                    re: "S: walk gate g_start released by sound\\.siren\\.started",
                    equals: 1}
  - journal_count: {unit: rig, re: "S: walk emit sound\\.siren\\.stop",
                    equals: 1}
  - journal_count: {unit: rig, re: "S: walk gate g_stop released",
                    equals: 1}
  - journal_count: {unit: rig, re: "S: walk gate g_limit released",
                    equals: 1}
  - journal_count: {unit: rig, re: "S: walk emit sound\\.probe_done",
                    equals: 1}
  # the fact payloads distinguish the two endings: the module's own
  # sendJMSG line carries the full 1061 body
  - module_log_count: {unit: rig, module: de_sound,
                       re: "sound\\.siren\\.finished.*\"reason\": \"stopped\"",
                       equals: 1}
  - module_log_count: {unit: rig, module: de_sound,
                       re: "sound\\.siren\\.finished.*\"reason\": \"limit\"",
                       equals: 1}
  # two loop items -> two started facts
  - module_log_count: {unit: rig, module: de_sound,
                       re: "sound\\.siren\\.started", equals: 2}
teardown: none
