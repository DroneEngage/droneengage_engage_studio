# sar/p4b10_k_class_filter - TASK-B4-01 acceptance K: the reference SAR
# op over a world that also contains a CAR decoy and a camera-visible
# phone - every wire box now carries class_id/class_name, so a non-person
# detection can no longer fuse into the declared person target (the
# pre-B4-01 W5 fail-open).
#
# Op:      packages/sar_forest.deploy.json - identical to scenario A
#          (roles cam_scout, sdr_scout, searcher x3, ambulance; person
#          confirm = operator_confirm, phone = k_sources_within k:1).
# World:   worlds/sar_forest_decoy.yaml - person_1 at X, phone_1 = X +
#          30 m (camera-visible: no detect_cls filter), and car_1, a
#          static car ~120 m south of X on the same lawnmower lane
#          corridor inside the search area. The stubs emit class-aware
#          boxes for all three.
#
# Proves per spec:
#   - the car decoy is really seen by a camera stub (detection truth row
#     sent, cls car) and at least one de_mavlink projects it as
#     class "car" (journal "event detect.detected latched ... cls=car")
#   - W5 rejects it: the fleet sees exactly ONE person target, near
#     person_1, and none within 60 m of the decoy; no car target is ever
#     declared (undeclared class) and no WM_NEW cls=car appears
#   - the phone's class "phone" boxes likewise create no person target
#     (the single WM_NEW cls=person covers both)
#   - the rest of the SAR chain still completes -> OP_END
#
# Negative control (run by hand, record the output): set
#   config: {stub_ai_box: {legacy_box: true}}
# on every camera unit (or sensors.camera.legacy_box in the world) - the
# stubs emit the pre-B4-01 geometry-only box, the car box resolves to the
# null/selected class and fails open into a SECOND person target, so the
# WM_NEW person equals:1 assert fails. That rerun demonstrates the
# fail-open this scenario proves closed.
version: 1
name: p4b10_k_class_filter
speedup: 1                   # the world truth tick is wall-clock
seed: 7
transport: fake
world: ../../worlds/sar_forest_decoy.yaml
operation: ../../packages/sar_forest.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  # arm the flyers only - amb1 is start:"ground" auto_launch; the op
  # owns its arm through the launch approval + stepper
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  - {t: 45, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 50, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 120}
  - {t: 55, do: wait_journal, unit: "amb1",
     re: "launch: goto fc seq .* in AUTO", timeout: 240}
  - {t: 60, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 480}
  - {t: 65, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 240}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  # --- the decoy was seen and labelled car end to end -----------------
  # a stub emitted a car detection (truth row, tid car_1, sent)
  - detection_recall: {truth: car_1, src: ai, min: 1}
  # and at least one projector fired it as class car - SL-0061: the
  # detection's class is journaled on the latched row (the de_mavlink
  # DEBUG print is gone since the geo_projector_core refactor)
  - journal_count: {unit: "all", re: "event detect\\.detected latched .* cls=car",
                    total: true, at_least: 1}
  # --- W5 dropped it: exactly one person target, at X -----------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=person", equals: 1}
  - journal_count: {unit: "all", re: "WM_NEW .* cls=car", equals: 0}
  # the single person target sits on person_1, not on the decoy (~120 m
  # away - a fusion of the car box would land within metres of car_1)
  - distance_to: {unit: "s1", re: "WM_NEW .* cls=person",
                  detected_cls: person, truth: [person_1], max_m: 25}
  - distance_to: {unit: "s1", re: "WM_NEW .* cls=person",
                  detected_cls: person, truth: [car_1], min_m: 60}
  # --- the rest of the SAR chain still completes -----------------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=phone", at_least: 1}
  - journal_count: {unit: "all",
                    re: "WM_STATE .* confirmed by k_sources_within",
                    at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  - journal_count: {unit: "all", re: "WM_STATE .* confirmed by operator",
                    at_least: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  # scout1's orbit_track then-rule is "hold": it can legitimately still
  # be on the orbit leg at teardown, so assert its operation completed
  # rather than a parked fc mode (OP_END is asserted above)
  - final_state: {unit: "scout1"}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
teardown: land
