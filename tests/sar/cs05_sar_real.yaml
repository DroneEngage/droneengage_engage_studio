# sar/p4b10_a_nominal - TASK-P4B-10 acceptance A: the reference SAR op
# end-to-end with an operator who approves everything.
#
# Op:      packages/sar_forest.deploy.json (roles cam_scout, sdr_scout,
#          searcher x3, ambulance). person confirm = operator_confirm,
#          phone confirm = k_sources_within k:1 (the single SDR scout).
# World:   worlds/sar_forest.yaml - person_1 static at X inside the op
#          area, phone_1 = person_1 + ~30 m; the stub sdr fires
#          sdr.signal inside ~600 m, the stub ai boxes fire a detection
#          inside 50 m of X. All detections come from the world stubs
#          (no `fire` steps).
# Chain proven here: sdr signal -> WM_NEW phone -> ALLOC bid/coordinator
# -> CLAIM on 3 disjoint sectors -> person detected -> WM_STATE
# confirmed by operator -> APPROVAL_REQ launch -> approve -> controlled
# launch (upload/preflight/arm/goto) -> drop_hold -> APPROVAL_REQ action
# (payload.release) -> approve -> ACTION_RESULT ok -> emit
# payload.dropped -> OP_END + per-role RTLs.
#
# amb1 is a start:"ground" auto_launch role: the scenario never arms it;
# sv_allow_auto_launch: true is the site switch the launch stepper needs
# (de_comm default is OFF - sv_supervisor.cpp only enables the NAV_LAUNCH
# stepper for start:"ground"+auto_launch roles when the config says so).
version: 1
audience: extended
requires: []
name: cs05_sar_real
realtime: true
seed: 7
transport: real
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  # arm the flyers only - amb1 is start:"ground" auto_launch; the op
  # owns its arm through the launch approval + stepper
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  # sdr1's wide_search brings it inside the ~600 m phone gate; the stub
  # fires sdr.signal -> WM_NEW cls=phone on every unit
  - {t: 35, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  # bid window + vehicle coordinator + claims: one sector per searcher
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  # the person is inside the covered area: a searcher/scout box becomes
  # WM_NEW cls=person; the bot confirms it ~3 s later
  - {t: 45, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 50, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 120}
  - {t: 55, do: wait_journal, unit: "amb1",
     re: "launch: goto fc seq .* in AUTO", timeout: 240}
  - {t: 60, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 480}
  - {t: 65, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 240}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  # --- phone target -> 3 disjoint strips within 10 s -----------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=phone", at_least: 1}
  # the single sdr_scout source confirms the phone (k_sources_within)
  - journal_count: {unit: "all",
                    re: "WM_STATE .* confirmed by k_sources_within",
                    at_least: 1}
  - signals_in_range: {unit: "sdr1", re: "EVENT_IN.*sdr\\.signal",
                       truth: phone_1, max_m: 650, min_count: 1}
  # every searcher bid, saw the 3-sector assign and claimed one index
  # each - the CLAIM index is the disjoint-strip evidence; the per-sector
  # layer lives in the assign payload, not in a journal line
  - journal_count: {unit: "s1,s2,s3", re: "ALLOC_BID", at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "ALLOC_ASSIGN .* sectors 3",
                    at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  # allocation inside 10 s of the phone target appearing (spec bound)
  - journal_time_delta: {u1: s1, re1: "WM_NEW .* cls=phone",
                         u2: s1, re2: "CLAIM .* index",
                         max_s: 10, ordered: true}
  - journal_count: {unit: "s1,s2,s3", re: "GEN .* items", at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "activating mission",
                    at_least: 1}
  # --- person detected -> operator confirm -> launch ------------------
  - journal_count: {unit: "all", re: "WM_NEW .* cls=person", at_least: 1}
  # the reported person position lands inside the P3-07 error budget of
  # the world truth
  - distance_to: {unit: "s1", re: "WM_NEW .* cls=person",
                  detected_cls: person, truth: [person_1], max_m: 25}
  - journal_count: {unit: "all", re: "WM_STATE .* confirmed by operator",
                    at_least: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  # launch approval -> airborne (goto in AUTO) inside 20 s of the grant
  - journal_time_delta: {u1: amb1, re1: "APPROVAL_OK .* by",
                         u2: amb1, re2: "launch: goto fc seq .* in AUTO",
                         max_s: 20, ordered: true}
  # --- drop within 15 m of X ------------------------------------------
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ action", equals: 1}
  - journal_count: {unit: "amb1",
                    re: "action payload\\.release approved id=", equals: 1}
  - journal_count: {unit: "amb1", re: "ACTION_RESULT .* ok", at_least: 1}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - distance_to: {unit: "amb1", re: "emit payload\\.dropped",
                  truth: [person_1], max_m: 15}
  # --- OP_END + RTLs; every approval journaled -------------------------
  - journal_count: {unit: "all", re: "event sys\\.op_end", equals: 1}
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - journal_count: {unit: "amb1,s1,s2,s3,sdr1",
                    re: "OP_END payload\\.dropped -> rtl", equals: 1}
  - journal_count: {unit: "scout1", re: "OP_END payload\\.dropped -> hold",
                    equals: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_OK", equals: 2}
  - operator_log_count: {re: "APPROVAL approve", equals: 2}
  - operator_log_count: {re: "WORLD confirmed", at_least: 1}
  - journal_count: {unit: "amb1,s1,s2,s3,sdr1", re: "NavMode confirmed",
                    at_least: 1}
  - journal_order: {unit: "amb1", first: "PHASE deliver",
                    then: "OP_END payload\\.dropped"}
  # every vehicle ends RTL or landed; scout1's then-rule is hold - it
  # may legitimately still be finishing its wide_search segment
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  # --- global ----------------------------------------------------------
  # the SAR op rewrites FC missions by design (paged/dynamic segment +
  # launch uploads are the journaled cause) - the stock CAUSE_RE only
  # names mission uploads, so cause_re is widened to the real upload
  # journal wording
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind (journal ids
  # are <run>:<activation>:<row>; no existing assertion proves they are
  # unique per activation)
teardown: land
