# TASK-P4A-05 scenario 1: 30% seeded loss on every link. The scout emits
# area.clear once (go.now -> "signal" mission; the go.now trigger itself
# is re-fired until the scout journals BUS_OUT - the GCS command channel
# is not under test); acks + retries must get it
# to BOTH workers, each activating "work" exactly once. Run it 10 times
# (see RUNBOOK): every run must pass. BUS_RETRY lines are expected.
version: 1
name: p4a05_loss
tier: smoke
transport: {type: fake, seed: 1337}
operation: ../packages/p4a05.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the emit
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: loss, unit: all, percent: 30}
  - {t: 0, do: fire, event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  # 30 % on both hops each way: an attempt + its ack survive ~1 in 4,
  # and the retry tail is 10 s - allow a long unlucky streak
  - {t: 0, do: wait_journal, unit: 2, re: "activating mission work", timeout: 180}
  - {t: 0, do: wait_journal, unit: 3, re: "activating mission work", timeout: 180}
  - {t: 0, do: wait_journal, unit: 1, re: "DELIVERED.*n=area\\.clear", timeout: 180}
  - {t: 0, do: link_clear, unit: all}
  - {t: 0, do: wait, seconds: 5}

  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 1, re: "BUS_OUT.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 2, re: "BUS_IN.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 3, re: "BUS_IN.*n=area\\.clear", equals: 1}
  - journal_count: {unit: 2, re: "activating mission work", equals: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  # every event ends with a delivery report; never UNDELIVERED here
  - journal_count: {unit: 1, re: "^DELIVERED.*n=area\\.clear", at_least: 1}
  - journal_count: {unit: 1, re: "UNDELIVERED", equals: 0}
  # informational: retries and the delivery time (in_ms) for the PR
  - journal_count: {unit: 1, re: "BUS_RETRY.*n=area\\.clear", at_least: 0}
