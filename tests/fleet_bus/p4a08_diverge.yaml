# TASK-P4A-08 scenario 4: copter3 is cut while copter1/copter2 detect two new
# targets -> copter1 and copter2 journal WM_DIVERGE copter3 (its roster
# digest stays old > 10 s); after the cut, catch-up delivers the
# detections, the digests match again -> "WM_DIVERGE copter3 cleared".
# Timings at sv_roster_hz 0.2: stale 15 s, lost 30 s.
version: 1
audience: core
name: p4a08_diverge
transport: {type: fake, seed: 1337}
operation: ../packages/p4a08.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: link_cut, unit: 3, dur_s: 40}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: det.go, unit: 1, until: {re: "BUS_OUT.*n=target\\.fire", count: 1}, payload: {pos: [-35.3600, 149.16500], unc_m: 
        20, conf: 0.7}}
  - {t: 0, do: fire, event: det.go, unit: 2, until: {re: "BUS_OUT.*n=target\\.fire", count: 1}, payload: {pos: [-35.3650, 149.17000], unc_m: 
        20, conf: 0.6}}
  - {t: 0, do: wait_journal, unit: 1, re: "WM_DIVERGE copter3$", timeout: 40}
  - {t: 0, do: wait_journal, unit: 3, re: "comm line online", timeout: 120}
  - {t: 0, do: wait_journal, unit: 1, re: "WM_DIVERGE copter3 cleared", timeout: 90}
  - {t: 0, do: wait, seconds: 10}

  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 1, re: "WM_DIVERGE copter3$", at_least: 1}
  - journal_count: {unit: 1, re: "WM_DIVERGE copter3 cleared", at_least: 1}
  - journal_count: {unit: 2, re: "WM_DIVERGE copter3 cleared", at_least: 1}
  # copter3 ends with both targets (catch-up)
  - journal_count: {unit: 3, re: "WM_NEW", equals: 2}
