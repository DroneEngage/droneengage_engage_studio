# TASK-P4A-11 acceptance 8 "peer_lost: rtl" - a two-drone op (both units
# role "pair") whose package carries handlers.peer_lost: "rtl". Both
# fly a takeoff -> stage -> cond-hold mission; ~10 s into the run
# copter2's server link is cut for 120 s (fake server, fast roster:
# sv_peer_lost_s 8). Each side then watches the other turn LOST:
# sys.peer_lost fires the handler once -> NavMode rtl + the run pauses
# (handler:peer_lost). The handler is latched once per run - when the
# link comes back (ROSTER ... back) it must NOT fire again.
version: 1
name: p4a11_peer_lost
transport: {type: fake, seed: 1337}
operation: ../packages/p4a11_pair.deploy.json
fleet:
  - {id: copter1, cls: copter, config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
  - {id: copter2, cls: copter, config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: reset, unit: all}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  - {t: 0, do: wait, seconds: 10} # rosters already flow from READY; the
                                # cut lands mid-leg, before any emit
  - {t: 0, fault: link_cut, unit: copter2, dur_s: 120}
  - {t: 0, do: wait_journal, unit: copter1, re: "ROSTER copter2 lost", timeout: 60}
  - {t: 0, do: wait_journal, unit: copter1, re: "handler peer_lost fired", timeout: 60}
  - {t: 0, do: wait_journal, unit: copter1, re: "NavMode confirmed", timeout: 90}
  # the cut side sees its own peer go silent and fires the same handler
  - {t: 0, do: wait_journal, unit: copter2, re: "handler peer_lost fired", timeout: 60}
settle_s: 0
assert:
  # each unit declared the other LOST exactly once
  - journal_count: {unit: copter1, re: "ROSTER copter2 lost", equals: 1}
  - journal_count: {unit: copter2, re: "ROSTER copter1 lost", equals: 1}
  - journal_count: {unit: all, re: "event sys\\.peer_lost", equals: 1}
  # the handler ran exactly once per unit and drove both to rtl
  - journal_count: {unit: all, re: "handler peer_lost fired.*-> rtl", equals: 1}
  - journal_count: {unit: all, re: "paused \\(handler:peer_lost\\)", equals: 1}
  - journal_order: {unit: copter1, first: "ROSTER copter2 lost", then: "handler peer_lost fired"}
  - journal_order: {unit: copter1, first: "handler peer_lost fired", then: "NavMode confirmed"}
  - journal_count: {unit: all, re: "NavMode confirmed", at_least: 1}
  # the gate's rtl backstop never ran - the handler beat it
  - journal_count: {unit: all, re: "timed out", equals: 0}
teardown: reset
