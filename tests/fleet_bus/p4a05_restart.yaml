# TASK-P4A-05 scenario 3: the scout's de_comm restarts while area.clear is
# still pending for copter2 (link cut). After the restart the persisted
# pending table resumes the retries: copter2 activates once its link is
# back, and the scout journals DELIVERED.
version: 1
audience: core
name: p4a05_restart
transport: {type: fake, seed: 1337}
operation: ../../packages/p4a05.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the emit
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: link_cut, unit: 2, dur_s: 45}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  - {t: 0, do: wait_journal, unit: 3, re: "activating mission work", timeout: 60}
  - {t: 0, do: wait, seconds: 3}
  - {t: 0, fault: restart, unit: 1, proc: de_comm}
  - {t: 0, do: wait_journal, unit: 2, re: "activating mission work", timeout: 150}
  - {t: 0, do: wait_journal, unit: 1, re: "DELIVERED.*n=area\\.clear", timeout: 60}
  - {t: 0, do: wait, seconds: 5}

  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 2, re: "activating mission work", equals: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  - journal_count: {unit: 1, re: "^DELIVERED.*n=area\\.clear", at_least: 1}
  - journal_count: {unit: 1, re: "UNDELIVERED", equals: 0}
  # retries ran after the restart too (informational)
  - journal_count: {unit: 1, re: "BUS_RETRY.*n=area\\.clear", at_least: 1}
