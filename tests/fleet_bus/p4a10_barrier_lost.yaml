# TASK-P4A-10 scenario "cond barrier, peer_lost=continue" - 3 copters all
# bound to role "searcher"; the gate is
#   {all_of: [{event:"staging.ready", from:"searcher", n:"all"}]}
# copter1's link is cut mid-leg (fake server). After sv_peer_lost_s
# (15 s) its roster entry goes LOST and the required set shrinks: units
# 2+3 depart once both emitted, without waiting for copter1. On its own
# side copter1 sees 2+3 LOST, so its own emit satisfies its gate too -
# it departs alone, later.
# realtime + `do: start`: the cut must land before ANY unit emits
# staging.ready - if copter1's emit is latched before the cut, all three
# emits are in and the gate releases by cond without waiting for the
# LOST shrink, and the lost-before-release order asserts below become
# timing luck (measured margin was ~0.8 s with `do: opstart`, whose ~40 s
# reply window pushed the cut to the emit point). `do: start` returns
# when the started replies land, so wait+cut lands ~10-15 s in, ~30 s
# before the first emit (DE-0047, same fix as p4a10_barrier_hold).
version: 1
name: p4a10_barrier_lost
realtime: true
transport: {type: fake, seed: 1337}
operation: ../packages/p4a10_searcher.deploy.json
fleet:
  - {id: copter1, cls: copter, config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
  - {id: copter2, cls: copter, config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
  - {id: copter3, cls: copter, config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: reset, unit: all}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: start}
  - {t: 0, do: wait, seconds: 10} # rosters already flow from READY; the
                                 # cut lands mid-leg, before any emit
  - {t: 0, fault: link_cut, unit: 1, dur_s: 300} # the far unit goes silent mid-leg
  - {t: 0, do: wait_journal, unit: 2, re: "gate g released by cond", timeout: 180}
  - {t: 0, do: wait_journal, unit: 3, re: "gate g released by cond", timeout: 60}
  - {t: 0, do: wait_journal, unit: 1, re: "gate g released by cond", timeout: 120}
settle_s: 0
assert:
  - journal_count: {unit: all, re: "emit staging.ready", equals: 1}
  - journal_count: {unit: all, re: "gate g released by cond", equals: 1}
  # the surviving pair released only after copter1 was declared LOST
  - journal_order: {unit: 2, first: "ROSTER .* lost", then: "gate g released"}
  - journal_order: {unit: 3, first: "ROSTER .* lost", then: "gate g released"}
  - journal_time_delta: {u1: 2, re1: "gate g released", u2: 3, re2: "gate g released", max_s: 8}
  # nobody took the contingency
  - journal_count: {unit: all, re: "timed out", equals: 0}
teardown: reset
