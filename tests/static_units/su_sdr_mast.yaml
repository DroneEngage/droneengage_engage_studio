# static_units/su_sdr_mast - SU-02 desk run 1 on a static (comm-only) mast: the
# sdr.watch mission (trigger op.start, end repeat 30 s) activates on
# START and parks at an event gate on "sdr.signal". A burst of three
# fires inside ONE pass produces exactly ONE "emit phone.signal" - the
# edge-release rule. The pass paces to the next activation by
# repeat_min_s ("pass done - next in 30 s" + "repeat pass"), where the
# later signal releases the gate a second time. STOP runs the on_exit
# actions once ("on_exit sdr.stop"). On a static unit nothing ever goes
# near the FC, which no_fc_command_to_static proves.
version: 1
name: su_sdr_mast
transport: fake
operation: ../packages/su_sdr.deploy.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 20
fleet:
  - {id: mast, cls: static}
timeline:
  - {t: 0, do: deploy}
  - {t: 5, do: start}
  - {t: 8, do: wait_journal, unit: mast,
     re: "S: watch_rf gate listen waits sdr\\.signal", timeout: 60}
  # three detections in one pass -> the gate edge fires exactly once
  - {t: 12, do: fire, event: sdr.signal, unit: mast,
     payload: {pos: [-35.3630, 149.1660], conf: 0.9}}
  - {t: 13, do: fire, event: sdr.signal, unit: mast,
     payload: {pos: [-35.3631, 149.1660], conf: 0.8}}
  - {t: 14, do: fire, event: sdr.signal, unit: mast,
     payload: {pos: [-35.3632, 149.1660], conf: 0.7}}
  # the next pass is paced >=30 s after the first; this signal lands in it
  - {t: 50, do: fire, event: sdr.signal, unit: mast,
     payload: {pos: [-35.3640, 149.1660], conf: 0.9}}
  - {t: 70, do: wait_journal, unit: mast,
     re: "S: watch_rf emit phone\\.signal", timeout: 90}
  - {t: 75, do: stop}
assert:
  - journal_count: {unit: mast, re: "S: watch_rf activated", equals: 1}
  - journal_count: {unit: mast, re: "S: watch_rf gate listen released",
                    at_least: 1}
  - journal_count: {unit: mast, re: "S: watch_rf emit phone\\.signal",
                    equals: 2}
  - journal_count: {unit: mast, re: "S: watch_rf pass done - next in 30 s",
                    at_least: 1}
  - journal_count: {unit: mast, re: "S: watch_rf on_exit sdr\\.stop",
                    equals: 1}
  # the mast was never commanded to fly: no nav adapter, no NavMode, no
  # flight-mission activation, no arm/disarm lines at all (same evidence
  # set as p4a11_static_end; no_fc_command_to_static false-positives on
  # the package line's "fc_items=0" until checks.py is adjusted)
  - journal_count: {unit: mast, re: "NavMode", equals: 0}
  - journal_count: {unit: mast,
                    re: "activating mission|nav adapter|takeoff|disarm",
                    equals: 0}
teardown: none
