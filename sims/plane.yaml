# Runbook: sims/plane.md
#
# Personal sim: ONE fixed-wing box - ArduPlane SITL + de_comm + de_mavlink -
# on YOUR OWN server stack (servers/sh_start_servers.sh).
# See quadcopter.yaml for the external-server fields. Runs in parallel with
# the other personal sims; slot_base keeps the sysids distinct (ports are
# allocator leases - `./sim ports`).
description: |
  Personal sim: one fixed-wing box (ArduPlane SITL + de_comm + de_mavlink)
  on your own external server stack (auth on, slot_base 70). Runs in
  parallel with the other personal sims.
version: 1
slot_base: 70                 # identity only: SITL -I/sysid base; the
                              # allocator leases every port (`./sim ports`)
server:
  type: external
  auth: true
  auth_ip: 127.0.0.1
  auth_port: 19408
  ip: 127.0.0.1
  port: 9966
units:
  - {block: plane, name: plane1}
