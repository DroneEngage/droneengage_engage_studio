# Personal sim: ONE fixed-wing box - ArduPlane SITL + de_comm + de_mavlink -
# on YOUR OWN server stack (servers/sh_start_servers.sh).
# See quadcopter.yaml for the external-server fields. Runs in parallel with
# the other personal sims; slot_base 70 keeps every port/sysid disjoint.
version: 1
slot_base: 70                 # plane: pilot 6460, fcb 8360, de_comm 62700,
                              # de_mavlink s2s 63700, ctl 62079, sysid 70
server:
  type: external
  auth: true
  auth_ip: 127.0.0.1
  auth_port: 19408
  ip: 127.0.0.1
  port: 9966
units:
  - {block: plane, name: plane1}
