# closed environment (P4A-10 scenario 4): no GPS on any SITL (the FC
# flies on the SIM AHRS - AHRS_EKF_TYPE 10), the fleet server stamps a
# clock that is 3 h wrong (clock_offset_ms) and copter3 never receives
# a clock stamp at all (noclock) so it stays tq=0 from boot. slot_base
# 30 keeps the SITL identity/sysids clear of the developer's own SITL
# (ports are allocator leases now - `./sim ports`).
version: 1
slot_base: 30
server:
  type: fake
  clock_offset_ms: 10800000        # the fleet clock runs 3 h ahead
  noclock: [copter3]               # no 9007 ts, no pong ts -> tq=0
fc:
  params:
    SIM_GPS1_ENABLE: 0
    SIM_GPS2_ENABLE: 0
    GPS1_TYPE: 0
    GPS2_TYPE: 0
    AHRS_EKF_TYPE: 10
