# Runbook: sims/copters3_static_faults.md
#
# Three quad copters plus a de_comm-only static unit, on the fake server:
# seeded per-link loss / delay / cut plus the clock-offset control. The
# fleet for the P4A-09 two-phase deploy test (the watcher role needs a
# static unit, and the clock skew needs the fake server).
version: 1
units:
  - {block: copter, name: copter, count: 3}     # copter1..copter3, 20 m apart
  - {block: comm_only, name: static1, at: {north_m: -30}}
server: {type: fake, seed: 1337}
