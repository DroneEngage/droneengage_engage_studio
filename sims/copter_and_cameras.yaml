# Runbook: sims/copter_and_cameras.md
#
# Camera fleet: a camera copter and a fixed camera post (needs the
# de_camera binary + a V4L2 device; see blocks/copter_camera).
description: |
  Camera fleet: a camera copter (camcopter, copter + de_camera) and a
  fixed camera post (tower1, de_comm + de_camera, no FC) on the spawned
  real server. Needs the de_camera binary + a V4L2 device per camera
  unit (see blocks/copter_camera).
version: 1
# DE-0050: ffmpeg testsrc producers on every camera unit's configured
# /dev/videoN before de_camera scans (exclusive_caps needs a producer
# for CAPTURE to enumerate). Create the devices first: ./sim vcam
camera_feed: testsrc2
units:
  - {block: copter_camera, name: camcopter}
  - block: camera_fixed
    name: tower1
    at: {north_m: -50, east_m: 30}
    config:
      de_camera: {camera: {camera_start_index: 3, camera_end_index: 3}}
