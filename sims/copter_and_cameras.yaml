# Runbook: sims/copter_and_cameras.md
#
# Camera fleet: a camera copter and a fixed camera post (needs the
# de_camera binary + the named V4L2 pool; see blocks/copter_camera).
description: |
  Camera fleet: a camera copter (camcopter, copter + de_camera on an
  auto-assigned DE-CAM label) and a fixed camera post (tower1, de_comm
  + de_camera, no FC, bound to DE-CAM2) on the spawned real server.
  Needs the de_camera binary + the named v4l2loopback pool
  (./sim vcam --pool once; see blocks/copter_camera).
version: 1
audience: extended
requires: [camera, v4l2loopback]
# DE-0050: ffmpeg testsrc producers on every bound /dev/videoN before
# de_camera scans (exclusive_caps needs a producer for CAPTURE to
# enumerate). The devices come from the one-time named pool:
# ./sim vcam --pool  (sudo tools/setup_v4l2loopback.sh)
camera_feed: testsrc2
units:
  - {block: copter_camera, name: camcopter}
  - block: camera_fixed
    name: tower1
    cameras: [DE-CAM2]
    at: {north_m: -50, east_m: 30}
