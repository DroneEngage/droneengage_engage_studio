# One of each vehicle type plus a ground node.
description: |
  One of each vehicle type plus a ground node on the spawned real
  server: copter1 (quad), plane1 (fixed-wing), rover1 and ground1
  (de_comm only). For fleet-mix scenarios and the mixed-vehicle
  bring-up regression.
version: 1
audience: core
requires: []
units:
  - {block: copter, name: copter1}
  - {block: plane,  name: plane1, at: {east_m: 60}}
  - {block: rover,  name: rover1, at: {east_m: -40}}
  - {block: comm_only, name: ground1, at: {north_m: -30}}
