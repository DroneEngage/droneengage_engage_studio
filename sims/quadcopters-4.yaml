# Runbook: sims/quadcopters-4.md
#
# Sim: FOUR quadcopter boxes - ArduCopter SITL (raw binary over TCP,
# like sitl_tcp.sh) + de_comm + de_mavlink - on YOUR OWN server stack.
#
# Start your servers first (servers/sh_start_servers.sh): authenticator on
# 19408, comm server on 9966. Nothing server-side is spawned here; only a
# per-sim GCS bridge runs so `./sim ctl` keeps working.
#
# Runs in parallel with rover.yaml / plane.yaml. slot_base is identity
# only now (SITL -I/sysid); every port is a machine-wide allocator lease
# (`./sim ports` shows the real ones), so overlapping fleets can't
# collide anyway - the base just keeps sysids distinct.
description: |
  Sim: four quadcopter boxes (ArduCopter SITL + de_comm +
  de_mavlink each) on your own external server stack (auth on,
  slot_base 50). Runs in parallel with the other sims.
version: 1
audience: core
requires: []
slot_base: 50                 # identity only: SITL -I/sysid base; the
                              # allocator leases every port (`./sim ports`)
server:
  type: external
  auth: true                  # units log in via your authenticator
  auth_ip: 127.0.0.1
  auth_port: 19408
  ip: 127.0.0.1               # your comm server (auth: false = direct)
  port: 9966
  # account:      {user: ..., code: ...}   # GCS bridge login (GCS bit) -
  # unit_account: {user: ..., code: ...}   # default unit login (unit bit;
  #                                        # cannot login as GCS)
  # else SIM_AUTH_* / SIM_UNIT_AUTH_* from sim.local.env (out of git)
units:
  - {block: copter, name: quad1}
  - {block: copter, name: quad2}
  - {block: copter, name: quad3}
  - {block: copter, name: quad4}
    # account: {user: quad1, code: ...}
    #   # this unit's own login; must exist on your authenticator in the
    #   # same team as the GCS account or the GCS won't see the unit.
    #   # `{name}` in user expands to the unit name (for count: fleets)
