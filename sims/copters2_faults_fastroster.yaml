# copters2 on the fake server with a faster roster cadence:
# sv_roster_hz 1 + sv_peer_lost_s 8 -> a cut unit turns LOST ~8-10 s
# after silence instead of ~30 s, so the P4A-11 peer_lost pair test does
# not have to outwait a whole loiter. Fault steps (link_cut) need the
# fake server.
version: 1
extends: copters2.yaml
server: {type: fake, seed: 1337}
units:
  - {block: copter, name: copter, count: 2,
     config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
