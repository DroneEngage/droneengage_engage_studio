# copters3 on the fake server with a faster roster cadence:
# sv_roster_hz 1 + sv_peer_lost_s 8 -> a cut unit turns LOST ~8-10 s
# after silence instead of ~30 s, so lost-member gate tests do not have
# to outwait a whole loiter.
version: 1
extends: copters3_faults.yaml
units:
  - {block: copter, name: copter, count: 3,
     config: {de_comm: {sv_roster_hz: 1, sv_peer_lost_s: 8}}}
