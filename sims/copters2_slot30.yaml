# Two quad copters on the real droneengage_server, same as copters2 but
# at slot_base 30 (pilot ports 6060+) - used when the developer's own
# SITL sessions already hold the default 5760+10k ports.
version: 1
slot_base: 30
units:
  - {block: copter, name: copter, count: 2,
     # arrive_at: default accel allowance of 3 s covers only spin-up;
     # SITL copters also decelerate ~5 s on waypoint approach at 10 m/s.
     config: {de_comm: {sv_accel_s: 8}}}
