# pure-gates - every push, no SITL, no servers, seconds only.
#
#   check_library.py  engine/*.py compile, every scenario/sim yaml
#                     parses, de.scenario/1 files load through
#                     engine/scenario.py (schema + fleet expansion),
#                     every json parses - shared ops in packages/
#                     plus test fixtures under tests/ and scenario
#                     jsons under scenarios/ (the SL-0059 split)
#   library counts    fails loudly if a library folder is empty so a
#                     bad checkout can never look green
#   verb registry     check_verbs.py: every do:/fault:/assert: name
#                     used under tests//scenarios is registered +
#                     documented (SL-0024)
#   verify ops        check_verify_ops.py: tests/verify ops must be
#                     blocked by the webclient verifier with exactly the
#                     declared expect_rules; every other op under
#                     tests/ must verify clean (needs the webclient
#                     repo - checked out alongside, same sibling layout
#                     the runner uses locally)
#   world model tests engine/test_world_obstacles.py (closed-form
#                     canopy/building LOS + RF, lens round-trips,
#                     ground clutter), engine/test_world_behaviour.py
#                     (seeded behaviour tracks, building rejection,
#                     environment factors, SITL wind params),
#                     engine/test_coverage.py (area grids, per-cell
#                     POD, coverage asserts, runtime budget),
#                     engine/test_world_stream.py (the render feed:
#                     hello/tick contents, port allocation, an
#                     in-process ws round-trip) and
#                     stubs/test_golden.py (the stub selftest replays
#                     vs stubs/golden/*.log) run the model code
#                     in-process with a databus id shim, so they need
#                     no databus checkout
#
# Real transports, SITL and the fake-fleet bring-up are NOT in this
# workflow - they run nightly on a machine that has them
# (.github/workflows/nightly-sitl.yml).
name: pure-gates
on: [push, pull_request]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: python deps
        run: pip install pyyaml jsonschema pymavlink websockets

      - name: library check
        run: python3 ci/check_library.py

      # SL-0024 verb registry: every do:/fault:/assert: name used under
      # tests//scenarios is registered, and every registry verb is in
      # docs/SCENARIOS.md
      - name: verb registry check
        run: python3 ci/check_verbs.py

      # the assertion engine, journal reader, operator-bot reply ring and
      # port allocation; stubs/test_stubs.py skips itself without the
      # databus checkout, and test_geo_projection.py needs the C++ header
      # from a de_* repo, so both run nightly / locally only
      - name: engine unit tests
        run: python3 engine/test_checks.py

      # P5-10/P5-11 world model: closed-form obstacle LOS/RF, both lens
      # round-trips, the ground-clutter replay and the seeded behaviour
      # tracks/environment factors, plus the stub selftest golden
      # byte-compares (a world without the new keys must keep today's
      # stub output)
      - name: world model tests
        run: |
          python3 engine/test_world_obstacles.py
          python3 engine/test_world_behaviour.py
          python3 engine/test_coverage.py
          python3 engine/test_world_stream.py
          python3 engine/test_render_viewer.py
          python3 engine/test_render.py
          python3 stubs/test_golden.py

      # P5-16: Mavlink3DMap's physics core selftest in plain Node; skips
      # itself here (no Mavlink3DMap checkout) and runs locally / nightly
      - name: physics selftest
        run: python3 engine/test_physics_selftest.py

      - name: library folders non-empty
        run: |
          for d in missions static_units fleet_bus faults closed_env verify precland; do
            n=$(find tests/$d -name '*.yaml' 2>/dev/null | wc -l)
            echo "tests/$d: $n yaml"
            [ "$n" -gt 0 ] || exit 1
          done
          [ -f tests/sar/README.md ] || {
            echo "tests/sar/README.md missing"; exit 1; }

  verifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: droneengage_studio

      - name: webclient (verifier sources)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WEBCLIENT_REPO || 'HefnySco/droneengage_webclient_react' }}
          path: droneengage_webclient_react

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: python deps
        run: pip install pyyaml jsonschema pymavlink websockets

      # verify_wrap.js transpiles the verifier's .ts through the
      # webclient's own typescript - only that module is needed, not a
      # full npm ci.
      - name: webclient typescript (for the .ts verifier hook)
        working-directory: droneengage_webclient_react
        run: npm install --no-save --no-audit --no-fund typescript

      - name: verify-gate ops blocked with declared rules
        working-directory: droneengage_studio
        env:
          DE_WEBCLIENT_DIR: ${{ github.workspace }}/droneengage_webclient_react
        run: |
          pip install pyyaml
          python3 ci/check_verify_ops.py
