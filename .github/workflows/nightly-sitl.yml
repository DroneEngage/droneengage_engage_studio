# nightly-sitl - the whole scenario library on real SITL, every night.
#
#   python3 ci/run_suite.py --roots tests --seeds 1,2,3
#
# Runs every tests/**/*.yaml (missions, fleet_bus, sar, launch, worlds,
# static_units, faults, closed_env, verify, top-level) once per seed. Verify-gate scenarios are
# PASS only when verify.json carries the declared expect_rules. A
# fail-then-pass is reported FLAKY with both attempts in
# var/results/nightly/summary.md - never silently green.
#
# MUST run on a machine that owns the machine: self-hosted runner with
# the full DroneEngage workspace checked out as siblings of this repo
# (de_code layout), the sibling binaries built (de_comm, de_mavlink,
# de_camera...), a Rust toolchain (rustup) and `cargo build --release`
# done in the server repos (they pull droneengage_server_common from
# the private DroneEngage/droneengage_server_common repo - the runner
# needs read access: SSH key or SERVER_COMMON_PAT), ArduPilot SITL
# installed, and nothing else bound to the sim port ranges. See
# ci/README.md. It is NOT a GitHub-hosted job.
name: nightly-sitl
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      roots:
        description: "space-separated suite roots"
        default: "tests"
      seeds:
        description: "comma-separated seeds"
        default: "1,2,3"

jobs:
  suite:
    runs-on: [self-hosted, linux, sitl]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: python deps
        run: pip install pyyaml jsonschema pymavlink websockets

      - name: fleet down (clean machine for the suite)
        run: ./sim down || true

      - name: scenario suite
        run: |
          python3 ci/run_suite.py \
            --roots ${{ github.event.inputs.roots || 'tests' }} \
            --seeds ${{ github.event.inputs.seeds || '1,2,3' }}

      - name: summary into job page
        if: always()
        run: cat var/results/nightly/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-suite-${{ github.run_number }}
          path: |
            var/results/
          retention-days: 30

      - name: fleet down (leave the runner clean)
        if: always()
        run: ./sim down || true
