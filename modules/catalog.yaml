# Module catalog: how the engine launches and wires each DroneEngage module.
#
# Blocks list modules by these names. `de_comm` and `sitl` are built in
# (engine/simlib.py); every other entry here is a generic module that talks to
# its unit's de_comm over the s2s UDP bus. To add a module, add an entry -
# no engine change needed.
#
#   repo        folder name under DE_CODE (sim.local.env)
#   dir_env     sim.local.env key that overrides the repo folder
#   bin         binary, relative to repo (or absolute)
#   bin_env     sim.local.env key that overrides `bin` (binaries built elsewhere)
#   template    base config, relative to repo (or modules/templates/<file>)
#   port_base   s2s listening port = port_base + 10 * slot
#   start_delay seconds to wait before exec (let de_comm / SITL come up)
#   needs_fc    true -> only valid in a block that has an `fc:`
#   local       per-unit identity file {module_key}: `arg` passes it on the
#               command line, otherwise it is written as `file` in the
#               module's working directory (run/<unit>/<module>/)
#   set         defaults applied before the block overlays (blocks may change them)
#   wire        applied after the block overlays (blocks cannot break these);
#               "{fcb_port}" / "{pilot_port}" / "{sysid}" / "{comm_port}" /
#               "{port}" / "{unit}" are filled per unit
#   ready_re    journal regex (since boot) that marks the module ready;
#   ready_log_re  same, but matched against logs/<module>.log (stdout)
#               instead of the de_comm journal;
#               `sim up` waits for it

de_mavlink:
  repo: droneengage_mavlink
  dir_env: DE_MAVLINK_DIR
  bin: bin/de_ardupilot
  template: de_mavlink.config.module.json
  port_base: 63000
  start_delay: 5
  needs_fc: true
  local: {arg: "-b", file: de_mavlink.local}
  set:
    tlog_enabled: false
    logger_enabled: false
  wire:
    fcb_connection_uri: {ip: "127.0.0.1", port: "{fcb_port}", type: tcp}
  ready_re: "nav adapter hello"

de_camera:
  repo: drone_engage_camera_2025
  dir_env: DE_CAMERA_DIR
  # de_camera ships a prebuilt x86 binary in the repo (WebRTC gn/ninja
  # builds land in compiled_bin/); DE_CAMERA_BIN overrides
  bin: compiled_bin/de_camera
  bin_env: DE_CAMERA_BIN
  template: de_camera.config.module.json
  port_base: 64000
  start_delay: 3
  local: {file: de_camera.config.local}
  set:
    media_folder: "./img"

# P5-15: the real generic YOLO AI (ONNX runtime) on the rendered feed.
# It finds its V4L2 devices by card label, like in the field: the render
# sink's ffmpeg writes Mavlink3DMap frames to DE-SRC-{cam_index}, the
# module detects them and writes annotated frames to DE-AI-{cam_index},
# which the unit's de_camera streams. model_path is wired absolute so
# the run/<unit>/<module>/ cwd does not need a copy.
de_yolo_ai:
  repo: drone_engage_yolo_ai_generic
  dir_env: DE_YOLO_AI_DIR
  bin: bin/de_yolo_generic
  bin_env: DE_YOLO_AI_BIN
  template: de_yolo_ai_generic.config.module.json
  port_base: 57000
  start_delay: 4
  # its getopt string is "c:vh" - the local file is the LONG option
  # --bconfig only (there is no short -b)
  local: {arg: "--bconfig", file: de_yolo_ai_generic.config.local}
  # stdout-only signal - the journal never sees module init lines
  ready_log_re: "Found primary device"
  wire:
    source_video_device_name: "{src_label}"
    output_video_device_name: "{ai_label}"
    model_path: "{module_dir}/yolo11n.onnx"

# PL-07: the real precision-landing module on a generated test-scene
# feed (no v4l2 needed): test_source replays {precland_scenes}/<scene>/
# frames at test_source.fps, and `write_file` on precland_scene.json
# switches scenes mid-run. -b is the binary's --bconfig short option.
de_precland:
  repo: droneengage_precision_landing
  dir_env: DE_PRECLAND_DIR
  bin: bin/de_precland
  bin_env: DE_PRECLAND_BIN
  template: de_precland.sim.json
  port_base: 56000
  start_delay: 3
  local: {arg: "-b", file: de_precland.local}
  wire:
    test_source: {images_root: "{precland_scenes}",
                  scene_file: "precland_scene.json", fps: 10}
    camera: {calibration_file: "{precland_scenes}/camera.yaml",
             width: 640, height: 480}
    # the multi-tag layout the repo ships at its root - wired absolute
    # like de_yolo_ai's model_path (the module cwd is run/<unit>/)
    target: {layout_json: "{module_dir}/landing-target.json"}
  ready_log_re: "TEST SOURCE: scenes from"

de_tracker:
  repo: droneengage_visual_tracker
  dir_env: DE_TRACKER_DIR
  bin: bin/de_tracker
  template: de_tracker.config.module.json
  port_base: 65000
  start_delay: 3
  # its getopt string has no "b:" - the local file is read from the cwd
  local: {file: de_tracker.config.local}

# GE-07: gpio.<pin>.<verb> event surface + per-pin do actions. The sim
# binary is a TEST_MODE_NO_WIRINGPI_LINK build - pins are virtual and
# INPUT pins read run/<unit>/de_gpio/gpio_inputs.json (the write_file
# step drives it).
de_gpio:
  repo: droneengage_rpi_gpio
  dir_env: DE_GPIO_DIR
  # the repo's own binary needs real WiringPi (a Pi); the sim wants the
  # test-mode build - point DE_GPIO_BIN at it in sim.local.env
  bin: bin/de_rpi_gpio
  bin_env: DE_GPIO_BIN
  # the repo's own template declares Pi board pins; the sim needs the
  # virtual pin set - a templates/ name the repo does not ship wins there
  template: de_rpi_gpio.sim.json
  port_base: 61000
  start_delay: 3
  local: {arg: "-b", file: de_rpi_gpio.config.local}
  # no ready_re: the supervisor journal has no capability-advert line
  # (de_comm journals caps only as "missing capability" on package load
  # and gpio.* events only while a run declares them) - start_delay and
  # the unit-online wait carry bring-up, like the other silent modules

# ---------------------------------------------------------------- P5-08
# World-driven stub sensor modules (stubs/*.py in this repo). A scenario
# with `world:` injects the world path + seed as config "stub" per unit
# (engine/world.py). `pose` marks modules that read the vehicle pose on a
# dedicated SITL serial5 (tcp:5 -> 5765+10k); on static units all stubs
# fall back to the intermodule 9102 location feed.

stub_ai_box:
  repo: droneengage_simulation_land
  bin: stubs/stub_ai_box.py
  template: stub.json
  port_base: 58000
  start_delay: 5
  pose: true
  local: {file: stub_ai_box.local}

stub_sdr:
  repo: droneengage_simulation_land
  bin: stubs/stub_sdr.py
  template: stub.json
  port_base: 59000
  start_delay: 3
  local: {file: stub_sdr.local}

stub_payload:
  repo: droneengage_simulation_land
  bin: stubs/stub_payload.py
  template: stub.json
  port_base: 60000
  start_delay: 3
  local: {file: stub_payload.local}
