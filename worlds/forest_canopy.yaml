# forest_canopy - the P5-10 occluding world (de.world/1).
#
# About the SITL home (-35.363262, 149.165237): three people on a
# north line ~75 m east of home, each behind a different kind of
# cover, and one phone in the crown.
#   person_open   (N 20, E 75)  - open ground: every look has T = 1.
#   person_canopy (N 57, E 75)  - under the wood_n crown (band 3-15 m,
#                 gap 0.3): a nadir look through the full 12 m crown
#                 sees with T = 0.3, an oblique look with
#                 0.3**(1/cos theta) - the property under study, never
#                 asserted (a 40 m lawnmower leg passes right over it).
#   person_hut    (N 95, E 75)  - inside hut_1 (building, 0-4 m): T = 0
#                 from every camera - indoors falls out of the
#                 geometry (D4).
#   phone_canopy  - person_canopy's phone, dropped into the crown at
#                 alt 8 m (inside the band), so the RF the sdr model
#                 gates on must cross the crown.
#
# camera lens rectilinear (D7 - a real lens; the product projector
# stays angle_linear until P5-18, so a detect.detected position keeps
# up to ~1 m of projector error at 40 m nadir - inside every distance
# budget here) and clutter is ground-anchored (D8 - a false positive
# is a seeded ground point re-projected every frame; occlusion gates
# it too).
#
# sdr gate math (stub_sdr model, threshold -70 dBm, n 2.7,
# ref_dbm_1m -30 + tx 10):
#   rssi(d) = -20 - 27*log10(d_slant) - L_obs
#   free-space gate (L = 0): d = 10^(50/27) ~= 71 m.
#   the world_sdr_canopy mast stands 30 m west at ground level (N 57,
#   E 45); its ray to the crown phone rises through ~18.7 m of the
#   wood_n band -> L = 0.3 dB/m * 18.7 = 5.8 dB (cap 20) -> the gate
#   closes at 10^((50-5.8)/27) ~= 43 m instead of 71 - the reduced
#   range the foliage loss implies.
#   radius_m stays sdrEstimateRadiusM's free-space inversion (D10):
#   the event reports ~51 m while the phone is 31 m away - the
#   oversized radius the allocator must cope with.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_open, cls: person, pos: [-35.363082, 149.166063],
     size_m: 0.5}
  - {id: person_canopy, cls: person, pos: [-35.362750, 149.166063],
     size_m: 0.5}
  - {id: person_hut, cls: person, pos: [-35.362409, 149.166063],
     size_m: 0.5}
  - {id: phone_canopy, cls: phone, attach: person_canopy,
     offset_m: [0, 0], alt_m: 8, tx_dbm: 10, freq_hz: 869000000,
     size_m: 0.2}
obstacles:
  - {id: wood_n, kind: canopy,
     poly: [[-35.36290, 149.16580], [-35.36260, 149.16580],
            [-35.36260, 149.16630], [-35.36290, 149.16630]],
     height_m: 15, base_m: 3, gap_fraction: 0.3,
     rf_db_per_m: 0.3, rf_max_db: 20}
  - {id: hut_1, kind: building,
     poly: [[-35.362436, 149.166030], [-35.362382, 149.166030],
            [-35.362382, 149.166096], [-35.362436, 149.166096]],
     height_m: 4, rf_loss_db: 12}
clutter: {cls: person, rate_per_km2_min: 0.2, lifetime_s: 20,
          anchor: ground}
sensors:
  camera:
    lens: rectilinear
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 4            # static mast camera only; FC units
                                  # use rel_alt (the 40 m sweep layer)
    img_w: 1280
    img_h: 720
    p_detect_nadir: 0.95
    p_detect_edge: 0.6
    max_range_m: 120
    pos_noise_px: 8
    fps_boxes: 2
    size_m: {person: 0.5, phone: 0.2}
  sdr:
    freq_hz: 869000000
    path_loss_n: 2.7
    ref_dbm_1m: -30               # -30 + 10 dBm tx -> 71 m free-space
                                  # gate; the crown loss cuts it to 43
    noise_db: 3
    threshold_dbm: -70
    bin_hz: 25000
    sweep_s: 2
