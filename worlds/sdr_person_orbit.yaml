# sdr_person_orbit - world for scenarios/demos/sdr_orbit_viewer.yaml
# (de.world/1).
#
# Open ground around the SITL home (-35.363262, 149.165237):
#   person_1 - the casualty, STATIC at (+120 N, +90 E) of home.
#   phone_1  - the person's phone, 5 m away (attach person_1): the RF
#              emitter the sdr model gates on.
# No obstacles, no clutter - the demo is the orchestration chain, not
# the propagation model.
#
# sdr gate math (stub_sdr model, threshold -70 dBm, n 2.7,
# ref_dbm_1m -30 + tx 8):
#   rssi(d) = -22 - 27*log10(d_slant)
#   free-space gate: d = 10^(48/27) ~= 60 m slant - the scout must come
#   within ~45 m horizontally of the phone at the 40 m survey altitude
#   before sdr.signal fires, so the reported pos (the scout's own pose
#   at detection) lands close to the phone and radius_m reports ~= the
#   true range, <= 60 m.
# 3-sweep debounce at sweep_s 2 -> first signal ~6 s inside the gate.
#
# camera: side-looking mount (yaw +90 deg right, pitch -42 deg) so that
# during a clockwise LOITER_TURNS orbit (nose tangent, centre to the
# right) the optical axis sweeps across the orbit centre the whole
# circle - "camera facing the centre" as a fixed mount, the only form
# the op language can express (no ROI mission item). depression to the
# centre at alt 40, r ~45-70: 30-42 deg, inside the -42 +/- 24.4 deg
# vfov cone.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.362184, 149.166228],
     size_m: 0.5}
  - {id: phone_1, cls: phone, attach: person_1, offset_m: [5, 0],
     tx_dbm: 8, freq_hz: 869000000, size_m: 0.2}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    lens: rectilinear
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -42     # side-looking: +y body (right), 42 deg down
    mount_yaw_deg: 90        # so a CW orbit keeps the centre in frame
    mount_roll_deg: 0
    mount_height_m: 4        # static mast camera only; FC units use
                             # rel_alt
    img_w: 1280
    img_h: 720
    p_detect_nadir: 0.95
    p_detect_edge: 0.6
    detect_cls: [person]     # a visible phone must not fuse into a
                             # person target (see sar_forest B4-01 note)
    max_range_m: 120         # slant; orbit r<=70 at alt 40 -> ~81 m
    pos_noise_px: 8
    fps_boxes: 2
    size_m: {person: 0.5, phone: 0.2}
  sdr:
    freq_hz: 869000000
    path_loss_n: 2.7
    ref_dbm_1m: -30          # -30 + 8 dBm tx -> ~60 m modelled gate
    noise_db: 3
    threshold_dbm: -70
    bin_hz: 25000
    sweep_s: 2
