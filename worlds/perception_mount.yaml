# perception_mount - the SL-0035 (c) world (de.world/1).
#
# One person ~8 m east of the mast: at the 20 m nadir camera that is
# pixel u ~ +0.33, well off the optical axis, so the mount model really
# shifts the projected ground point. Two co-located masts report the
# SAME pixels; camm1's de_comm projects with the world mount (nadir,
# lands on person_1), camm2's unit config overrides cameras.camm2's
# mount_yaw to 90 deg, landing the same pixel ~8 m south of the mast -
# ~11.3 m apart. Each unit's fused world model must therefore show BOTH
# ground points.
#
# Deterministic: p_detect 1.0, no pixel noise, no clutter. Every obs
# frame reports {person} with trk 1 on each unit's cam_id.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3632620, 149.1653251],
     size_m: 0.5}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 20           # ~24 x 18 m nadir footprint
    img_w: 1280
    img_h: 720
    p_detect_nadir: 1.0
    p_detect_edge: 1.0
    max_range_m: 120
    pos_noise_px: 0
    fps_boxes: 2
    size_m: {person: 0.5}
