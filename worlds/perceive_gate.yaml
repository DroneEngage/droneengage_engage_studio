# perceive_gate - the MP-0215 perceive-step world (de.world/1).
#
# A person and a parked car in the same camera footprint of ONE static
# mast (they stand ~2 m apart, the mast sits on person_1): the mission's
# `perceive` step configures classes [person], so the car is detected
# every frame but dropped at the reporting seam (truth rows carry
# sent:false, why:"filtered") while the person reaches the wire.
#
# Detection is deterministic - p_detect 1.0 and pixel noise 0 - so the
# scenario's asserts never flake: before perceive.configure the stub is
# paused (unit config enabled:false) and reports nothing at all; after
# it, person appears every frame and car never does.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3605671, 149.1679909],
     size_m: 0.5}
  # the car ~2 m south of the person - inside the mast's footprint
  - {id: car_1, cls: car, pos: [-35.3605851, 149.1679909], size_m: 4.0}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 8            # ~9.6 m nadir footprint covers both
    img_w: 1280
    img_h: 720
    p_detect_nadir: 1.0
    p_detect_edge: 1.0
    max_range_m: 100
    pos_noise_px: 0
    fps_boxes: 2
    size_m: {person: 0.5, car: 4.0}
