# obs_thermal - the SL-0034 thermal obs world (de.world/1).
#
# Same mast geometry as obs_contract, but the unit's stub_ai_box runs
# camera_kind: thermal so the wire cls is the de_ir_camera vocabulary:
# hotspot/coldspot, never the entity's own cls. ambient is the ~11 C
# dusk ESTIMATE (sun_elev -10). person_1 is temp_c 37
# (ambient+26) -> hotspot; car_1 carries temp_c 40 (a parked
# car cold-soaks to ambient, so it must be set) -> hotspot; person_2 is
# temp_c -10 -> coldspot. Every frame therefore reports
# {coldspot, hotspot, hotspot} with attrs.temp_c inside [-11, 41].
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3632485, 149.165237],
     temp_c: 37.0, size_m: 0.5}
  - {id: person_2, cls: person, pos: [-35.363262, 149.1652537],
     temp_c: -10.0, size_m: 0.5}
  - {id: car_1, cls: car, pos: [-35.3632755, 149.165237], temp_c: 40.0,
     size_m: 2.0}
environment:
  sun_elev_deg: -10               # ambient ESTIMATE: ~11 C
  visibility_m: 600
  precip: none
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    kind: rgb                      # the world default; the test unit
    p_detect_thermal: 1.0          # overrides with camera_kind: thermal
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 4
    img_w: 1280
    img_h: 720
    p_detect_nadir: 1.0
    p_detect_edge: 1.0
    max_range_m: 120
    pos_noise_px: 8
    fps_boxes: 2
    size_m: {person: 0.5, car: 2.0}
