# track_step - the MP-0217 track-step world (de.world/1).
#
# A person and a parked car in the same camera footprint of ONE static
# mast, BOTH fully inside the frame: the mission reports every class
# (no perceive.configure filter in this op), so each obs frame carries
# two valid detections - person_1 first -> trk 1, car_1 -> trk 2. The
# 'track' step then resolves person -> trk 1 and the tracker locks the
# CORRECT track, not just the only one.
#
# The car is ~2 m east of the person (perceive_gate.yaml parks it 2 m
# south, which projects past the frame's bottom edge: obs box y+h > 1
# and the strict obs parser drops the whole frame - including the
# person). Same spot, rotated east, keeps it inside the footprint.
#
# Detection is deterministic - p_detect 1.0 and pixel noise 0 - so the
# scenario's asserts never flake.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3605671, 149.1679909],
     size_m: 0.5}
  # the car ~2 m east of the person - inside the mast's footprint
  - {id: car_1, cls: car, pos: [-35.3605671, 149.1680139], size_m: 4.0}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 8            # ~9.6 m nadir footprint covers both
    img_w: 1280
    img_h: 720
    p_detect_nadir: 1.0
    p_detect_edge: 1.0
    max_range_m: 100
    pos_noise_px: 0
    fps_boxes: 2
    size_m: {person: 0.5, car: 4.0}
