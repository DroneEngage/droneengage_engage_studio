# obs_contract - the SL-0034 stub world (de.world/1).
#
# A 4 m nadir mast at home with three entities inside its ~4.8 x 3.6 m
# footprint: two people and a car. p_detect is 1.0 everywhere - every
# camera frame detects all three, so the stub's 6546 obs frames carry
# the same {car, person, person} cls multiset each tick and the trk ids
# stay stable for the run. No detect_cls, no clutter: the wire contract
# is what is under test, not detection gating.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3632485, 149.165237],
     size_m: 0.5}
  - {id: person_2, cls: person, pos: [-35.363262, 149.1652537],
     size_m: 0.5}
  - {id: car_1, cls: car, pos: [-35.3632755, 149.165237], size_m: 2.0}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 4
    img_w: 1280
    img_h: 720
    p_detect_nadir: 1.0
    p_detect_edge: 1.0
    max_range_m: 120
    pos_noise_px: 8
    fps_boxes: 2
    size_m: {person: 0.5, car: 2.0}
