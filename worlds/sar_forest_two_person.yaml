# sar_forest_two_person - P4F-05's `used` world (de.world/1).
#
# sar_forest plus a second person at the NE corner of the op area. The
# single-person world deliberately dropped its decoy ("a confirmed
# second target would activate ambulance.deliver a second time") - that
# second activation is exactly what p4f05_used needs: person_1's
# confirmed delivery consumes the grant's one use, person_2's confirm
# then hits a USED grant and falls back to a live APPROVAL_REQ.
#
# Ordering caveat (FIXME(unrun)): the live-request proof needs person_2's
# confirm to land after the first delivery mission has ended - a trigger
# evaluated while deliver is ACTIVE is suppressed on priority. The NE
# corner placement biases coverage late, but sector order is decided at
# runtime; if person_2 confirms mid-flight the second trigger is spent
# and only a later sys.target_state for that target would retry.
version: 1
origin: [-35.363262, 149.165237]
entities:
  - {id: person_1, cls: person, pos: [-35.3605671, 149.1679909],
     size_m: 0.5}
  - {id: phone_1, cls: phone, attach: person_1, offset_m: [30, 0],
     tx_dbm: 20, freq_hz: 869000000, size_m: 0.2}
  - {id: person_2, cls: person, pos: [-35.3586, 149.1700], size_m: 0.5}
clutter: {cls: person, rate_per_km2_min: 0, lifetime_s: 20}
sensors:
  camera:
    hfov_deg: 62.2
    vfov_deg: 48.8
    mount_pitch_deg: -90
    mount_yaw_deg: 0
    mount_roll_deg: 0
    mount_height_m: 4
    img_w: 1280
    img_h: 720
    p_detect_nadir: 0.95
    p_detect_edge: 0.6
    detect_cls: [person]
    max_range_m: 100
    pos_noise_px: 8
    fps_boxes: 2
    size_m: {person: 0.5, phone: 0.2}
  sdr:
    freq_hz: 869000000
    path_loss_n: 2.7
    ref_dbm_1m: -15
    noise_db: 3
    threshold_dbm: -70
    bin_hz: 25000
    sweep_s: 2
