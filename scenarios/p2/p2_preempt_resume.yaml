# p2/p2_preempt_resume - P2-07 preemption with resume: while the
# wide_search mission (priority 10) is holding at its clear.zone gate, a
# "person.candidate" event activates the higher-priority orbit_here
# (priority 20) - the search mission is pushed onto the preemption
# stack. When orbit_here ends the stack pops and the journal shows
# "resuming wide_search at seq ..."; firing clear.zone then releases the
# original gate and the run completes. Proves trigger priorities,
# the preemption stack and the resume point.
version: 1
name: p2_preempt_resume
transport: real
operation: ../../packages/p2_07_preempt.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 45
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 35, do: fire, event: person.candidate, unit: c1,
     until: {re: "activating mission orbit_here", tries: 6, every_s: 8}}
  - {t: 45, do: wait_journal, unit: c1, re: "resum", timeout: 240}
  - {t: 50, do: fire, event: clear.zone, unit: c1,
     until: {re: "gate .* released", tries: 6, every_s: 8}}
  - {t: 60, do: wait_journal, unit: c1, re: "completed", timeout: 300}
assert:
  - journal_count: {unit: c1, re: "activating mission orbit_here",
                    equals: 1}
  - journal_count: {unit: c1, re: "resum.*wide_search", at_least: 1}
  - journal_count: {unit: c1, re: "gate .* released", equals: 1}
  - journal_order: {unit: c1, first: "activating mission orbit_here",
                    then: "resum.*wide_search"}
teardown: land
