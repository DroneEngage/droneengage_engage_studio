# p2/p2_gate_timeout - P2-06 gate contingency: the same p2_06_gate
# package, but the operator never fires "drop.ready". The hold expires
# after the package's 25 s timeout and the FC flies the gate's rtl
# contingency on its own ("gate g timed out -> rtl") - the release path
# is never taken and the run still ends cleanly. This is the negative of
# p2_gate: the gate does not wait forever and does not release spuriously.
version: 1
name: p2_gate_timeout
transport: real
operation: ../../packages/p2_06_gate.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 40
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "gate .* timed out -> rtl",
     timeout: 240}
assert:
  - journal_count: {unit: c1, re: "gate .* timed out -> rtl", equals: 1}
  - journal_count: {unit: c1, re: "gate .* released", equals: 0}
teardown: land
