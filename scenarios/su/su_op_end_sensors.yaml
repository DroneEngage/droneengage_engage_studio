# su/su_op_end_sensors - operation end stops every sensor lane at once:
# two static masts (sdr1 with sdr.watch, cam1 with camera.watch) share
# one fleet op (su_masts.deploy.json - 2.2 packages, fleet.end on
# "op.done"). Firing op.done ends the operation fleet-wide: both lanes
# journal "op ended - 1 sensor slot(s) ending", each mast runs its
# own on_exit action once (sdr.stop / camera.record) and the run
# completes. Proves OP_END is a fleet sensor-lane shutdown, not a
# per-unit teardown - and that on_exit fires exactly once per mission.
version: 1
name: su_op_end_sensors
transport: fake
operation: ../../packages/su_masts.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 15
fleet:
  - {id: sdr1, cls: static}
  - {id: cam1, cls: static}
timeline:
  - {t: 0, do: deploy}
  - {t: 5, do: start}
  - {t: 8, do: wait_journal, unit: sdr1,
     re: "S: watch_rf gate listen waits sdr\\.signal", timeout: 60}
  - {t: 8, do: wait_journal, unit: cam1,
     re: "S: watch gate seen waits detect\\.detected", timeout: 60}
  - {t: 12, do: fire, event: sdr.signal, unit: sdr1,
     payload: {pos: [-35.3630, 149.1660], conf: 0.9}}
  - {t: 13, do: fire, event: detect.detected, unit: cam1,
     payload: {pos: [-35.3631, 149.1660], kind: "person"}}
  # operator ends the op - every unit latches op.done -> OP_END
  - {t: 20, do: fire, event: op.done}
  - {t: 25, do: wait_journal, unit: all, re: "OP_END op\\.done",
     timeout: 60}
assert:
  - journal_count: {unit: all, re: "event sys\\.op_end", equals: 1}
  - journal_count: {unit: all, re: "OP_END op\\.done -> hold", equals: 1}
  - journal_count: {unit: all,
                   re: "S: (op end|run stopped).*sensor slot\\(s\\) ending",
                   at_least: 1}
  - journal_count: {unit: sdr1, re: "S: watch_rf on_exit sdr\\.stop id=",
                    equals: 1}
  - journal_count: {unit: cam1, re: "S: watch on_exit camera\\.record id=",
                    equals: 1}
  - journal_count: {unit: all, re: "completed", at_least: 1}
teardown: none
