# verify/verify_missing_capability - the deploy gate blocks an op that
# asks for hardware nobody has: ops/missing_capability.op.json uses
# action 'gpio.write' and requires capability 'sound' on role 'eye',
# while its ctx binds role 'eye' to unit u1 which advertises neither.
# The verifier reports two CAP-001 errors (missing registry action +
# unadvertised required capability); the run stops before fleet
# bring-up - deploy NEVER happens. Expected exit is 1.
version: 1
name: verify_missing_capability
transport: fake
operation: ops/missing_capability.op.json
verify: {cli: ../support/verify_wrap.js, expect_errors: 2,
         expect_rules: ["CAP-001"]}
settle_s: 1
fleet:
  - {id: s1, cls: static}
timeline: []
assert: []
teardown: none
