# gpio/gpio_remote_isolation - GF-07 / GF-01+GF-02: remote Sync_EventFire
# frames must never reach a unit's GPIO module. A non-fleet package is
# uploaded raw over 1085: emits stay unit-local (GF-02), so node_a's
# mission emit drives ONLY its own led, and raw server-sourced 1061
# frames - one stamped OTHER_UNIT_1 (ctl event, the pre-GF-02 twin's
# shape) and one GCS-stamped (ctl send) - are dropped by de_comm before
# they can actuate anything (GF-01).
#
#   t=22  write {"17":1} on node_a  -> lit emits gpio.led.on -> led on
#   t=30  ctl event gpio.led.on     -> OTHER_UNIT_1 1061 to _AGN_
#   t=32  send 1061 gpio.led.on     -> GCS-stamped raw event to _AGN_
#
# node_b must see neither a latched gpio.led event nor a led state
# change. Cross-unit behaviour belongs to the fleet/fact path - see
# gpio_fact_to_action.
version: 1
name: gpio_remote_isolation
transport: fake
operation: ops/gpio_isolate.deop
verify: {cli: ../support/verify_wrap.js}
settle_s: 20
fleet:
  - {id: node_a, cls: static_gpio}
  - {id: node_b, cls: static_gpio}
timeline:
  # normalize the seam file before the restarts so both units boot with
  # released inputs (a stale press would fire went_on on its own unit)
  - {t: 0, do: write_file, unit: node_a, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 0, do: write_file, unit: node_b, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 0, "27": 1}}
  - {t: 2, do: restart, unit: all, proc: de_gpio}
  # the non-fleet package: `deploy` only reaches de_mavlink units, so the
  # 2.1 package goes up as a raw 1085 broadcast upload
  - {t: 10, do: send, ty: i, mt: 1085, tg: _AGN_,
     ms: {pkg: "{PKG:gpio_isolate_node.pkg.json}",
          hash: "{HASH:gpio_isolate_node.pkg.json}"}}
  - {t: 12, do: wait_journal, unit: node_a, re: "package READY",
     timeout: 30}
  - {t: 12, do: wait_journal, unit: node_b, re: "package READY",
     timeout: 30}
  - {t: 15, do: start}
  - {t: 16, do: wait_journal, unit: node_a, re: "RUN run .* started",
     timeout: 30}
  - {t: 16, do: wait_journal, unit: node_b, re: "RUN run .* started",
     timeout: 30}
  - {t: 22, do: write_file, unit: node_a, module: de_gpio,
     path: gpio_inputs.json, json: {"17": 1, "27": 1}}
  - {t: 25, do: wait_journal, unit: node_a, re: "S: lit activated",
     timeout: 30}
  - {t: 30, do: event, event: gpio.led.on}
  - {t: 32, do: send, ty: i, mt: 1061, tg: _AGN_,
     ms: {d: "gpio.led.on"}}
  - {t: 36, do: wait, seconds: 5}
  - {t: 42, do: stop}
assert:
  # node_a: its own emit still actuates exactly once
  - journal_count: {unit: node_a, re: "S: lit activated", equals: 1}
  - journal_count: {unit: node_a, re: "S: lit emit gpio\\.led\\.on",
                    equals: 1}
  - journal_count: {unit: node_a,
                    re: "EVENT_IN event gpio\\.led\\.went_on latched",
                    equals: 1}
  - journal_count: {unit: node_a, re: "state gpio\\.led = 1",
                    at_least: 1}
  # node_b: nothing arrived - no latched gpio.led event, no led state
  - journal_count: {unit: node_b, re: "EVENT_IN event gpio\\.led",
                    equals: 0}
  - journal_count: {unit: node_b, re: "state gpio\\.led = 1",
                    equals: 0}
teardown: none
