# gpio/gpio_concurrent_pins - TASK-PF-01 acceptance: per-resource
# claims. The gpio advert flags every per-pin action claim:"action", so
# a_led (gpio.led) and b_flash (gpio.flash) hold different claim keys
# and run concurrently; c_led wants the same gpio.led key and is
# refused 'claim_conflict gpio.led held by a_led'.
version: 1
name: gpio_concurrent_pins
transport: fake
operation: ../../packages/gpio_concurrent_pins.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 20
fleet:
  - {id: actor, cls: static_gpio}
timeline:
  # restart de_gpio first: a repeated run needs led/flash off or the
  # went_on edges the asserts count never happen
  - {t: 0, do: restart, unit: actor, proc: de_gpio}
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  # one fire activates all three sensor missions at once: a_led and
  # b_flash coexist on distinct claim keys, c_led is refused
  - {t: 20, do: fire, event: go.pins, unit: actor}
  - {t: 25, do: wait_journal, unit: actor,
     re: "S: a_led on ok", timeout: 30}
  - {t: 30, do: wait_journal, unit: actor,
     re: "S: b_flash on ok", timeout: 30}
  - {t: 35, do: stop}
assert:
  - journal_count: {unit: actor, re: "S: a_led activated", equals: 1}
  - journal_count: {unit: actor, re: "S: b_flash activated", equals: 1}
  - journal_count: {unit: actor, re: "S: c_led activated", equals: 0}
  # the refusal names the per-resource claim key, not the namespace
  - journal_count: {unit: actor,
                    re: "claim_conflict gpio\\.led held by a_led",
                    equals: 1}
  - journal_count: {unit: actor, re: "claim_conflict gpio held by",
                    equals: 0}
  - journal_count: {unit: actor, re: "S: a_led on ok", equals: 1}
  - journal_count: {unit: actor, re: "S: b_flash on ok", equals: 1}
  - journal_count: {unit: actor,
                    re: "ACTION_RESULT .* ok \\(gpio\\.led\\)",
                    equals: 1}
  - journal_count: {unit: actor,
                    re: "ACTION_RESULT .* ok \\(gpio\\.flash\\)",
                    equals: 1}
  - journal_count: {unit: actor, re: "failed:", equals: 0}
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.led\\.went_on latched",
                    at_least: 1}
  - journal_count: {unit: actor,
                    re: "EVENT_IN event gpio\\.flash\\.went_on latched",
                    at_least: 1}
teardown: none
