# sound/sound_isolation - TASK-EV-SND + GF-01/GF-02: a remote unit's
# Sync_EventFire frames must never actuate this unit's sound module.
# A fleet package is deployed: node_a (role speaker) emits
# sound.beep.play; the declared event republishes to the fleet bus, so
# node_b's supervisor latches it and its 'heard' mission marks
# scope.heard - proof the event DID cross the wire. What must not
# happen: node_b's de_sound module seeing it - its stdout shows zero
# sound.beep.* traffic and no "event ignored" note.
version: 1
name: sound_isolation
transport: fake
operation: ../../packages/snd_isolate.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 20
fleet:
  - {id: node_a, cls: static, modules: [de_sound]}
  - {id: node_b, cls: static, modules: [de_sound]}
timeline:
  - {t: 10, do: deploy}
  - {t: 15, do: start}
  - {t: 20, do: wait_journal, unit: node_a,
     re: "S: talk gate g released by sound\\.beep\\.finished",
     timeout: 40}
  # node_b's supervisor heard the republished command and ran 'heard'
  - {t: 25, do: wait_journal, unit: node_b, re: "S: heard activated",
     timeout: 30}
  - {t: 30, do: wait, seconds: 5}
  - {t: 36, do: stop}
assert:
  # node_a: its own emit drove its own module end to end
  - journal_count: {unit: node_a, re: "S: talk activated", equals: 1}
  - journal_count: {unit: node_a, re: "S: talk emit sound\\.beep\\.play",
                    at_least: 1}
  - journal_count: {unit: node_a,
                    re: "S: talk gate g released by sound\\.beep\\.finished",
                    equals: 1}
  - journal_count: {unit: node_a, re: "S: talk emit sound\\.spk_done",
                    equals: 1}
  - module_log_count: {unit: node_a, module: de_sound,
                       re: "sound\\.beep\\.finished.*done", at_least: 1}
  # node_b: the event crossed the fleet bus to its supervisor ...
  - journal_count: {unit: node_b,
                    re: "EVENT_IN event sound\\.beep\\.play latched",
                    at_least: 1}
  - journal_count: {unit: node_b, re: "S: heard activated", equals: 1}
  - journal_count: {unit: node_b, re: "S: heard emit scope\\.heard",
                    equals: 1}
  # ... but never reached its sound module (GF-01/GF-02 drop remote 1061
  # frames before module delivery): no facts emitted, nothing ignored
  - module_log_count: {unit: node_b, module: de_sound,
                       re: "sound\\.beep\\.", equals: 0}
  - module_log_count: {unit: node_b, module: de_sound,
                       re: "sound event ignored", equals: 0}
teardown: none
