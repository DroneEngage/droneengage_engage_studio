# faults/module_crash_midop - de_mavlink dies mid-mission: the FC keeps
# executing the already-uploaded segment (AUTO is an FC mode - it does
# not need the broker), de_comm stays up, and a module restart 15 s
# later re-bridges the unit in time for the supervisor to still journal
# "mission main completed" exactly once. Proves a module crash is not
# an op failure: the mission telemetry path resumes where it left off.
version: 1
name: f_module_crash_midop
transport: fake
operation: ../../packages/copter_square.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  - {t: 30, fault: module_kill, unit: c1, module: de_mavlink}
  - {t: 45, fault: restart, unit: c1, proc: de_mavlink}
  - {t: 55, do: wait_journal, unit: c1, re: "mission main completed",
     timeout: 240}
assert:
  - proc_alive: {unit: c1, proc: de_mavlink}
  - proc_alive: {unit: c1, proc: de_comm}
  - journal_count: {unit: c1, re: "mission main completed", equals: 1}
teardown: land
