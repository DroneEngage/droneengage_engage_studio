# faults/battery_low_rtl - low battery mid-mission: the p2_10_handlers
# wide_search is airborne when the battery collapses. The supervisor's
# battery_low keys on remaining PERCENT (sv_battery_low_pct 25), which
# the FC derives from consumed mAh vs BATT_CAPACITY - so the fault sets
# BATT_CAPACITY=50 mAh (remaining -> 0%; must stay >10 mAh or the FC
# reports the reading invalid) plus a 10.5 V sag for the telemetry side.
# Five seconds under the threshold fires "handler battery_low fired
# ... -> rtl", pauses the run ("paused (handler:battery_low)") and the
# FC takes the rtl backstop - the declared policy, not a journal note.
# The battery self-test (faults/battery.yaml) proves the voltage
# injection; this proves the op-level reaction.
version: 1
name: f_battery_low_rtl
transport: fake
operation: ../../packages/p2_10_handlers.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  # dur_s must cover timeline+settle+asserts: telemetry_value reads the
  # LATEST row, so a restore before the assert window would undo the
  # sag. The runner's finally still fires the restore at teardown.
  - {t: 20, fault: battery, unit: c1, volts: 10.5, cap_mah: 50,
     dur_s: 200}
  - {t: 30, do: wait_journal, unit: c1, re: "handler battery_low fired",
     timeout: 90}
  - {t: 40, do: wait_journal, unit: c1, re: "NavMode", timeout: 60}
assert:
  - journal_count: {unit: c1, re: "handler battery_low fired.*-> rtl",
                    equals: 1}
  - journal_count: {unit: c1, re: "paused \\(handler:battery_low\\)",
                    equals: 1}
  - journal_count: {unit: c1, re: "NavMode confirmed", at_least: 1}
  # bat_v relaxes back toward full once the FC disarms (SITL resets
  # consumed_mah), so the sag is only provable as min() of the series.
  - telemetry_value: {unit: c1, field: bat_v, lt: 11.0, pick: min}
teardown: reset
