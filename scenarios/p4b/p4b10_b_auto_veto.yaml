# p4b/p4b10_b_auto_veto - TASK-P4B-10 acceptance B: same SAR op, person
# confirm switched to {auto_with_veto: 30}. No operator confirm rule is
# configured, so the person target must confirm ITSELF ~30 s after it
# enters the world model (WM_STATE ... confirmed by auto_with_veto).
# The launch + drop approvals are NOT covered by the veto - a ground
# launch is operator-gated only in the supervisor (sv_core.cpp forces
# policy "operator" on launch requests) - the bot still approves both.
#
# Op:   packages/sar_forest_veto.deploy.json (same fleet, person
#       auto_with_veto 30 in the op variant).
# World/chain: identical to p4b10_a_nominal.
version: 1
name: p4b10_b_auto_veto
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest_veto.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 180
operator:
  # deliberately NO confirm:/dismiss: rule for person - auto_with_veto
  # must do the confirming without the operator
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "all", re: "WM_NEW .* cls=phone",
     timeout: 240}
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 120}
  # no operator: the veto window confirms the person ~30 s after WM_NEW
  - {t: 45, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by auto_with_veto", timeout: 480}
  - {t: 50, do: wait_journal, unit: "amb1", re: "APPROVAL_REQ launch",
     timeout: 120}
  - {t: 55, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 600}
  - {t: 60, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 240}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  - journal_count: {unit: "all", re: "WM_NEW .* cls=phone", at_least: 1}
  - journal_count: {unit: "all", re: "WM_NEW .* cls=person", at_least: 1}
  # the veto window ran on a journaled clock form (VETO_CLOCK <tid>
  # <form> is emitted once per pending/confirmed auto_with_veto target)
  - journal_count: {unit: "all", re: "VETO_CLOCK", at_least: 1}
  # confirmed 30 s after the FIRST DETECTION (fleet-stamped); the world
  # model sees it ~2 s later (debounce), so measured from WM_NEW the
  # window is 28 s - min_s 26 gives measurement slack,
  # with no operator decision (spec bound)
  - journal_time_delta: {u1: s1, re1: "WM_NEW .* cls=person",
                         u2: s1,
                         re2: "WM_STATE .* confirmed by auto_with_veto",
                         min_s: 26, max_s: 32, ordered: true}
  - journal_count: {unit: "all",
                    re: "WM_STATE .* confirmed by auto_with_veto",
                    at_least: 1}
  # the operator never issued a world decision this run
  - operator_log_count: {re: "WORLD confirmed", equals: 0}
  - journal_count: {unit: "all", re: "WM_STATE .* confirmed by operator",
                    equals: 0}
  # the launch approval is still required and journaled
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 1}
  - journal_count: {unit: "amb1", re: "APPROVAL_OK .* by", at_least: 1}
  - operator_log_count: {re: "APPROVAL approve", at_least: 1}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - distance_to: {unit: "amb1", re: "emit payload\\.dropped",
                  truth: [person_1], max_m: 15}
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind
teardown: land
