# p4b/p4b10_h_decomm_restart - TASK-P4B-10 acceptance H: s1's de_comm is
# restarted in the middle of its allocated sector segment; the unit must
# resync from the persisted package and keep the lane - no lost claim,
# no duplicate run.
#
# Fault: restart proc de_comm on s1 while it flies its claimed sector.
# de_comm is the module that owns the supervisor + package + journal, so
# the restart kills the mission runtime but not SITL; the saved v2
# package is restored at boot (P2-11 persist/resync path):
#   boot: v2 package restored - READY (no FC upload)
#   resync: checking FC mission (...)        <- only if a resync check
#   resync: FC mission verified - reading FC state    is needed
# and the dynamic-sector machinery picks the lane back up (the FC
# mission was already uploaded, so the restart is journal-clean).
#
# The restart must NOT produce: a second RUN (the run id is persisted
# with the package), an ORPHAN (the fleet's peer-lost window is raised
# to 60 s - the de_comm default sv_peer_lost_s is only 15 s, which a
# restart+resync could exceed and turn this scenario into a takeover
# test instead), or a duplicate CLAIM for the same lane.
version: 1
name: p4b10_h_decomm_restart
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  # confirm late on purpose: s1 must finish its restored sector before
  # the drop ends the op (OP_END rtl would cut the segment short)
  confirm: {person: {after_s: 600}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0},
     config: {de_comm: {sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60},
     config: {de_comm: {sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60},
     config: {de_comm: {sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0},
     config: {de_comm: {sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60},
     config: {de_comm: {sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true,
                        sv_peer_lost_s: 60, sv_roster_ttl_s: 60}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  - {t: 35, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 240}
  # genuinely mid-sector: the dynamic segment is uploaded and active,
  # and s1 has flown a few waypoints of it
  - {t: 50, do: wait_journal, unit: "s1",
     re: "mission sector_scan\\|0 active", timeout: 300}
  - {t: 52, do: wait, seconds: 30}
  # s1 is mid-sector now: bounce its de_comm
  - {t: 60, fault: restart, unit: "s1", proc: de_comm}
  - {t: 70, do: wait_journal, unit: "s1",
     re: "boot: v2 package restored", timeout: 120}
  # the restored segment runs to completion on s1
  - {t: 75, do: wait_journal, unit: "s1", re: "PROGRESS .*:[0-9]+ complete",
     timeout: 900}
  # the op still completes - s1's lane included
  - {t: 80, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 600}
  - {t: 85, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 600}
  - {t: 90, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 240}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  # de_comm died and came back
  - proc_alive: {unit: "s1", proc: de_comm}
  # package restored at boot; if a resync check ran it verified clean
  - journal_count: {unit: "s1", re: "boot: v2 package restored",
                    at_least: 1}
  - journal_count: {unit: "s1", re: "resync: FC mission mismatch",
                    equals: 0}
  - journal_count: {unit: "s1", re: "resync: FC mission verified",
                    equals: 1}
  # the run resumed tracking the SAME dynamic segment (FC still in AUTO
  # inside it) - it did not park
  - journal_count: {unit: "s1",
                    re: "restored as RUNNING - FC in AUTO at seq",
                    equals: 1}
  - journal_count: {unit: "s1", re: "restored as PAUSED", equals: 0}
  # ... and finished it: the lane progress reached complete on s1 itself
  # (no lane handed to anyone else)
  - journal_count: {unit: "s1", re: "PROGRESS .*:[0-9]+ complete",
                    equals: 1}
  # exactly ONE run - the restart did not start a second one
  - journal_count: {unit: "s1", re: "RUN run .* started", equals: 1}
  # no takeover fired for s1's lane: the restart (seconds) stayed inside
  # the peer-lost window, so the fleet never saw s1 as lost
  - journal_count: {unit: "all", re: "ORPHAN|TAKEOVER|CLAIM_LOST",
                    equals: 0}
  # s1 still holds exactly one lane claim for this allocation - no
  # duplicate claim after the resync
  - journal_count: {unit: "s1", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  # the dynamic segment continued to completion
  - journal_count: {unit: "s1", re: "GEN .* items", at_least: 1}
  # the op ended normally
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind
teardown: land
