# p4b/p4b10_d_gcs_out - TASK-P4B-10 acceptance D: the GCS drops while
# the sector scan runs; allocation must proceed through the vehicle
# coordinator, and operator work resumes when the session returns.
#
# The operator bot (a real GCS session on the fake server) is held
# offline for 75 s right after the run starts, sized to cover the
# sdr-signal -> ALLOC window: the ALLOC_ASSIGN/CLAIM wait_journals have
# deadlines inside the blackout, so a match proves the fleet allocated
# with no ground station in the loop (bids + coordinator publish are
# vehicle-to-vehicle bus envelopes).
#
# Note on the spec wording "approvals raised during the blackout WAIT":
# in this op variant the launch approval can only be raised AFTER the
# person is operator-confirmed, and the confirm itself is a bot action -
# so no approval can be raised while the bot is down. What is provable:
# the requests that arrive after reconnect are journaled
# (APPROVAL_REQ -> APPROVAL_OK ordering), and the op completes. The
# blackout is kept under the op's 90 s approval_timeout_s
# (op.params) so no pending request can time out mid-run either.
version: 1
name: p4b10_d_gcs_out
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 180
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     config: {de_comm: {sv_allow_auto_launch: true}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300}
  - {t: 30, do: wait_journal, unit: "all", re: "RUN run .* started",
     timeout: 120}
  # blackout t=32..107: the alloc waits must resolve inside it
  - {t: 32, fault: gcs_disconnect, dur_s: 75}
  - {t: 35, do: wait_journal, unit: "s1,s2,s3",
     re: "ALLOC_ASSIGN .* coord ", timeout: 70}
  - {t: 40, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 60}
  # after reconnect the op runs normally to the end
  - {t: 45, do: wait_journal, unit: "all",
     re: "WM_STATE .* confirmed by operator", timeout: 480}
  - {t: 50, do: wait_journal, unit: "amb1", re: "emit payload\\.dropped",
     timeout: 480}
  - {t: 55, do: wait_journal, unit: "all", re: "OP_END payload\\.dropped",
     timeout: 240}
  # let the RTL/LAND mode reach the status the final_state asserts read
  - {t: 99, do: wait, seconds: 25}
assert:
  # the session really went down and came back once
  - operator_log_count: {re: "FAULT gcs_disconnect", equals: 1}
  - operator_log_count: {re: "SESSION .* online \\(reconnect\\)",
                         equals: 1}
  # allocation proceeded via a vehicle coordinator while the GCS was
  # down - no deterministic fallback was needed
  - journal_count: {unit: "s1,s2,s3", re: "ALLOC_BID", at_least: 1}
  - journal_count: {unit: "s1,s2,s3", re: "ALLOC_ASSIGN .* coord ",
                    at_least: 1}
  - journal_count: {unit: "all", re: "ALLOC_FALLBACK", equals: 0}
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  # approvals raised after the blackout resolve in order - request
  # journaled before the grant (the grant can only land after SESSION
  # online: see the header note for the un-expressible cross-log timing)
  - journal_order: {unit: "amb1", first: "APPROVAL_REQ launch",
                    then: "APPROVAL_OK"}
  - journal_order: {unit: "amb1", first: "APPROVAL_REQ action",
                    then: "APPROVAL_OK"}
  - journal_count: {unit: "amb1", re: "APPROVAL_TIMEOUT", equals: 0}
  # the op completed end to end after reconnect
  - journal_count: {unit: "all", re: "OP_END payload\\.dropped", equals: 1}
  - journal_count: {unit: "amb1", re: "emit payload\\.dropped", equals: 1}
  - final_state: {unit: "amb1,s1,s2,s3,sdr1", fc_mode: [RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, LOITER, RTL, LAND]}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind
teardown: land
