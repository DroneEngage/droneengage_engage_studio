# p4b/p4b10_g_no_autolaunch - TASK-P4B-10 acceptance G: the site switch
# de_comm.sv_allow_auto_launch is OFF on amb1, so the op's trigger
# activation for the ambulance must be refused even though the same op
# launched it automatically in scenario A.
#
# The refusal is journaled on amb1 as
#   activation of '<candidate>' refused: auto-launch disabled by site
#   config
# (sv_core / sv_supervisor start-activation path - the candidate is only
# refused when it is a start:"ground" auto_launch role, which amb1 is).
# With no launch there is no deliver activation, no drop, no
# payload.dropped -> OP_END stays 0. The rest of the fleet runs the
# SAR chain normally (this is a site-safety posture, not a fleet
# stop); the operator could still take over manually - not automated
# here.
version: 1
name: p4b10_g_no_autolaunch
seed: 7
transport: fake
world: ../../worlds/sar_forest.yaml
operation: ../../packages/sar_forest.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 120
operator:
  approve: {launch: {after_s: 2}, action: {after_s: 2}}
  confirm: {person: {after_s: 3}}
fleet:
  - {id: scout1, cls: copter, params: {BATT_CAPACITY: 50000}, role: cam_scout, modules: [stub_ai_box],
     at: {north_m: 0, east_m: 0}}
  - {id: sdr1, cls: copter, params: {BATT_CAPACITY: 50000}, role: sdr_scout, modules: [stub_sdr],
     at: {north_m: 0, east_m: 60}}
  - {id: s1, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: -60}}
  - {id: s2, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 0}}
  - {id: s3, cls: copter, params: {BATT_CAPACITY: 50000}, role: searcher, modules: [stub_ai_box],
     at: {north_m: -80, east_m: 60}}
  - {id: amb1, cls: copter, params: {BATT_CAPACITY: 50000}, role: ambulance, modules: [stub_payload],
     at: {north_m: -130, east_m: 0},
     # the site switch under test: default de_comm policy, refused on
     # trigger activation for this auto_launch role
     config: {de_comm: {sv_allow_auto_launch: false}}}
timeline:
  - {t: 0, do: wait_online, timeout: 180}
  - {t: 2, do: mode, unit: "all", mode: GUIDED}
  - {t: 5, do: deploy, timeout: 300}
  - {t: 15, do: wait_ready, unit: "all", timeout: 240}
  - {t: 20, do: arm, unit: "scout1,sdr1,s1,s2,s3"}
  - {t: 25, do: start, timeout: 300, expect_fail: [amb1]}
  # amb1 never reports "RUN started": its start:ground auto_launch role
  # stays READY (the refusal under test) - wait on the flying five
  - {t: 30, do: wait_journal, unit: "scout1,sdr1,s1,s2,s3",
     re: "RUN run .* started", timeout: 120}
  - {t: 35, do: wait_journal, unit: "s1,s2,s3",
     re: "CLAIM .* index [0-9]+ of 3", timeout: 240}
  - {t: 40, do: wait_journal, unit: "scout1,sdr1,s1,s2,s3",
     re: "WM_STATE .* confirmed by operator", timeout: 600}
  # with the site switch off the ambulance refuses the run start itself
  # (a ground-start role is only exempt from the armed gate when
  # sv_allow_auto_launch is on) - the reason is journaled on amb1
  - {t: 45, do: wait_journal, unit: "amb1",
     re: "auto-launch disabled by site config", timeout: 120}
  # the searchers still fly their sectors (lane progress is emitted)
  - {t: 50, do: wait_journal, unit: "s1,s2,s3",
     re: "BUS_OUT .* n=sys\\.alloc\\.progress", timeout: 480}
assert:
  # the refusal reason is journaled on the refused unit
  - journal_count: {unit: "amb1",
                    re: "START .* refused - auto-launch disabled by site config",
                    at_least: 1}
  # the ambulance never launched - no deliver activation, no launch
  # stepper, no nav command; its FC stays in a ground mode. (The
  # sensor:true report_drop lane may still activate as
  # "S: report_drop activated" - a ground-side watcher, not a launch.)
  - journal_count: {unit: "amb1",
                    re: "activating mission deliver|launch: |NavMode|takeoff",
                    equals: 0}
  - journal_count: {unit: "amb1", re: "APPROVAL_REQ launch", equals: 0}
  - final_state: {unit: "amb1", fc_mode: [STABILIZE, GUIDED, LAND]}
  # nothing dropped, the target is not served, the op cannot end
  - journal_count: {unit: "all", re: "emit payload\\.dropped", equals: 0}
  - journal_count: {unit: "all", re: "WM_STATE .* served", equals: 0}
  - journal_count: {unit: "all", re: "OP_END", equals: 0}
  # the rest of the fleet still completed the SAR chain
  - journal_count: {unit: "s1,s2,s3", re: "CLAIM .* index [0-9]+ of 3",
                    equals: 1}
  - journal_count: {unit: "s1,s2,s3", re: "BUS_OUT .* n=sys\\.alloc\\.progress",
                    at_least: 1}
  - final_state: {unit: "s1,s2,s3,sdr1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - final_state: {unit: "scout1", fc_mode: [AUTO, GUIDED, LOITER, RTL, LAND]}
  - fc_items_unchanged_without_cause:
      {unit: "all",
       cause_re: "MISSION_(WRITE|UPLOAD|ACK)|fc mission|FC mission|mission.*upload|upload"}
  # amb1 stays parked so sep is trivially safe; the check is kept on for
  # the flying five
  # the op's own separation params (op.params min_hsep_m/min_vsep_m)
  - no_sep_violation: {unit: "all", h_m: 25, v_m: 6}
  # TODO P4B-10: action-id uniqueness needs a check kind
teardown: land
