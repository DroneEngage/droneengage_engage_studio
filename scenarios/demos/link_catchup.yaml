# Runbook: scenarios/demos/link_catchup.md
# demos/link_catchup - two scouts share a find; one loses its link mid-emit and still activates on catch-up
#
# promoted from tests/fleet_bus/p4a05_catchup.yaml (CI original unchanged).

version: 1
name: link_catchup
realtime: true
transport: {type: fake, seed: 1337}
operation: ../../tests/packages/p4a05.deploy.json
fleet:
  - {id: copter1, cls: copter}
  - {id: copter2, cls: copter}
  - {id: copter3, cls: copter}
timeline:
  - {t: 0, do: stop}
  - {t: 0, do: clear}
  - {t: 0, do: mode, unit: all, mode: GUIDED}
  - {t: 0, do: deploy}
  - {t: 0, do: arm, unit: all}
  - {t: 0, do: opstart}
  # rosters (sv_roster_hz 0.2 -> one per 5 s) teach the scout its
  # recipients before the emit
  - {t: 0, do: wait, seconds: 15}
  - {t: 0, fault: link_cut, unit: 2, dur_s: 60}
  - {t: 0, do: wait, seconds: 2}
  - {t: 0, do: fire, event: go.now, unit: 1, until: "BUS_OUT.*n=area\\.clear"}
  - {t: 0, do: wait_journal, unit: 3, re: "activating mission work", timeout: 60}
  - {t: 0, do: wait_journal, unit: 2, re: "comm line online", timeout: 120}
  - {t: 0, do: wait_journal, unit: 2, re: "activating mission work", timeout: 60}
  - {t: 0, do: wait, seconds: 5}

  - {t: 0, do: opabort}

settle_s: 0
assert:
  - journal_count: {unit: 2, re: "activating mission work", equals: 1}
  - journal_count: {unit: 3, re: "activating mission work", equals: 1}
  - journal_count: {unit: 1, re: "UNDELIVERED", equals: 0}
  - journal_count: {unit: 1, re: "^DELIVERED.*n=area\\.clear", at_least: 1}
  # "within a few seconds" of the link returning (record the number)
  - journal_time_delta: {u1: 2, re1: "comm line online", u2: 2, re2: "activating mission work", max_s: 15}
