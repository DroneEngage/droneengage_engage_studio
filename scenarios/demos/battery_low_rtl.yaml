# Runbook: scenarios/demos/battery_low_rtl.md
# demos/battery_low_rtl - low battery mid-search: the copter's declared handler lands it home, not a journal note
#
# promoted from tests/faults/battery_low_rtl.yaml (CI original unchanged).

version: 1
name: battery_low_rtl
transport: fake
operation: ../../tests/packages/p2_10_handlers.json
verify: {cli: ../../tools/verify_wrap.js}
settle_s: 30
fleet:
  - {id: c1, cls: copter}
timeline:
  - {t: 0, do: mode, unit: c1, mode: GUIDED}
  - {t: 2, do: deploy}
  - {t: 6, do: arm, unit: c1}
  - {t: 9, do: start}
  - {t: 15, do: wait_journal, unit: c1, re: "RUN run .* started",
     timeout: 60}
  # dur_s must cover timeline+settle+asserts: telemetry_value reads the
  # LATEST row, so a restore before the assert window would undo the
  # sag. The runner's finally still fires the restore at teardown.
  - {t: 20, fault: battery, unit: c1, volts: 10.5, cap_mah: 50,
     dur_s: 200}
  - {t: 30, do: wait_journal, unit: c1, re: "handler battery_low fired",
     timeout: 90}
  - {t: 40, do: wait_journal, unit: c1, re: "NavMode", timeout: 60}
assert:
  - journal_count: {unit: c1, re: "handler battery_low fired.*-> rtl",
                    equals: 1}
  - journal_count: {unit: c1, re: "paused \\(handler:battery_low\\)",
                    equals: 1}
  - journal_count: {unit: c1, re: "NavMode confirmed", at_least: 1}
  # bat_v relaxes back toward full once the FC disarms (SITL resets
  # consumed_mah), so the sag is only provable as min() of the series.
  - telemetry_value: {unit: c1, field: bat_v, lt: 11.0, pick: min}
teardown: reset
