# p5/world_canopy_viewer - P5-14 manual acceptance: world_canopy_sweep
# with the Mavlink3DMap viewer live. render mode viewer (not headless)
# makes sim up launch udp2websocket.js + a vite dev server from
# $MAVLINK3DMAP_DIR under run/<sim>/render/ and print:
#   http://127.0.0.1:<8070+slot>/?world=ws://127.0.0.1:<61000+slot>
#                                  &mavlink=ws://127.0.0.1:<8801+slot>
#
# Manual checklist (review note):
#   - person_hut is shown as an occluded OUTLINE - every look row it
#     produces is why "occluded" (the sweep's negative control);
#   - person_open is found: a yellow world-model target pin + ring
#     lands on it (bot.targets() overlay at 1 Hz);
#   - the copter visibly flies the three lawnmower legs over the
#     canopy, the open ground and the hut;
#   - everything renders with the network cable pulled - obstacles,
#     entities and overlays come from the world stream, the ground
#     texture from frontend/public (no Mapbox, no CDN).
version: 1
name: world_canopy_viewer
seed: 7
transport: fake
world: ../../worlds/forest_canopy.yaml
operation: ../../packages/p5_canopy_sweep.deploy.json
render: {mode: viewer, headless: false}
verify: {cli: ../support/verify_wrap.js}
settle_s: 20
fleet:
  - {id: cam1, cls: copter, modules: [stub_ai_box]}
timeline:
  - {t: 0, do: mode, unit: cam1, mode: GUIDED}
  - {t: 2, do: deploy, timeout: 120}
  - {t: 4, do: wait_ready, unit: cam1, timeout: 120}
  - {t: 6, do: arm, unit: cam1}
  - {t: 9, do: start}
  - {t: 10, do: wait_journal, unit: cam1,
     re: "mission main completed", timeout: 300}
assert:
  - detection_recall: {truth: person_open, min: 1}
  - detection_recall: {truth: person_hut, max: 0}
  - detection_recall: {truth: person_canopy, max: 1}
  - time_to_detect: {truth: person_open, max_s: 120}
  - detection_precision: {cls: person, min: 0.8, unit: cam1}
  - distance_to: {unit: cam1, re: "detect\\.detected",
                  detected_cls: person,
                  truth: [person_open, person_canopy], max_m: 25}
  - coverage_complete: {area: sector_a, cell_m: 5, min: 0.95,
                        unit: cam1}
  - pod_mean: {area: sector_a, cell_m: 5, min: 0.8}
  - pod_at: {truth: person_open, min: 0.9,
             poly: [[-35.363118, 149.166019], [-35.363028, 149.166019],
                    [-35.363028, 149.166129], [-35.363118, 149.166129]]}
  - pod_at: {truth: person_canopy, min: 0.5,
             poly: [[-35.362804, 149.166019], [-35.362714, 149.166019],
                    [-35.362714, 149.166129], [-35.362804, 149.166129]]}
  - pod_at: {truth: person_hut, max: 0,
             poly: [[-35.362445, 149.166019], [-35.362355, 149.166019],
                    [-35.362355, 149.166129], [-35.362445, 149.166129]]}
teardown: land
