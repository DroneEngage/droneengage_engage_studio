# p5/world_sdr_canopy - P5-10 acceptance 2: a comm-only mast runs
# stub_sdr 30 m west of the wood_n crown at ground level. The
# phone_canopy emitter sits 8 m up inside the crown, so the ray the
# model ranges on crosses ~18.7 m of the wood_n band: 5.8 dB of crown
# loss. The -70 dBm gate that closes at 71 m free-space closes at
# ~43 m with the foliage (worlds/forest_canopy.yaml works the number
# out), and the phone sits 30 m out - inside the reduced range, so
# sdr.signal fires and every signal is stamped while the truth put the
# phone within the reduced 43 m gate (signals_in_range). radius_m
# keeps de_sdr's free-space inversion (D10): the event reports ~51 m
# while the phone is 31 m away - the oversized radius the allocator
# must cope with.
version: 1
name: world_sdr_canopy
seed: 7
transport: fake
world: ../../worlds/forest_canopy.yaml
operation: ../../packages/p5_sdr.deploy.json
verify: {cli: ../support/verify_wrap.js}
settle_s: 25
fleet:
  - {id: mast, cls: static, modules: [stub_sdr],
     base: [-35.362750, 149.165733, 584, 0]}
timeline:
  - {t: 0, do: deploy}
  - {t: 5, do: start}
  - {t: 10, do: wait_journal, unit: mast,
     re: "EVENT_IN.*sdr\\.signal", timeout: 240}
  - {t: 200, do: stop}
assert:
  - signals_in_range: {unit: mast, re: "EVENT_IN.*sdr\\.signal",
                       truth: phone_canopy, max_m: 43, min_count: 1}
  - journal_count: {unit: mast, re: "emit phone\\.signal", at_least: 1}
  - no_fc_command_to_static: {unit: mast}
teardown: none
